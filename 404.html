<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#202426">
    <title>Đang mở trang - Thuận Store</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background: #202426;
            color: #f4f1e8;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            text-align: center;
            background: #202426;
        }
        main { max-width: 34rem; }
        h1 { margin: 0 0 0.75rem; font-size: clamp(1.4rem, 5vw, 2rem); }
        p { margin: 0; color: #c8c2b5; font-size: 1rem; line-height: 1.6; }
        a { color: #f4f1e8; }
    </style>
    <script>
        (() => {
            const pages = new Set([
                'ai-danh-muc', 'ai-noi-dung', 'ai-quang-cao', 'ai-video', 'ai-website',
                'ai', 'baogia', 'do-luong', 'gioithieu', 'huongdan', 'index',
                'lichdituyen', 'lienhe', 'livestream', 'marketplace', 'quangcao',
                'seo', 'tiktok', 'tinhthue', 'website'
            ]);
            const path = window.location.pathname;
            const slash = path.lastIndexOf('/');
            const base = path.slice(slash + 1).replace(/\/+$/u, '');
            if (base && !base.includes('.') && pages.has(base.toLowerCase())) {
                const target = `${path.slice(0, slash + 1)}${base}.html${window.location.search}${window.location.hash}`;
                window.location.replace(target);
                return;
            }
            window.setTimeout(() => {
                const home = `${path.slice(0, slash + 1)}index.html`;
                window.location.replace(home);
            }, 1200);
        })();
    </script>
</head>
<body>
    <main>
        <h1>Thuận Store</h1>
        <p>Đang mở đúng trang. <a href="index.html">Về trang chủ</a></p>
    </main>
</body>
</html>
