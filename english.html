<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AmeriLingo - Tiếng Anh U40</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
            color: #0f172a;
        }
        
        .btn-press:active { transform: scale(0.96); }
        
        .speaking {
            background-color: #10b981 !important; 
            color: white !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            animation: pulse 1s infinite;
        }
        
        .listening {
            background-color: #ef4444 !important; /* Đỏ khi đang thu âm */
            color: white !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="w-full min-h-screen">

    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-opacity duration-300 z-50 pointer-events-none shadow-lg whitespace-nowrap">
        Thông báo
    </div>

    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="homeScreen" class="block w-full max-w-2xl mx-auto min-h-screen bg-slate-100 flex flex-col pb-10">
        <!-- Header -->
        <header class="bg-blue-900 text-white p-6 rounded-b-3xl shadow-md sticky top-0 z-40">
            <h1 class="text-3xl font-black uppercase tracking-tight mb-1">Tiếng Anh U40</h1>
            <p class="text-blue-200 text-sm font-medium">Học nhẹ nhàng - Luyện nghe nói - Hòa nhập nhanh.</p>
        </header>

        <div class="px-4 mt-6">
            <!-- PHẦN 1: GIAO TIẾP HÀNG NGÀY -->
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-3 px-2">
                    <div class="w-2 h-6 bg-orange-500 rounded-full"></div>
                    <h2 class="text-lg font-black text-slate-800 uppercase tracking-wide">Giao Tiếp Hàng Ngày</h2>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="app.openCategory('chao_hoi')" class="btn-press bg-white border-2 border-slate-200 rounded-2xl p-4 text-left shadow-sm flex flex-col gap-2">
                        <div class="text-3xl">👋</div>
                        <div>
                            <h3 class="font-bold text-slate-800 leading-tight">Gọi Người & Nhờ Vả</h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Xin lỗi, Nhờ giúp đỡ, Lắng nghe</p>
                        </div>
                    </button>
                    <button onclick="app.openCategory('mua_sam')" class="btn-press bg-white border-2 border-slate-200 rounded-2xl p-4 text-left shadow-sm flex flex-col gap-2">
                        <div class="text-3xl">🛒</div>
                        <div>
                            <h3 class="font-bold text-slate-800 leading-tight">Mua Sắm</h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Hỏi giá, Tìm đồ, Trả hàng</p>
                        </div>
                    </button>
                    <button onclick="app.openCategory('an_uong')" class="btn-press bg-white border-2 border-slate-200 rounded-2xl p-4 text-left shadow-sm flex flex-col gap-2">
                        <div class="text-3xl">🍔</div>
                        <div>
                            <h3 class="font-bold text-slate-800 leading-tight">Ăn Uống</h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Gọi món, Tính tiền, Mang về</p>
                        </div>
                    </button>
                    <button onclick="app.openCategory('hoi_duong')" class="btn-press bg-white border-2 border-slate-200 rounded-2xl p-4 text-left shadow-sm flex flex-col gap-2">
                        <div class="text-3xl">🗺️</div>
                        <div>
                            <h3 class="font-bold text-slate-800 leading-tight">Hỏi Đường</h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Toilet ở đâu, Lạc đường, Gọi xe</p>
                        </div>
                    </button>
                </div>
            </div>

            <!-- PHẦN 2: CHUYÊN NGÀNH SINH TỒN -->
            <div>
                <div class="flex items-center gap-2 mb-3 px-2">
                    <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                    <h2 class="text-lg font-black text-slate-800 uppercase tracking-wide">Hành Trang Cuộc Sống</h2>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="app.openCategory('buu_dien')" class="btn-press bg-white border-2 border-blue-100 rounded-2xl p-5 text-left shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl bg-blue-50 p-2 rounded-xl">📦</div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Bưu Điện (USPS/UPS)</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Gửi hàng về VN, Đổi địa chỉ nhà, Mua tem</p>
                            </div>
                        </div>
                    </button>
                    
                    <button onclick="app.openCategory('dien_nuoc')" class="btn-press bg-white border-2 border-blue-100 rounded-2xl p-5 text-left shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl bg-blue-50 p-2 rounded-xl">💡</div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Điện, Nước & Internet</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Mở line điện/nước, Đóng tiền bill, Báo hư hỏng</p>
                            </div>
                        </div>
                    </button>

                    <button onclick="app.openCategory('kinh_doanh')" class="btn-press bg-white border-2 border-blue-100 rounded-2xl p-5 text-left shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl bg-blue-50 p-2 rounded-xl">🏦</div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Ngân hàng & Kinh doanh</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Lập công ty LLC, Mở thẻ, Nộp séc, Xin giấy phép</p>
                            </div>
                        </div>
                    </button>

                    <button onclick="app.openCategory('y_te')" class="btn-press bg-white border-2 border-blue-100 rounded-2xl p-5 text-left shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl bg-blue-50 p-2 rounded-xl">🏥</div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Y Tế & Mua Thuốc</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Gọi xe cứu thương, Xin giảm viện phí, Lấy thuốc</p>
                            </div>
                        </div>
                    </button>

                    <button onclick="app.openCategory('giay_to')" class="btn-press bg-white border-2 border-blue-100 rounded-2xl p-5 text-left shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl bg-blue-50 p-2 rounded-xl">🪪</div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Giấy tờ & Sở khanh (DMV)</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Thi bằng lái, Gia hạn thẻ xanh, Cảnh sát gọi</p>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH 2: DANH SÁCH BÀI HỌC -->
    <div id="lessonScreen" class="hidden w-full max-w-2xl mx-auto min-h-screen bg-slate-100 flex flex-col">
        <!-- Header Bài học -->
        <header class="bg-white px-4 py-4 flex items-center gap-4 sticky top-0 z-40 shadow-sm border-b border-slate-200">
            <button onclick="app.goHome()" class="btn-press w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 border border-slate-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h2 id="lessonTitle" class="text-xl font-black text-slate-800 uppercase">Chủ đề</h2>
        </header>

        <!-- Danh sách thẻ học -->
        <div class="flex-1 p-4 pb-20">
            <div class="bg-blue-50 text-blue-800 text-xs font-bold p-3 rounded-xl mb-6 border border-blue-200 text-center shadow-sm">
                💡 Cốt lõi của giao tiếp là Nghe & Nói. Bấm 🔊 Nghe, sau đó bấm 🎤 Nói để xem người Mỹ có hiểu bạn không nhé!
            </div>
            <div id="flashcardsContainer" class="space-y-6">
                <!-- Nội dung được sinh ra từ Javascript -->
            </div>
        </div>
    </div>

    <script>
        // --- CƠ SỞ DỮ LIỆU BỔ SUNG PHIÊN ÂM BỒI & XÓA CÂU VỚ VẨN ---
        const DATABASE = {
            // ======== NHÓM 1: GIAO TIẾP HÀNG NGÀY ========
            'chao_hoi': {
                title: 'Gọi Người & Nhờ Vả',
                items: [
                    { short: "Excuse me.", pronounce: "Ích-x-kiu mi", vi: "Làm phiền một chút / Xin lỗi cho hỏi.", tip: "Câu cực kỳ quan trọng để thu hút sự chú ý khi muốn hỏi người lạ hoặc gọi bồi bàn.", full: "Excuse me, sir/ma'am." },
                    { short: "Can you help me?", pronounce: "Can diu hép mi?", vi: "Bạn có thể giúp tôi không?", tip: "Khi gặp khó khăn, cứ nói thẳng câu này, người Mỹ sẽ dừng lại giúp bạn ngay.", full: "Could you please help me with this?" },
                    { short: "Sorry, I don't understand.", pronounce: "So-ri, ai đôn in-đờ-s-ten", vi: "Xin lỗi, tôi không hiểu.", tip: "Đừng gật đầu nếu không hiểu. Cứ nói câu này và lắc đầu.", full: "I am sorry, I do not understand what you mean." },
                    { short: "Please speak slowly.", pronounce: "P-li s-pích s-lô-ly", vi: "Làm ơn nói chậm lại.", tip: "Kết hợp với câu 'Tôi không hiểu', họ sẽ tự động dùng từ dễ và nói rất chậm cho bạn.", full: "Could you please speak a bit slower for me?" },
                    { short: "Where is it?", pronounce: "Que í-x-it?", vi: "Cái đó ở đâu vậy?", tip: "Công thức vàng để đi tìm bất cứ thứ gì. Chỉ cần gọi tên đồ vật và thêm 'where is it'.", full: "Could you point me to where it is located?" }
                ]
            },
            'mua_sam': {
                title: 'Đi Chợ & Mua Sắm',
                items: [
                    { short: "How much?", pronounce: "Hao mách?", vi: "Cái này bao nhiêu tiền?", tip: "Cầm món đồ lên và hỏi. Họ sẽ tự bấm máy tính hoặc chỉ vào bảng giá cho bạn xem.", full: "How much does this item cost?" },
                    { short: "Rice where?", pronounce: "Rai-x que?", vi: "Gạo ở đâu vậy?", tip: "Công thức tìm đồ ở Walmart/Costco: [Tên đồ vật] + [Where]. Quá dễ nhớ!", full: "Excuse me, could you tell me where the rice is?" },
                    { short: "I want return this.", pronounce: "Ai goăn ri-tơn đít", vi: "Tôi muốn trả lại món này.", tip: "Luật Mỹ cho phép trả hàng (Return) thoải mái. Nhớ mang theo hóa đơn (Receipt).", full: "I would like to return this item, please." },
                    { short: "Cash only? Or card?", pronounce: "Cát on-ly? O cạc?", vi: "Chỉ nhận tiền mặt? Hay quẹt thẻ được?", tip: "Một số tiệm của người Việt/Á châu chỉ nhận tiền mặt. Cần hỏi trước khi mua.", full: "Do you only accept cash, or can I pay with a credit card?" },
                    { short: "Need receipt, please.", pronounce: "Nít ri-xíp, p-li", vi: "Cho tôi xin hóa đơn.", tip: "Luôn giữ lại hóa đơn để đề phòng mua trúng đồ hư cần đổi trả.", full: "Could I get a copy of the receipt, please?" }
                ]
            },
            'an_uong': {
                title: 'Ăn Uống & Nhà Hàng',
                items: [
                    { short: "Table for two, please.", pronounce: "Tây-bồ pho tu, p-li", vi: "Bàn cho 2 người.", tip: "Vào nhà hàng Tây, phải đứng chờ ở cửa (Wait to be seated), nói số người để họ sắp bàn.", full: "I would like a table for two, please." },
                    { short: "Menu, please.", pronounce: "Me-niu, p-li", vi: "Cho xin thực đơn.", tip: "Vừa nói vừa làm động tác lật sách, bồi bàn sẽ mang thực đơn tới ngay.", full: "Could we see the menu, please?" },
                    { short: "I want this one.", pronounce: "Ai goăn đít goăn", vi: "Tôi muốn ăn món này.", tip: "Chỉ ngón tay thẳng vào hình ảnh món ăn trên thực đơn và nói.", full: "I would like to order this dish." },
                    { short: "No ice.", pronounce: "Nô ai-x", vi: "Không bỏ đá.", tip: "Nước ngọt ở Mỹ mặc định đá đầy ly. Muốn uống bình thường nhớ nói 'No ice'.", full: "I would prefer my drink without ice." },
                    { short: "To-go box, please.", pronounce: "Tu-gô bóc, p-li", vi: "Cho hộp mang về.", tip: "Ở Mỹ ăn không hết mang về là chuyện cực kỳ bình thường. Hãy xin 'To-go box'.", full: "Could I get a to-go box for the leftovers?" },
                    { short: "Check, please.", pronounce: "Chếch, p-li", vi: "Tính tiền nhé.", tip: "Có thể làm động tác ký tên lên không khí. Đừng quên để lại tiền Tip 18-20% nhé.", full: "Could we get the check, please?" }
                ]
            },
            'hoi_duong': {
                title: 'Hỏi Đường & Gọi Xe',
                items: [
                    { short: "Restroom where?", pronounce: "Rét-rum que?", vi: "Toilet ở đâu?", tip: "Ở Mỹ ít dùng từ Toilet. Hãy dùng 'Restroom' hoặc 'Bathroom'.", full: "Excuse me, where is the nearest restroom?" },
                    { short: "Help! I am lost.", pronounce: "Hép! Ai em lót.", vi: "Giúp với! Tôi bị lạc đường.", tip: "Nếu lạc, hãy vào một cửa hàng tạp hóa hoặc cây xăng và nói câu này.", full: "I need some help, I think I am lost." },
                    { short: "Call taxi for me?", pronounce: "Côn tắc-xi pho mi?", vi: "Gọi giúp tôi chiếc taxi được không?", tip: "Nếu điện thoại hết pin hoặc không biết xài Uber, hãy nhờ nhân viên quầy gọi giúp.", full: "Could you please call a taxi for me?" },
                    { short: "Stop here, please.", pronounce: "S-tóp hia, p-li", vi: "Dừng ở đây nhé.", tip: "Khi đi xe bus hoặc taxi/Uber sắp tới nhà.", full: "Please stop the car right here." }
                ]
            },

            // ======== NHÓM 2: CHUYÊN NGÀNH SINH TỒN ========
            'buu_dien': {
                title: 'Bưu Điện (USPS/UPS)',
                items: [
                    { short: "Send this to Vietnam.", pronounce: "Xen đít tu Việt Nam", vi: "Gửi cái này về Việt Nam.", tip: "Đưa thùng hàng ra và nói, họ sẽ tự cân và báo giá phí vận chuyển.", full: "I would like to ship this package to Vietnam." },
                    { short: "Cheapest way, please.", pronounce: "Chíp-bợt quay, p-li", vi: "Chọn cách rẻ nhất nhé.", tip: "Gửi bưu điện Mỹ có nhiều gói (chậm, nhanh, hỏa tốc). Cứ yêu cầu cách rẻ nhất.", full: "Please use the most affordable shipping method." },
                    { short: "Buy stamps, please.", pronounce: "Bai s-tem, p-li", vi: "Tôi muốn mua tem.", tip: "Tem ở Mỹ thường bán theo xấp (book of stamps) hoặc cuộn (roll).", full: "I need to purchase some postage stamps." },
                    { short: "Change address form.", pronounce: "Chen át-đ-rét phom", vi: "Cho xin đơn đổi địa chỉ nhà.", tip: "Khi chuyển nhà, phải ra USPS nộp đơn này để bưu điện chuyển thư từ nhà cũ sang nhà mới.", full: "I would like a change of address form." },
                    { short: "Pick up package. Here notice.", pronounce: "Pích úp pắc-kịch. Hia nô-tít", vi: "Đến nhận hàng. Đây là giấy báo.", tip: "Bưu tá giao hàng không gặp bạn, họ sẽ dán giấy báo (Notice) ngoài cửa. Cầm giấy đó ra bưu điện lấy đồ.", full: "I am here to pick up a package. Here is the delivery notice." }
                ]
            },
            'dien_nuoc': {
                title: 'Điện, Nước & Rác',
                items: [
                    { short: "Open power account.", pronounce: "Ô-pân pao-ờ a-cao", vi: "Tôi muốn mở tài khoản điện.", tip: "Khi thuê nhà mới, bạn phải tự gọi công ty điện (ví dụ: PG&E) để mở đường điện mang tên mình.", full: "I need to set up electricity service for my new address." },
                    { short: "Water leak. Please fix.", pronounce: "Oa-tờ lích. P-li phích", vi: "Bị xì nước rồi. Làm ơn sửa.", tip: "Tiền nước đột nhiên tăng vọt thì 99% là bể ống. Gọi công ty nước nói câu này để họ cử người xuống xem.", full: "My water bill is high, there might be a leak. Please fix it." },
                    { short: "Trash day when?", pronounce: "T-rát đê quen?", vi: "Ngày nào thì xe rác tới thu?", tip: "Ở Mỹ mỗi khu có ngày thu rác riêng. Phải kéo thùng rác ra đường đúng ngày, sai ngày có thể bị phạt.", full: "What day of the week is the trash collection?" },
                    { short: "Internet no work.", pronounce: "In-tơ-nét nô guốc", vi: "Mạng internet bị rớt/không xài được.", tip: "Gọi tổng đài Comcast/Xfinity, nói tài khoản, địa chỉ và dùng câu này.", full: "My internet service is currently down and not working." }
                ]
            },
            'kinh_doanh': {
                title: 'Ngân Hàng & Kinh Doanh',
                items: [
                    { short: "Deposit this check.", pronounce: "Đi-pô-dít đít chếch", vi: "Gửi tấm séc này vô tài khoản.", tip: "Người Mỹ trả lương hoặc trả tiền hay dùng Check (Séc giấy). Cầm ra bank, đưa thẻ ID và tờ séc cho họ.", full: "I would like to deposit this check into my account." },
                    { short: "I want cash it.", pronounce: "Ai goăn cát-x it", vi: "Tôi muốn rút tiền mặt từ tờ séc này.", tip: "Thay vì gửi vào tài khoản, bạn có thể rút thẳng thành tiền mặt (cash).", full: "I would like to cash this check, please." },
                    { short: "Open LLC how?", pronounce: "Ô-pân eo-eo-xi hao?", vi: "Mở công ty LLC như thế nào?", tip: "LLC (Limited Liability Company) là mô hình kinh doanh an toàn và phổ biến nhất cho dân định cư ở Mỹ muốn mở tiệm.", full: "How do I go about registering an LLC business?" },
                    { short: "Need business license.", pronounce: "Nít bít-x-nít lai-xần", vi: "Tôi cần xin giấy phép kinh doanh.", tip: "Đến City Hall (Tòa thị chính) của thành phố, xin form để mở tiệm nail, tiệm tóc, nhà hàng...", full: "I need to apply for a local business license." }
                ]
            },
            'y_te': {
                title: 'Y Tế & Mua Thuốc',
                items: [
                    { short: "Ambulance! Address is...", pronounce: "Am-biu-lân! Át-đ-rét is...", vi: "Xe cứu thương! Địa chỉ là...", tip: "Chỉ gọi khi MẤT MẠNG. Chi phí xe cứu thương ở Mỹ từ vài ngàn đến hàng chục ngàn đô.", full: "I need an ambulance immediately. The address is..." },
                    { short: "Toothache! Need dentist.", pronounce: "Tút-ây! Nít đen-tít", vi: "Nhức răng quá! Cần gặp nha sĩ.", tip: "Đau răng là nỗi ám ảnh ở Mỹ vì bảo hiểm y tế thường KHÔNG bao gồm răng (Dental). Phải mua riêng.", full: "I have a severe toothache and need to see a dentist." },
                    { short: "I need refill medicine.", pronounce: "Ai nít ri-phiu me-đi-xin", vi: "Cần mua thêm thuốc theo toa.", tip: "Ra Pharmacy (CVS/Walgreens) đưa lọ thuốc cũ ra và nói câu này. Không có toa không mua được thuốc bệnh.", full: "I need to refill my prescription at the pharmacy." },
                    { short: "No insurance. Need discount.", pronounce: "Nô in-su-rần. Nít đít-cao", vi: "Tôi không có bảo hiểm. Cho xin giảm giá.", tip: "Câu thần chú khi vào bệnh viện. Phòng thu ngân có chương trình giảm 50-100% cho người nghèo không bảo hiểm.", full: "I don't have health insurance. Do you offer financial assistance?" }
                ]
            },
            'giay_to': {
                title: 'Sở Khanh (DMV) & Giấy Tờ',
                items: [
                    { short: "I need ID and Drive test.", pronounce: "Ai nít Ai-đi en Đờ-rai tét", vi: "Tôi cần làm Thẻ ID và thi bằng lái xe.", tip: "Câu cửa miệng khi bước chân vào DMV. Chữ 'ID' là quan trọng nhất.", full: "I would like to apply for a Real ID and take the driving test." },
                    { short: "Renew Green Card.", pronounce: "Ri-niu g-rin cạc", vi: "Tôi muốn gia hạn thẻ xanh.", tip: "Form gia hạn thẻ xanh là I-90. Thẻ 2 năm hoặc thẻ 10 năm sắp hết hạn đều phải làm.", full: "I need to submit an application to renew my Green Card." },
                    { short: "License in box. Can I take it?", pronounce: "Lai-xần in bóc. Can ai tếch ít?", vi: "Bằng lái nằm trong hộc xe. Tôi lấy nhé?", tip: "SỐNG CÒN: Khi bị cảnh sát ngoắc lại, để 2 tay lên vô lăng. Tuyệt đối không với tay vào hộc xe mà chưa hỏi câu này.", full: "Officer, my license is in the glove compartment. May I reach for it?" },
                    { short: "I hit car. Need police report.", pronounce: "Ai hít ca. Nít pô-lít ri-pọt", vi: "Tôi bị đụng xe. Cần lập biên bản.", tip: "Tông xe ở Mỹ đừng cãi vã. Chụp hình hiện trường, gọi 911 xin biên bản của cảnh sát (Police Report) để đòi bảo hiểm.", full: "I was involved in a car accident and need to file a police report." }
                ]
            }
        };

        // --- CORE LOGIC NGHE & NÓI ---
        const app = {
            init: () => {
                if (!window.speechSynthesis) {
                    alert("Điện thoại của bạn không hỗ trợ chức năng đọc tiếng Anh.");
                }
            },

            showToast: (msg) => {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 3500);
            },

            openCategory: (catId) => {
                const data = DATABASE[catId];
                if (!data) return;

                document.getElementById('lessonTitle').textContent = data.title;
                
                const container = document.getElementById('flashcardsContainer');
                container.innerHTML = data.items.map((item) => {
                    const safeShortEn = item.short.replace(/'/g, "\\'");
                    
                    return `
                    <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-slate-300 mb-6">
                        <!-- PHẦN CHÍNH: HỌC TỪ KHÓA -->
                        <div class="bg-blue-50 p-5 md:p-6 border-b border-slate-200">
                            <span class="inline-block bg-emerald-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded mb-3 tracking-widest">⭐ Mẫu câu thực tế</span>
                            
                            <h3 class="text-2xl md:text-3xl font-black text-blue-900 leading-tight mb-1">"${item.short}"</h3>
                            <p class="text-[13px] font-bold text-emerald-700 mb-3 tracking-wide">🗣️ Đọc là: ${item.pronounce}</p>
                            <p class="text-sm md:text-base font-bold text-slate-700 mb-4">${item.vi}</p>
                            
                            <!-- KHU VỰC NGHE - NÓI -->
                            <div class="flex items-center gap-4 mt-2">
                                <!-- NÚT NGHE -->
                                <button onclick="app.speak('${safeShortEn}', this)" class="btn-press speaker-btn shrink-0 w-14 h-14 bg-blue-600 text-white rounded-full flex flex-col items-center justify-center shadow-md hover:bg-blue-700 transition-colors border-2 border-blue-200">
                                    <svg class="w-6 h-6 mb-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/><path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z"/></svg>
                                    <span class="text-[8px] font-black uppercase">Nghe</span>
                                </button>

                                <!-- NÚT LUYỆN NÓI -->
                                <button onclick="app.listen('${safeShortEn}', this)" class="btn-press shrink-0 w-14 h-14 bg-white text-emerald-600 rounded-full flex flex-col items-center justify-center shadow-md border-2 border-emerald-200 transition-colors">
                                    <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                                    <span class="text-[8px] font-black uppercase text-slate-600">Nói</span>
                                </button>
                                
                                <span class="text-[11px] text-slate-500 font-medium italic">👈 Bấm để kiểm tra phát âm!</span>
                            </div>
                        </div>

                        <!-- CÂU CHUẨN (THU NHỎ) -->
                        <div class="p-4 bg-slate-50 border-b border-slate-200">
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Mở rộng (Tham khảo câu đầy đủ):</p>
                            <p class="text-sm text-slate-500 italic">"${item.full}"</p>
                        </div>

                        <!-- VĂN HÓA MỸ -->
                        <div class="p-4 bg-white flex items-start gap-3">
                            <div class="text-xl">💡</div>
                            <p class="text-[13px] text-slate-700 leading-relaxed font-medium"><strong class="text-slate-900">Văn hóa Mỹ:</strong> ${item.tip}</p>
                        </div>
                    </div>`;
                }).join('');

                // Chuyển màn hình
                document.getElementById('homeScreen').classList.replace('block', 'hidden');
                document.getElementById('lessonScreen').classList.replace('hidden', 'flex');
                window.scrollTo(0, 0);
            },

            goHome: () => {
                document.getElementById('lessonScreen').classList.replace('flex', 'hidden');
                document.getElementById('homeScreen').classList.replace('hidden', 'block');
                window.speechSynthesis.cancel();
            },

            // Chức năng 1: Luyện Nghe (Web Speech API)
            speak: (text, btnElement) => {
                if (!window.speechSynthesis) return;

                window.speechSynthesis.cancel();
                document.querySelectorAll('.speaker-btn').forEach(btn => btn.classList.remove('speaking'));
                btnElement.classList.add('speaking');

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.8; // Đọc chậm cho U40 nghe rõ
                utterance.pitch = 1.0;

                utterance.onend = () => btnElement.classList.remove('speaking');
                utterance.onerror = () => btnElement.classList.remove('speaking');

                window.speechSynthesis.speak(utterance);
            },

            // Chức năng 2: Luyện Nói (Speech Recognition)
            listen: (targetText, btnElement) => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!SpeechRecognition) {
                    app.showToast("Trình duyệt không hỗ trợ thu âm (Nên dùng Google Chrome).");
                    return;
                }

                // Dừng âm thanh đang phát
                window.speechSynthesis.cancel();
                document.querySelectorAll('.speaker-btn').forEach(btn => btn.classList.remove('speaking'));

                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US'; // Bắt buộc nhận diện bằng tiếng Anh Mỹ
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                // Cập nhật UI nút
                const spanEl = btnElement.querySelector('span');
                const originalText = spanEl.textContent;
                btnElement.classList.add('listening');
                spanEl.textContent = 'Đang nghe';
                spanEl.classList.replace('text-slate-600', 'text-white');

                // Xử lý logic so sánh kết quả
                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript.toLowerCase();
                    // Loại bỏ các ký tự đặc biệt để so sánh chính xác hơn
                    const cleanTarget = targetText.toLowerCase().replace(/[^a-z0-9\s]/g, '');
                    const cleanResult = speechResult.replace(/[^a-z0-9\s]/g, '');

                    // Logic chấm điểm đơn giản: Nếu từ bạn nói có chứa hoặc gần giống từ đích
                    if (cleanResult.includes(cleanTarget) || cleanTarget.includes(cleanResult) || cleanResult.length > cleanTarget.length * 0.5) {
                        app.showToast("🎉 Giỏi quá! Bạn phát âm người Mỹ sẽ hiểu ngay!");
                    } else {
                        app.showToast(`Bạn vừa nói là: "${speechResult}". Gần đúng rồi, hãy nghe lại và thử lại nhé!`);
                    }
                };

                recognition.onerror = (event) => {
                    if(event.error === 'not-allowed') {
                        app.showToast("Vui lòng cấp quyền sử dụng Micro cho trình duyệt!");
                    } else {
                        app.showToast("Chưa nghe rõ, bạn hãy bấm Nói và thử lại nhé.");
                    }
                };

                recognition.onend = () => {
                    // Trả lại UI ban đầu
                    btnElement.classList.remove('listening');
                    spanEl.textContent = originalText;
                    spanEl.classList.replace('text-white', 'text-slate-600');
                };

                // Bắt đầu thu âm
                try {
                    recognition.start();
                } catch(e) {
                    app.showToast("Lỗi thu âm. Đang có ứng dụng khác dùng Micro.");
                }
            }
        };

        // Khởi động App
        app.init();

    </script>
</body>
</html>
