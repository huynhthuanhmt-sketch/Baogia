                            }
                            
                            for(let d=1; d<=31; d++) {
                                const dayRegex = new RegExp(`ng[aà]y\\s*0?${d}$`, 'i');
                                if (dayRegex.test(strRawLower) || ((strRawLower === `${d}` || strRawLower === `0${d}`) && idx > 10)) {
                                    dayIndices[d] = idx;
                                }
                            }
                        });
                        break;
                    }
                }

                if (headerIdx === -1 || nameIdx === -1) return { parsed, target, hasRestoredSales, fileYear, detectedFileMonth, detectedSalesperson };

                if (dailyStartIdx !== -1) {
                    for(let d=1; d<=31; d++) dayIndices[d] = dailyStartIdx + d - 1;
                }

                for (let i = 0; i < headerIdx; i++) {
                    const row = data[i]; if (!row) continue;
                    const rowStr = row.map(c => normalizeStr(c)).join(' ');
                    if (rowStr.includes('chi tieu')) {
                        const nums = row.map(c => extractNumber(c)).filter(n => n > 1000);
                        if (nums.length > 0) target = Math.max(...nums);
                    }
                }

                for (let i = headerIdx + 1; i < data.length; i++) {
                    const row = data[i]; if (!row || row.length === 0) continue;
                    
                    const rawName = row[nameIdx];
                    if (rawName === undefined || rawName === null || String(rawName).trim() === '') continue;
                    
                    const name = String(rawName).trim();
                    const invalidWords = ['tên khách hàng', 'doanh số', 'bảng theo dõi', 'nvkd', 'chỉ tiêu', 'tổng cộng', 'stt'];
                    if (invalidWords.some(w => normalizeStr(name) === normalizeStr(w) || normalizeStr(name).includes('bang theo doi'))) continue;
                    
                    let phone = phoneIdx !== -1 ? String(row[phoneIdx] || '').replace(/\.0$/, '').trim() : '';
                    if (phone === 'NaN' || phone === 'undefined' || phone === 'null') phone = '';
                    if (phone && phone !== '0') { if (phone.length >= 9 && !phone.startsWith('0')) phone = '0' + phone; } else phone = '';

                    let xa = xaIdx !== -1 ? String(row[xaIdx] || '').trim() : '';
                    if (xa === 'NaN' || xa === 'undefined' || xa === 'null') xa = '';
                    
                    let huyen = huyenIdx !== -1 ? String(row[huyenIdx] || '').trim() : '';
                    if (huyen === 'NaN' || huyen === 'undefined' || huyen === 'null') huyen = '';

                    if ((!xa || !huyen) && addressIdx !== -1) {
                        const addressParts = splitAddress(row[addressIdx]);
                        if (!xa) xa = addressParts.xa;
                        if (!huyen) huyen = addressParts.huyen;
                    }

                    let type = typeIdx !== -1 ? parseCustomerType(row[typeIdx]) : '';
                    let province = provinceIdx !== -1 ? String(row[provinceIdx] || '').trim() : '';
                    let distributor = distributorIdx !== -1 ? String(row[distributorIdx] || '').trim() : '';

                    let currentSales = emptyMonthlySales();
                    let currentDailySales = {};
                    let rowHasData = false;

                    for (let m = 1; m <= 12; m++) {
                        if (monthIndices[m] !== undefined) {
                            const val = extractNumber(row[monthIndices[m]]);
                            if (val > 0) {
                                currentSales[m] = val;
                                rowHasData = true;
                                if (importStats) importStats.monthlyCells++;
                            }
                        } else if (skippedFutureMonthIndices[m] !== undefined) {
                            const val = extractNumber(row[skippedFutureMonthIndices[m]]);
                            if (val > 0 && importStats) importStats.skippedFutureSales++;
                        }
                    }

                    const canImportDailySales = detectedFileMonth && !isFutureSalesPeriod(fileYear, detectedFileMonth);
                    for (let d = 1; d <= 31; d++) {
                        if (dayIndices[d] !== undefined) {
                            const val = extractNumber(row[dayIndices[d]]);
                            if (val > 0) {
                                if (canImportDailySales) {
                                    currentDailySales[d] = val;
                                    rowHasData = true;
                                    if (importStats) importStats.dailyCells++;
                                } else if (importStats) {
                                    importStats.skippedFutureSales++;
                                }
                            }
                        }
                    }

                    if (rowHasData && Object.keys(currentDailySales).length > 0) hasRestoredSales = true;
                    parsed.push({ name, phone, xa, huyen, type, province, distributor, monthlySales: currentSales, dailySales: currentDailySales });
                }

                return { parsed, target, hasRestoredSales, fileYear, detectedFileMonth, detectedSalesperson };
            };

            const mergeIntoState = (newParsedList, foundTarget, hasRestoredSales, importContext = {}) => {
                const customerMap = new Map(); let idCounter = 1;
                const oldCustomers = [...customers];
                const cleanName = (name) => normalizeStr(name).replace(/\s+/g, '');
                const cleanPhone = (phone) => String(phone || '').replace(/\D/g, '');
                const cleanAddress = (item) => normalizeStr([item.xa, item.huyen].filter(Boolean).join('|')).replace(/\s+/g, '');
                const identityKey = (item) => {
                    const phonePart = cleanPhone(item.phone);
                    return `${cleanName(item.name)}|${phonePart ? `p:${phonePart}` : `a:${cleanAddress(item)}`}`;
                };

                oldCustomers.forEach(c => customerMap.set(identityKey(c), c));

                newParsedList.forEach(item => {
                    const key = identityKey(item);
                    if (customerMap.has(key)) {
                        const existing = customerMap.get(key);
                        existing.monthlySales = existing.monthlySales || emptyMonthlySales();
                        existing.dailySales = existing.dailySales || {};
                        if (!existing.phone && item.phone) existing.phone = item.phone;
                        if (!existing.xa && item.xa) existing.xa = item.xa;
                        if (!existing.huyen && item.huyen) existing.huyen = item.huyen;
                        if (item.type) existing.type = item.type;
                        
                        for (let m = 1; m <= 12; m++) { if (item.monthlySales[m] > 0) existing.monthlySales[m] = item.monthlySales[m]; }
                        for (let d = 1; d <= 31; d++) { if (item.dailySales[d] > 0) existing.dailySales[d] = item.dailySales[d]; }
                    } else {
                        customerMap.set(key, {
                            id: `MT1_${Date.now()}_${idCounter++}`,
                            name: item.name, phone: item.phone, xa: item.xa, huyen: item.huyen,
                            type: item.type || 'DUY_TRI', subGroup: (idCounter % 4) + 1, location: null,
                            monthlySales: item.monthlySales || emptyMonthlySales(), dailySales: item.dailySales || {}
                        });
                    }
                });

                const finalParsed = Array.from(customerMap.values());
                const finalCustomerMap = new Map(finalParsed.map(c => [identityKey(c), c]));
                const finalCustomersByName = new Map();
                finalParsed.forEach(c => {
                    const nameKey = cleanName(c.name);
                    if (!finalCustomersByName.has(nameKey)) finalCustomersByName.set(nameKey, []);
                    finalCustomersByName.get(nameKey).push(c);
                });
                const findImportedCustomer = (item) => {
                    const exact = finalCustomerMap.get(identityKey(item));
                    if (exact) return exact;
                    const sameName = finalCustomersByName.get(cleanName(item.name)) || [];
                    return sameName.length === 1 ? sameName[0] : null;
                };
                const rawScheduleEntries = importContext.scheduleEntries || [];
                const scheduleEntries = rawScheduleEntries.filter(entry => {
                    const sameYear = !importContext.year || !entry.year || entry.year === importContext.year;
                    const sameMonth = !importContext.month || !entry.month || entry.month === importContext.month;
                    const future = isFutureSalesPeriod(entry.year || importContext.year, entry.month || importContext.month);
                    if ((!sameYear || !sameMonth || future) && importContext.stats) importContext.stats.skippedScheduleEntries++;
                    return sameYear && sameMonth && !future;
                });

                scheduleEntries.forEach(entry => {
                    const customer = findImportedCustomer(entry);
                    if (!customer) return;
                    if (entry.type) customer.type = entry.type;
                    customer.dailySales = customer.dailySales || {};
                    if (entry.date && entry.sales > 0) customer.dailySales[entry.date] = entry.sales;
                });

                const canActivateImportPeriod = importContext.month && importContext.year && !isFutureSalesPeriod(importContext.year, importContext.month);

                setCustomers(finalParsed);
                if (foundTarget > 0) setTargetQuarter(foundTarget);
                if (canActivateImportPeriod) {
                    setSelectedMonth(importContext.month);
                    setSelectedYear(importContext.year);
                } else if (importContext.year && !isFutureSalesPeriod(importContext.year, 1)) {
                    setSelectedYear(importContext.year);
                }

                const firstProvince = newParsedList.find(item => item.province)?.province || '';
                const firstDistributor = newParsedList.find(item => item.distributor)?.distributor || '';
                setSettings(prev => ({
                    ...prev,
                    salesperson: importContext.salesperson || prev.salesperson,
                    province: firstProvince || prev.province,
                    distributor: firstDistributor || prev.distributor
                }));

                let restoredSchedule = null;
                if (scheduleEntries.length > 0 && importContext.month && importContext.year) {
                    const cal = buildMonthCalendar(importContext.year, importContext.month);
                    restoredSchedule = {};
                    const dateLookup = new Map();
                    Object.keys(cal).forEach(week => {
                        restoredSchedule[week] = {};
                        Object.keys(cal[week]).forEach(dayKey => {
                            const date = cal[week][dayKey].date;
                            restoredSchedule[week][dayKey] = { day: `Thứ ${dayKey.replace('T', '')}`, desc: 'Triển khai tuyến', limit: maxDailyAgents, items: [], date };
                            dateLookup.set(date, { week, dayKey });
                        });
                    });

                    scheduleEntries.forEach(entry => {
                        const customer = findImportedCustomer(entry);
                        const targetDay = dateLookup.get(entry.date);
                        if (!customer || !targetDay) return;
                        const dayData = restoredSchedule[targetDay.week][targetDay.dayKey];
                        if (entry.desc) dayData.desc = entry.desc;
                        if (dayData.items.some(item => item.id === customer.id)) return;
                        dayData.items.push({
                            ...customer,
                            type: entry.type || customer.type,
                            sales: entry.sales > 0 ? entry.sales : (customer.dailySales?.[entry.date] || '')
                        });
                    });
                }

                let successMsg = `Nạp thành công ${finalParsed.length} KH từ file.`;
                if (canActivateImportPeriod) successMsg += importContext.lockedPeriod
                    ? ` Đã giữ kỳ đang mở Tháng ${importContext.month}/${importContext.year}.`
                    : ` Đã đồng bộ Tháng ${importContext.month}/${importContext.year}.`;
                else if (importContext.month && importContext.year) successMsg += ` Giữ kỳ hiện tại vì Tháng ${importContext.month}/${importContext.year} chưa tới.`;
                if (hasRestoredSales || scheduleEntries.some(entry => entry.sales > 0)) successMsg += " Đã phục hồi Doanh số Ngày.";
                if (restoredSchedule) successMsg += ` Đã khôi phục ${scheduleEntries.length} lượt trong lịch tuyến.`;
                if (importContext.stats) {
                    const skipped = importContext.stats.skippedFutureSales + importContext.stats.skippedMixedYearSales + importContext.stats.skippedMixedMonthDailySales + importContext.stats.skippedScheduleEntries;
                    if (skipped > 0) successMsg += ` Đã chặn ${skipped} ô/lượt doanh số sai kỳ hoặc chưa tới kỳ.`;
                }
                
                setFullMonthSchedule(restoredSchedule);
                setActiveWeekTab(1);
                setActiveTab(restoredSchedule ? 'schedule' : 'categorize');
                setStatus({ type: 'success', text: successMsg });
            };

            const handleFileUpload = async (event) => {
                const files = event.target.files; if (!files || files.length === 0) return;
                if (!librariesReady || !window.XLSX) return setStatus({ type: 'error', text: 'Thư viện chưa sẵn sàng.' });
                setStatus({ type: 'loading', text: 'Đang đọc và phân tích dữ liệu đa tầng...' });
                
                try {
                    let allParsedCustomers = [];
                    let hasRestoredAnySales = false;
                    let foundTarget = 0;
                    const hasActiveDataset = customers.length > 0;
                    let importYear = hasActiveDataset ? selectedYear : null;
                    let importMonth = hasActiveDataset ? selectedMonth : null;
                    let importedSalesperson = '';
                    let scheduleEntries = [];
                    const importStats = createImportStats();
                    const countDailySalesCells = (list) => (list || []).reduce((sum, item) => sum + Object.values(item.dailySales || {}).filter(v => Number(v) > 0).length, 0);
                    const hasDailySales = (list) => countDailySalesCells(list) > 0;

                    for (let i = 0; i < files.length; i++) {
                        const buffer = await files[i].arrayBuffer(); 
                        const workbook = window.XLSX.read(buffer, { type: 'array' });
                        
                        let fileMonth = detectMonthFromText(files[i].name);
                        let fileYear = detectYearFromText(files[i].name);
                        for (let sName of workbook.SheetNames) {
                            const match = String(sName).match(/L[IỊ]CH TUY[EẾ]N T(\d+)/i);
                            if (match && parseInt(match[1]) <= 12) { fileMonth = parseInt(match[1]); break; }
                            if (!fileMonth) fileMonth = detectMonthFromText(sName);
                            if (!fileYear) fileYear = detectYearFromText(sName);
                        }
                        
                        if (!fileMonth) {
                            const fNameLower = String(files[i].name).toLowerCase();
                            const fMatch = fNameLower.match(/th[aá]ng\s*0?(\d+)/i) || fNameLower.match(/_t(\d+)_/i);
                            if (fMatch && parseInt(fMatch[1]) <= 12) fileMonth = parseInt(fMatch[1]);
                        }

                        for (let sName of workbook.SheetNames) {
                            const worksheet = workbook.Sheets[sName]; 
                            const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                            const sheetMonth = detectMonthFromText(sName) || fileMonth || detectMonthFromRows(jsonData);
                            const sheetYear = detectYearFromText(sName) || fileYear || detectYearFromRows(jsonData, selectedYear);

                            const scheduleResult = parseScheduleSheetData(jsonData, files[i].name, sheetMonth, sheetYear);
                            let currentScheduleEntries = scheduleResult.entries;
                            const blockYear = scheduleResult.fileYear || sheetYear || selectedYear;
                            const blockMonth = scheduleResult.fileMonth || sheetMonth || fileMonth;
                            if (!importYear && currentScheduleEntries.length > 0 && blockYear) importYear = blockYear;
                            if (!importMonth && currentScheduleEntries.length > 0 && blockMonth) importMonth = blockMonth;
                            if (scheduleResult.entries.length > 0) {
                                if (importYear && blockYear && blockYear !== importYear) {
                                    importStats.skippedScheduleEntries += currentScheduleEntries.length;
                                    currentScheduleEntries = [];
                                }
                                if (importMonth && blockMonth && blockMonth !== importMonth) {
                                    importStats.skippedScheduleEntries += currentScheduleEntries.length;
                                    currentScheduleEntries = [];
                                }
                                scheduleEntries = scheduleEntries.concat(currentScheduleEntries);
                            }
                            
                            const result = processSingleSheetData(jsonData, files[i].name, sheetMonth, sheetYear, importStats);
                            let parsedBlock = result.parsed;
                            const parsedYear = result.fileYear || sheetYear || selectedYear;
                            const parsedMonth = result.detectedFileMonth || sheetMonth || fileMonth;
                            if (!importYear && parsedBlock.length > 0) importYear = parsedYear;
                            if (!importMonth && parsedBlock.length > 0 && parsedMonth) importMonth = parsedMonth;

                            if (importYear && parsedYear && parsedYear !== importYear) {
                                importStats.skippedMixedYearSales += countParsedSalesCells(parsedBlock);
                                parsedBlock = stripParsedSales(parsedBlock);
                            }
                            if (importMonth && parsedMonth && parsedMonth !== importMonth) {
                                importStats.skippedMixedMonthDailySales += countDailySalesCells(parsedBlock);
                                parsedBlock = stripParsedSales(parsedBlock, 'daily');
                            }

                            if (parsedBlock.length > 0) {
                                allParsedCustomers = allParsedCustomers.concat(parsedBlock);
                                if (result.target > foundTarget) foundTarget = result.target;
                                if (hasDailySales(parsedBlock)) hasRestoredAnySales = true;
                                if (!importedSalesperson && result.detectedSalesperson) importedSalesperson = result.detectedSalesperson;
                            }
                        }
                    }
                    
                    if (allParsedCustomers.length === 0) {
                        setStatus({ type: 'error', text: 'Không tìm thấy bảng "TÊN KHÁCH HÀNG" trong file.' });
                    } else {
                        mergeIntoState(allParsedCustomers, foundTarget, hasRestoredAnySales, {
                            month: importMonth || selectedMonth,
                            year: importYear || selectedYear,
                            salesperson: importedSalesperson,
                            scheduleEntries,
                            stats: importStats,
                            lockedPeriod: hasActiveDataset
                        });
                    }
                } catch (err) { setStatus({ type: 'error', text: 'Lỗi đọc file: ' + err.message }); }
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const handleAddCustomer = () => {
                if(!newCustomer.name) return setStatus({ type: 'error', text: 'Vui lòng nhập tên khách hàng.' });
                setCustomers(prev => [{ ...newCustomer, id: `MT1_MANUAL_${Date.now()}`, subGroup: (Date.now() % 4) + 1, location: null, monthlySales: emptyMonthlySales(), dailySales: {} }, ...prev]);
                setNewCustomer({ name: '', phone: '', xa: '', huyen: '', type: 'DUY_TRI' }); setShowAddForm(false); setFullMonthSchedule(null); setStatus({ type: 'success', text: 'Thêm khách hàng thành công.' });
            };

            const openEditForm = (c) => {
                setExpandedCustomer(c.id);
                setEditingData(JSON.parse(JSON.stringify(c))); 
            };

            const saveEditForm = () => {
                if (!editingData) return;
                setCustomers(prev => prev.map(c => c.id === editingData.id ? editingData : c));
                setExpandedCustomer(null);
                setFullMonthSchedule(null); 
                setStatus({ type: 'success', text: 'Đã cập nhật thông tin thành công!' });
            };

            const confirmDeleteCustomer = () => { 
                if(customerToDelete) {
                    setCustomers(prev => {
                        const nextCustomers = prev.filter(c => c.id !== customerToDelete.id);
                        if (nextCustomers.length === 0 && window.localforage) {
                            window.localforage.removeItem(STORAGE_KEY);
                            setHasSavedData(false);
                        }
                        return nextCustomers;
                    });
                    setFullMonthSchedule(null);
                    setCustomerToDelete(null);
                }
            };

            const toggleType = (id) => { 
                setCustomers(prev => prev.map(c => {
                    if (c.id === id) {
                        let nextType = 'DUY_TRI';
                        if (c.type === 'DUY_TRI') nextType = 'TUONG_TAC';
                        else if (c.type === 'TUONG_TAC') nextType = 'TRONG_DIEM';
                        return { ...c, type: nextType };
                    }
                    return c;
                })); 
                setFullMonthSchedule(null); 
            };
            
            const getBestGeoPosition = () => new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error('Trình duyệt không hỗ trợ định vị.'));
                let bestPosition = null;
                let lastError = null;
                let watchId = null;
                let finished = false;
                const finish = (position, error = null) => {
                    if (finished) return;
                    finished = true;
                    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                    clearTimeout(timerId);
                    if (position) resolve(position);
                    else reject(error || lastError || new Error('Không lấy được tọa độ.'));
                };
                const timerId = setTimeout(() => finish(bestPosition, lastError), GPS_MAX_WAIT_MS);
                try {
                    watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            const acc = Number(pos.coords.accuracy) || 99999;
                            const bestAcc = bestPosition ? (Number(bestPosition.coords.accuracy) || 99999) : 99999;
                            if (!bestPosition || acc < bestAcc) bestPosition = pos;
                            if (acc <= GPS_TARGET_ACCURACY_METERS) finish(pos);
                        },
                        (err) => {
                            lastError = err;
                            if (err && err.code === 1) finish(null, err);
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: GPS_MAX_WAIT_MS }
                    );
                } catch (error) {
                    finish(null, error);
                }
            });

            const buildLocationPayload = (pos) => ({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: Math.round(Number(pos.coords.accuracy) || 0),
                capturedAt: new Date().toISOString()
            });

            const gpsStatusText = (loc, label) => {
                const accuracyText = formatAccuracy(loc);
                const warning = hasWeakAccuracy(loc) ? ' GPS còn yếu, nên cập nhật lại khi đứng thoáng hơn.' : '';
                return `Đã lưu ${label}${accuracyText ? ` (${accuracyText})` : ''}.${warning}`;
            };

            const handleSetHomeLocation = async () => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy GPS chuẩn, giữ thiết bị ở nơi thoáng trong vài giây...' });
                try {
                    const pos = await getBestGeoPosition();
                    const loc = buildLocationPayload(pos);
                    setHomeLocation(loc);
                    setStatus({ type: hasWeakAccuracy(loc) ? 'error' : 'success', text: gpsStatusText(loc, 'điểm xuất phát') });
                } catch (error) {
                    setStatus({ type: 'error', text: 'Không lấy được GPS. Hãy cấp quyền vị trí và thử lại ở nơi thoáng.' });
                }
            };

            const handleSetCustomerLocation = async (id) => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy GPS chuẩn cho đại lý, giữ thiết bị ở nơi thoáng trong vài giây...' });
                try {
                    const pos = await getBestGeoPosition();
                    const loc = buildLocationPayload(pos);
                    setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: loc } : c));
                    setStatus({ type: hasWeakAccuracy(loc) ? 'error' : 'success', text: gpsStatusText(loc, 'tọa độ đại lý') });
                } catch (error) {
                    setStatus({ type: 'error', text: 'Không lấy được GPS. Hãy cấp quyền vị trí và thử lại ở nơi thoáng.' });
                }
            };

            const handleRemoveCustomerLocation = (id) => setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: null } : c));
            const getCustomerLocation = (id) => customers.find(c => c.id === id)?.location;

            const getQuoteBaseUrl = () => {
                let baseUrl = String(settings.quoteBaseUrl || '').trim();
                if (!baseUrl) baseUrl = new URL('baogia.html', window.location.href).href;
                if (!/^(https?:|file:)/i.test(baseUrl)) baseUrl = `https://${baseUrl}`;
                return baseUrl;
            };

            const openQuoteForCustomer = (customer = null) => {
                try {
                    const baseUrl = getQuoteBaseUrl();
                    if (!baseUrl) {
                        setStatus({ type: 'error', text: 'Chưa cấu hình link bảng báo giá. Hãy nhập link trong phần Thiết lập ứng dụng.' });
                        return;
                    }
                    const url = new URL(baseUrl);
                    if (customer) {
                        url.searchParams.set('kh', customer.name || '');
                        if (customer.phone) url.searchParams.set('sdt', customer.phone);
                        const address = [customer.xa, customer.huyen].filter(Boolean).join(', ');
                        if (address) url.searchParams.set('diachi', address);
                    }
                    url.searchParams.set('nguon', 'lichdituyen');
                    url.searchParams.set('lang', document.documentElement.lang === 'en' ? 'en' : 'vi');
                    window.open(url.toString(), '_blank', 'noopener,noreferrer');
                } catch (error) {
                    setStatus({ type: 'error', text: 'Đường dẫn tạo báo giá chưa hợp lệ.' });
                }
            };

            const handleSalesChange = useCallback((week, day, customerId, salesValue) => {
                setFullMonthSchedule(prev => {
                    const updatedWeekDayItems = prev[week][day].items.map(item => item.id === customerId ? { ...item, sales: salesValue } : item);
                    return { ...prev, [week]: { ...prev[week], [day]: { ...prev[week][day], items: updatedWeekDayItems } } };
                });
            }, []);

            // =========================================================================
            // CORE UPGRADE: THUẬT TOÁN ĐƯỜNG ĐI THỰC TẾ (OSRM API) KẾT HỢP FALLBACK
            // =========================================================================
            const handleOptimizeRoute = async (week, day) => {
                if (!homeLocation || !homeLocation.lat || !homeLocation.lng) {
                    return setStatus({ type: 'error', text: 'Vui lòng thiết lập Vị trí Nhà trước.' });
                }

                const dayItems = fullMonthSchedule[week][day].items;
                if (dayItems.length <= 1) return;

                setStatus({ type: 'loading', text: 'Đang kết nối vệ tinh tính toán lộ trình thực tế...' });

                const withLoc = [];
                const unlocated = [];
                dayItems.forEach(item => {
                    const loc = getCustomerLocation(item.id);
                    if (isUsableLocation(loc)) {
                        withLoc.push({ ...item, _loc: loc });
                    } else {
                        unlocated.push(item);
                    }
                });
                const weakAccuracyCount = withLoc.filter(item => hasWeakAccuracy(item._loc)).length;
                const accuracyNote = weakAccuracyCount > 0 ? ` Có ${weakAccuracyCount} điểm GPS còn yếu, nên cập nhật lại để tuyến chuẩn hơn.` : '';

                if (withLoc.length === 0) {
                    return setStatus({ type: 'error', text: 'Không có KH nào có tọa độ để tối ưu. Hãy bấm GPS cho KH.' });
                }

                try {
                    let coords = `${homeLocation.lng},${homeLocation.lat}`;
                    withLoc.forEach(item => {
                        coords += `;${item._loc.lng},${item._loc.lat}`;
                    });

                    const response = await fetch(`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&roundtrip=false`);
                    
                    if (!response.ok) throw new Error(`Network Error: ${response.status}`);
                    const data = await response.json();
                    if (data.code !== 'Ok') throw new Error(`API Error: ${data.code}`);

                    const sortedCustomers = data.waypoints
                        .map((waypoint, inputIndex) => ({
                            waypoint,
                            item: inputIndex === 0 ? null : withLoc[inputIndex - 1]
                        }))
                        .filter(entry => entry.item)
                        .sort((a, b) => a.waypoint.waypoint_index - b.waypoint.waypoint_index)
                        .map(entry => {
                            const cleanedItem = { ...entry.item };
                            delete cleanedItem._loc;
                            return cleanedItem;
                        });

                    setFullMonthSchedule(prev => {
                        const newSched = { ...prev };
                        newSched[week] = { ...newSched[week] };
                        newSched[week][day] = { 
                            ...newSched[week][day], 
                            items: [...sortedCustomers, ...unlocated] 
                        };
                        return newSched;
                    });

                    setStatus({ type: 'success', text: `Đã tự động tối ưu theo đường thực tế!${accuracyNote}` });

                } catch (error) {
                    console.warn("Lỗi kết nối OSRM, kích hoạt Fallback:", error);
                    
                    let currentLoc = homeLocation; 
                    const optimized = [...withLoc];
                    const finalOptimized = [];
                    
                    while (optimized.length > 0) {
                        optimized.sort((a, b) => getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, a._loc.lat, a._loc.lng) - getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, b._loc.lat, b._loc.lng));
                        const nearest = optimized.shift(); 
                        finalOptimized.push(nearest); 
                        currentLoc = nearest._loc; 
                    }
                    finalOptimized.forEach(item => delete item._loc);

                    setFullMonthSchedule(prev => {
                        const newSched = { ...prev };
                        newSched[week] = { ...newSched[week] };
                        newSched[week][day] = { 
                            ...newSched[week][day], 
                            items: [...finalOptimized, ...unlocated] 
                        };
                        return newSched;
                    });
                    
                    setStatus({ type: 'success', text: `Đã dùng thuật toán dự phòng do mạng yếu!${accuracyNote}` });
                }
            };

            const executeRoutingForMonth = () => {
                const routePeriod = getCurrentRoutePeriod();
                const periodChanged = selectedMonth !== routePeriod.month || selectedYear !== routePeriod.year;
                const routeCustomers = periodChanged
                    ? customers.map(c => ({
                        ...c,
                        dailySales: {},
                        monthlySales: selectedYear !== routePeriod.year ? emptyMonthlySales() : (c.monthlySales || emptyMonthlySales())
                    }))
                    : customers;
                const autoPeriodNote = periodChanged
                    ? ` Đã tự chuyển sang Tháng ${routePeriod.month}/${routePeriod.year} theo tháng hiện tại.`
                    : ` Tháng ${routePeriod.month}/${routePeriod.year}.`;

                if (periodChanged) {
                    setSelectedMonth(routePeriod.month);
                    setSelectedYear(routePeriod.year);
                    setCustomers(routeCustomers);
                    setFullMonthSchedule(null);
                }

                setStatus({ type: 'loading', text: `Đang tạo lịch Tháng ${routePeriod.month}/${routePeriod.year} theo tháng hiện tại...` });
                setTimeout(() => {
                    const cal = buildMonthCalendar(routePeriod.year, routePeriod.month);
                    const newSchedule = {};
                    let allAvailableDays = [];

                    const routeConfig = buildRouteConfig(routeCustomers);
                    const dayDescMap = routeConfig.descMap;
                    const dayDistrictMap = routeConfig.districtMap;

                    Object.keys(cal).forEach(wStr => {
                        const weekNum = parseInt(wStr);
                        newSchedule[weekNum] = {};
                        Object.keys(cal[wStr]).forEach(dayKey => {
                            newSchedule[weekNum][dayKey] = {
                                day: `Thứ ${dayKey.replace('T', '')}`,
                                desc: dayDescMap[dayKey] || 'Triển khai tuyến',
                                limit: maxDailyAgents,
                                items: [],
                                date: cal[wStr][dayKey].date
                            };
                            allAvailableDays.push({ week: weekNum, dayKey, date: cal[wStr][dayKey].date, items: [] });
                        });
                    });

                    let visitsToAssign = [];
                    routeCustomers.forEach(c => {
                        const visits = getDesiredVisits(c.type);
                        for (let i = 0; i < visits; i++) {
                            visitsToAssign.push({ ...c, sales: '', _visitIndex: i }); 
                        }
                    });

                    visitsToAssign.sort((a, b) => {
                        if (a._visitIndex !== b._visitIndex) return a._visitIndex - b._visitIndex;
                        const weight = { 'TRONG_DIEM': 3, 'DUY_TRI': 2, 'TUONG_TAC': 1 };
                        return weight[b.type] - weight[a.type];
                    });

                    const countInWeek = (dayList, weekNum, custId) => {
                        return dayList.filter(d => d.week === weekNum).flatMap(d => d.items).filter(i => i.id === custId).length;
                    };
                    const routeKmForItems = (items) => estimateRoundTripKm(homeLocation, items);
                    const dayGeoScore = (day, nextItem = null) => {
                        const items = nextItem ? [...day.items, nextItem] : day.items;
                        const km = routeKmForItems(items);
                        const overKm = km !== null && km > maxDailyKm;
                        const nextLoc = nextItem?.location;
                        const existingLocs = day.items.map(item => item.location).filter(isUsableLocation);
                        const clusterKm = isUsableLocation(nextLoc) && existingLocs.length > 0
                            ? Math.min(...existingLocs.map(loc => getDistanceFromLatLonInKm(nextLoc.lat, nextLoc.lng, loc.lat, loc.lng)))
                            : null;
                        return { km, overKm, clusterKm };
                    };
                    const sortDaysByGeoFit = (candidateDays, visit) => {
                        candidateDays.sort((a, b) => {
                            const aGeo = dayGeoScore(a, visit);
                            const bGeo = dayGeoScore(b, visit);
                            if (aGeo.overKm !== bGeo.overKm) return aGeo.overKm ? 1 : -1;
                            if (aGeo.clusterKm !== null || bGeo.clusterKm !== null) {
                                if (aGeo.clusterKm === null) return 1;
                                if (bGeo.clusterKm === null) return -1;
                                if (aGeo.clusterKm !== bGeo.clusterKm) return aGeo.clusterKm - bGeo.clusterKm;
                            }
                            if (aGeo.km !== null && bGeo.km !== null && aGeo.km !== bGeo.km) return aGeo.km - bGeo.km;
                            if (a.items.length !== b.items.length) return a.items.length - b.items.length;
                            return a.date - b.date;
                        });
                    };

                    let unassignedVisits = 0;
                    visitsToAssign.forEach(visit => {
                        const h = normalizeStr(visit.huyen) || 'khac';
                        
                        const geoMatchedDays = allAvailableDays.filter(d => {
                            const targetDistricts = dayDistrictMap[d.dayKey] || ['all'];
                            return targetDistricts.includes('all') || targetDistricts.some(dist => h.includes(dist));
                        });

                        let candidates = geoMatchedDays.filter(d => d.items.length < maxDailyAgents && countInWeek(allAvailableDays, d.week, visit.id) === 0);

                        if (candidates.length === 0) {
                            candidates = geoMatchedDays.filter(d => d.items.length < maxDailyAgents && !d.items.some(i => i.id === visit.id));
                        }

                        if (candidates.length === 0) {
                            candidates = allAvailableDays.filter(d => d.items.length < maxDailyAgents && countInWeek(allAvailableDays, d.week, visit.id) === 0);
                        }

                        if (candidates.length === 0) {
                            candidates = allAvailableDays.filter(d => d.items.length < maxDailyAgents && !d.items.some(i => i.id === visit.id));
                        }

                        sortDaysByGeoFit(candidates, visit);
                        
                        if(candidates.length > 0) {
                            const targetDay = candidates[0];
                            targetDay.items.push({
                                ...visit,
                                sales: visit.dailySales?.[targetDay.date] || ''
                            });
                        } else {
                            unassignedVisits++;
                        }
                    });

                    const countInMonth = (custId) => allAvailableDays.flatMap(d => d.items).filter(i => i.id === custId).length;
                    let rebalancedVisits = 0;
                    let addedMinimumVisits = 0;

                    allAvailableDays.forEach(targetDay => {
                        while (targetDay.items.length < minDailyAgents) {
                            const targetDistricts = dayDistrictMap[targetDay.dayKey] || ['all'];
                            const moveOptions = [];

                            allAvailableDays
                                .filter(donorDay => donorDay !== targetDay && donorDay.items.length > minDailyAgents)
                                .forEach(donorDay => {
                                    donorDay.items.forEach((item, itemIndex) => {
                                        if (targetDay.items.some(existing => existing.id === item.id)) return;
                                        const targetWeekCount = countInWeek(allAvailableDays, targetDay.week, item.id);
                                        const keepsWeeklySpacing = donorDay.week === targetDay.week ? targetWeekCount <= 1 : targetWeekCount === 0;
                                        const district = normalizeStr(item.huyen) || 'khac';
                                        const matchesDistrict = targetDistricts.includes('all') || targetDistricts.some(dist => district.includes(dist));
                                        const geoScore = dayGeoScore(targetDay, item);
                                        moveOptions.push({ donorDay, item, itemIndex, keepsWeeklySpacing, matchesDistrict, ...geoScore });
                                    });
                                });

                            if (moveOptions.length === 0) break;
                            moveOptions.sort((a, b) => {
                                if (a.overKm !== b.overKm) return a.overKm ? 1 : -1;
                                if (a.keepsWeeklySpacing !== b.keepsWeeklySpacing) return a.keepsWeeklySpacing ? -1 : 1;
                                if (a.matchesDistrict !== b.matchesDistrict) return a.matchesDistrict ? -1 : 1;
                                if (a.clusterKm !== null || b.clusterKm !== null) {
                                    if (a.clusterKm === null) return 1;
                                    if (b.clusterKm === null) return -1;
                                    if (a.clusterKm !== b.clusterKm) return a.clusterKm - b.clusterKm;
                                }
                                if (a.km !== null && b.km !== null && a.km !== b.km) return a.km - b.km;
                                return b.donorDay.items.length - a.donorDay.items.length;
                            });

                            const selectedMove = moveOptions[0];
                            selectedMove.donorDay.items.splice(selectedMove.itemIndex, 1);
                            targetDay.items.push({
                                ...selectedMove.item,
                                sales: selectedMove.item.dailySales?.[targetDay.date] || ''
                            });
                            rebalancedVisits++;
                        }
                    });

                    allAvailableDays.forEach(day => {
                        while (day.items.length < minDailyAgents) {
                            let padCandidates = routeCustomers.filter(c => 
                                !day.items.some(i => i.id === c.id)
                            );
                            if (padCandidates.length === 0) break;

                            const targetDistricts = dayDistrictMap[day.dayKey] || ['all'];
                            
                            let bestMatches = padCandidates.filter(c => {
                                const h = normalizeStr(c.huyen) || 'khac';
                                return targetDistricts.includes('all') || targetDistricts.some(dist => h.includes(dist));
                            });
                            
                            if (bestMatches.length === 0) bestMatches = padCandidates;

                            let notInWeekMatches = bestMatches.filter(c => countInWeek(allAvailableDays, day.week, c.id) === 0);
                            if (notInWeekMatches.length > 0) {
                                bestMatches = notInWeekMatches;
                            }

                            bestMatches.sort((a, b) => {
                                const aGeo = dayGeoScore(day, a);
                                const bGeo = dayGeoScore(day, b);
                                if (aGeo.overKm !== bGeo.overKm) return aGeo.overKm ? 1 : -1;
                                if (aGeo.clusterKm !== null || bGeo.clusterKm !== null) {
                                    if (aGeo.clusterKm === null) return 1;
                                    if (bGeo.clusterKm === null) return -1;
                                    if (aGeo.clusterKm !== bGeo.clusterKm) return aGeo.clusterKm - bGeo.clusterKm;
                                }
                                if (aGeo.km !== null && bGeo.km !== null && aGeo.km !== bGeo.km) return aGeo.km - bGeo.km;
                                const extraA = Math.max(0, countInMonth(a.id) - getDesiredVisits(a.type));
                                const extraB = Math.max(0, countInMonth(b.id) - getDesiredVisits(b.type));
                                if (extraA !== extraB) return extraA - extraB;
                                return countInMonth(a.id) - countInMonth(b.id);
                            });

                            const picked = bestMatches[0];
                            day.items.push({
                                ...picked,
                                sales: picked.dailySales?.[day.date] || '',
                                _visitIndex: 'kpi_minimum'
                            });
                            addedMinimumVisits++;
                        }
                    });

                    allAvailableDays.forEach(d => {
                        newSchedule[d.week][d.dayKey].items = d.items;
                    });

                    const underfilledDays = allAvailableDays.filter(d => d.items.length < minDailyAgents);
                    const missingMinimumVisits = underfilledDays.reduce((sum, d) => sum + (minDailyAgents - d.items.length), 0);
                    const dayKmStats = allAvailableDays
                        .map(d => ({ ...d, km: routeKmForItems(d.items) }))
                        .filter(d => d.km !== null);
                    const overKmDays = dayKmStats.filter(d => d.km > maxDailyKm);
                    const missingGpsCount = routeCustomers.filter(c => !isUsableLocation(c.location)).length;
                    const hasHomeGps = isUsableLocation(homeLocation);
                    let geoNote = '';
                    if (!hasHomeGps) {
                        geoNote = ' Chưa có GPS điểm xuất phát nên chưa kiểm soát được km/ngày.';
                    } else if (missingGpsCount > 0) {
                        geoNote = ` Cần bổ sung GPS cho ${missingGpsCount} đại lý để kiểm soát km chính xác.`;
                    } else if (overKmDays.length > 0) {
                        const maxKm = Math.max(...overKmDays.map(d => d.km));
                        geoNote = ` Cảnh báo: ${overKmDays.length} ngày vượt ${maxDailyKm} km/ngày, cao nhất khoảng ${maxKm} km.`;
                    } else {
                        geoNote = ` Quãng đường GPS nằm trong giới hạn ${maxDailyKm} km/ngày.`;
                    }
                    const hasRoutingError = unassignedVisits > 0 || underfilledDays.length > 0 || overKmDays.length > 0;

                    setFullMonthSchedule(newSchedule);
                    setActiveTab('schedule'); setActiveWeekTab(1); setSearchTerm('');
                    setStatus({
                        type: hasRoutingError ? 'error' : 'success',
                        text: unassignedVisits > 0
                            ? `Còn ${unassignedVisits} lượt chưa xếp vì các ngày đã đạt tối đa ${maxDailyAgents} đại lý.${autoPeriodNote}${geoNote}`
                            : underfilledDays.length > 0
                                ? `Chưa thể đạt tối thiểu ${minDailyAgents} đại lý ở ${underfilledDays.length} ngày, còn thiếu ${missingMinimumVisits} lượt. Cần ít nhất ${minDailyAgents} đại lý khác nhau.${autoPeriodNote}${geoNote}`
                                : overKmDays.length > 0
                                    ? `Đã tạo lịch nhưng còn ngày vượt giới hạn địa lý.${autoPeriodNote}${geoNote}`
                                    : `Chia lịch thành công: mỗi ngày từ ${minDailyAgents} đến ${maxDailyAgents} đại lý${rebalancedVisits > 0 ? `, đã cân lại ${rebalancedVisits} lượt` : ''}${addedMinimumVisits > 0 ? ` và bổ sung ${addedMinimumVisits} lượt để đủ KPI` : ''}.${autoPeriodNote}${geoNote}`
                    });
                }, 500);
            };

            const getSalesData = () => {
                let currentMonthSales = 0; let currentQuarterManualSales = 0; let yearManualSales = 0; 
                let trongDiemSales = 0, duyTriSales = 0, tuongTacSales = 0;
                const currentQuarter = Math.ceil(selectedMonth / 3);
                const qMonths = [(currentQuarter-1)*3 + 1, (currentQuarter-1)*3 + 2, (currentQuarter-1)*3 + 3];

                customers.forEach(c => {
                    const effectiveDailySales = {};
                    if (c.dailySales) {
                        for (let d = 1; d <= 31; d++) {
                            const importedValue = Number(c.dailySales[d]) || 0;
                            if (importedValue > 0) effectiveDailySales[d] = importedValue;
                        }
                    }

                    if (fullMonthSchedule) {
                        Object.keys(fullMonthSchedule).forEach(week => {
                            Object.values(fullMonthSchedule[week] || {}).forEach(day => {
                                const item = day.items.find(i => i.id === c.id);
                                if (item && day.date && item.sales !== '' && item.sales !== null && item.sales !== undefined) {
                                    effectiveDailySales[day.date] = Number(item.sales) || 0;
                                }
                            });
                        });
                    }

                    const dailySalesSum = Object.values(effectiveDailySales).reduce((sum, value) => sum + (Number(value) || 0), 0);
                    const mSales = dailySalesSum > 0 ? dailySalesSum : (Number(c.monthlySales?.[selectedMonth]) || 0);
                    currentMonthSales += mSales;
                    
                    if (c.type === 'TRONG_DIEM') trongDiemSales += mSales;
                    else if (c.type === 'DUY_TRI') duyTriSales += mSales;
                    else if (c.type === 'TUONG_TAC') tuongTacSales += mSales;

                    for(let m = 1; m <= 12; m++) {
                        if (m !== selectedMonth) { 
                            const val = Number(c.monthlySales?.[m]) || 0;
                            if (qMonths.includes(m)) currentQuarterManualSales += val; 
                            yearManualSales += val; 
                        }
                    }
                });

                const totalQuarter = currentQuarterManualSales + currentMonthSales;
                const totalYear = yearManualSales + currentMonthSales;
                return { currentMonthSales, totalQuarter, totalYear, trongDiemSales, duyTriSales, tuongTacSales };
            };
            const salesStats = getSalesData();

            const exportToExcelReal = async () => {
                if (!fullMonthSchedule || !window.ExcelJS) return setStatus({ type: 'error', text: 'Lỗi thư viện xuất Excel.' });
                setStatus({ type: 'loading', text: 'Đang xuất báo cáo (Sắp xong)...' });
                
                try {
                    const wb = new window.ExcelJS.Workbook();
                    wb.creator = settings.appTitle || DEFAULT_SETTINGS.appTitle;
                    const currentQuarterCol = Math.ceil(selectedMonth / 3);
                    
                    const wsForm = wb.addWorksheet('DOANH SỐ SALE OUT', { views: [{ state: 'frozen', ySplit: 8 }] });
                    const columns = [{ width: 5 }, { width: 30 }, { width: 12 }, { width: 15 }, { width: 15 }, { width: 12 }, { width: 15 }];
                    for(let i=1; i<=17; i++) columns.push({ width: 11 }); columns.push({ width: 13 }); 
                    for(let i=1; i<=31; i++) columns.push({ width: 8 });
                    wsForm.columns = columns;

                    wsForm.mergeCells('D2:K2'); wsForm.getCell('D2').value = `BẢNG THEO DÕI DOANH SỐ KHÁCH HÀNG NĂM ${selectedYear}`; wsForm.getCell('D2').font = { bold: true, size: 14 };
                    wsForm.mergeCells('D3:F3'); wsForm.getCell('D3').value = `NVKD : ${settings.salesperson || ''}`;
                    wsForm.mergeCells('D4:F4'); wsForm.getCell('D4').value = `CHỈ TIÊU QUÝ ${currentQuarterCol}`; wsForm.getCell('G4').value = Number(targetQuarter); wsForm.getCell('G4').numFmt = '#,##0';
                    wsForm.mergeCells('D5:F5'); wsForm.getCell('D5').value = 'THỰC HIỆN:'; wsForm.mergeCells('D6:F6'); wsForm.getCell('D6').value = 'TỈ LỆ % :'; 

                    const headerRow = wsForm.getRow(8);
                    const headerValues = ['STT', 'TÊN KHÁCH HÀNG', 'SĐT', 'XÃ', 'HUYỆN', 'TỈNH', 'TÊN NPP', 'Tháng 1', 'Tháng 2', 'Tháng 3', 'QUÝ 1', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'QUÝ 2', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'QUÝ 3', 'Tháng 10', 'Tháng 11', 'Tháng 12', 'QUÝ 4', 'TỔNG NĂM', `DS TỔNG THÁNG ${selectedMonth}`];
                    for(let i=1; i<=31; i++) headerValues.push(`Ngày ${i}`);
                    headerRow.values = headerValues;
                    headerRow.eachCell((cell) => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0047AB' } }; cell.font = { color: { argb: 'FFFFFFFF' }, bold: true }; cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; });

                    const monthColMap = { 1:8, 2:9, 3:10, 4:12, 5:13, 6:14, 7:16, 8:17, 9:18, 10:20, 11:21, 12:22 };
                    const salesMap = {}; customers.forEach(c => salesMap[c.id] = { c, days: Array(31).fill(0) });

                    Object.keys(fullMonthSchedule).forEach(week => { 
                        Object.keys(fullMonthSchedule[week] || {}).forEach(dayKey => { 
                            const dayData = fullMonthSchedule[week][dayKey];
                            const exactDate = dayData.date; 
                            if (exactDate) { 
                                dayData.items.forEach(item => { 
                                    if (salesMap[item.id] && item.sales && !isNaN(item.sales)) {
                                        salesMap[item.id].days[exactDate - 1] = Number(item.sales);
                                    }
                                }); 
                            } 
                        }); 
                    });

                    let rowIndex = 9;
                    let totalColSums = Array(60).fill(0); 

                    customers.forEach((c, idx) => {
                        const r = wsForm.getRow(rowIndex);
                        r.getCell(1).value = idx + 1; r.getCell(2).value = c.name; r.getCell(3).value = c.phone; r.getCell(4).value = c.xa; r.getCell(5).value = c.huyen; r.getCell(6).value = settings.province || ''; r.getCell(7).value = settings.distributor || '';
                        
                        let finalDailySales = Array.from({ length: 31 }, (_, dayIdx) => Number(c.dailySales?.[dayIdx + 1]) || 0);
                        for (let dayIdx = 0; dayIdx < 31; dayIdx++) {
                            if (salesMap[c.id].days[dayIdx] > 0) {
                                finalDailySales[dayIdx] = salesMap[c.id].days[dayIdx];
                            }
                        }
                        let daysSum = finalDailySales.reduce((a,b)=>a+b, 0);

                        let mSales = {};

                        for (let m = 1; m <= 12; m++) {
                            const targetCol = monthColMap[m];
                            let val = Number(c.monthlySales?.[m]) || 0;
                            let actualCellValue = val; 
                            
                            if (m === selectedMonth) { 
                                actualCellValue = daysSum > 0 ? daysSum : val;
                                r.getCell(targetCol).value = { 
                                    formula: `IF(SUM(Z${rowIndex}:BD${rowIndex})>0, SUM(Z${rowIndex}:BD${rowIndex}), ${val})`, 
                                    result: actualCellValue 
                                };
                                r.getCell(targetCol).font = { bold: true }; 
                            } else { 
                                if (val > 0) r.getCell(targetCol).value = val; 
                            }
                            r.getCell(targetCol).numFmt = '#,##0';
                            
                            mSales[m] = actualCellValue; 
                            totalColSums[targetCol] = (totalColSums[targetCol] || 0) + actualCellValue; 
                        }

                        let q1 = mSales[1]+mSales[2]+mSales[3]; let q2 = mSales[4]+mSales[5]+mSales[6]; let q3 = mSales[7]+mSales[8]+mSales[9]; let q4 = mSales[10]+mSales[11]+mSales[12];
                        let totalYear = q1+q2+q3+q4;

                        r.getCell(11).value = { formula: `SUM(H${rowIndex}:J${rowIndex})`, result: q1 }; r.getCell(11).font = { bold: true }; r.getCell(11).numFmt = '#,##0';

                .replace(/^Ngày (.+)$/, 'Date $1');

            const dynamicToVietnamese = value => value
                .replace(/^Sales summary - Month (\d+)$/, 'Tổng Hợp Doanh Số Tháng $1')
                .replace(/^WEEK (\d+)$/, 'TUẦN $1')
                .replace(/^Day (\d+)$/, 'Thứ $1')
                .replace(/^\(Date (\d+)\/(\d+)\)$/, '(Ngày $1/$2)')
                .replace(/^(\d+)\/(\d+) accounts$/, '$1/$2 Đại lý')
                .replace(/^M\.(\d+) \(Current\)$/, 'T.$1 (Nay)')
                .replace(/^M\.(\d+)$/, 'T.$1')
                .replace(/^Location saved\s*(.*)$/, 'Đã lưu định vị $1')
                .replace(/^Imported daily sales:\s*(.*)$/, 'Đã nạp DS Ngày: $1')
                .replace(/^Target:\s*(.*) visits \((.*) working days\)\.$/, 'Mục tiêu: $1 lượt ($2 ngày làm việc).')
                .replace(/^Date (.+)$/, 'Ngày $1');

            const translate = value => {
                if (!value || !value.trim()) return value;
                const leading = value.match(/^\s*/)?.[0] || '';
                const trailing = value.match(/\s*$/)?.[0] || '';
                const core = value.trim();
                const translated = language === 'en'
                    ? dynamicToEnglish(exact.get(core) || core)
                    : dynamicToVietnamese(reverse.get(core) || core);
                return `${leading}${translated}${trailing}`;
            };

            const applyLanguage = root => {
                if (!root || applying) return;
                applying = true;
                document.documentElement.lang = language;
                document.title = language === 'en' ? 'Route Planner - Thuan Store' : 'Lịch Đi Tuyến - Thuận Store';
                document.querySelector('meta[name="description"]')?.setAttribute('content', language === 'en'
                    ? 'Route planning and customer care for field sales teams - a Thuan Store tool.'
                    : 'Lịch đi tuyến và chăm sóc khách hàng dành cho nhân viên bán hàng thị trường - một công cụ của Thuận Store.');
                const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                    acceptNode(node) {
                        if (!node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
                        if (node.parentElement?.closest('script, style, noscript')) return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                });
                const nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(node => {
                    const next = translate(node.nodeValue);
                    if (next !== node.nodeValue) node.nodeValue = next;
                });
                root.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(element => {
                    ['placeholder', 'title', 'aria-label'].forEach(attribute => {
                        if (!element.hasAttribute(attribute)) return;
                        const value = element.getAttribute(attribute);
                        const next = translate(value);
                        if (next !== value) element.setAttribute(attribute, next);
                    });
                });
                document.querySelectorAll('[data-route-lang]').forEach(button => {
                    button.setAttribute('aria-pressed', String(button.dataset.routeLang === language));
                    const label = language === 'en' ? button.dataset.labelEn : button.dataset.labelVi;
                    if (label) {
                        button.setAttribute('aria-label', label);
                        button.setAttribute('title', label);
                    }
                });
                const home = document.getElementById('routeHomeLink');
                const close = document.getElementById('routeCloseLink');
                [home, close].forEach(link => {
                    if (!link) return;
                    const url = new URL('index.html', location.href);
                    url.searchParams.set('lang', language);
                    link.href = url.href;
                });
                applying = false;
            };

            const setLanguage = next => {
                language = next === 'en' ? 'en' : 'vi';
                try { localStorage.setItem(STORAGE_KEY, language); } catch (error) { /* Storage can be blocked for local files. */ }
                applyLanguage(document.body);
            };

            language = initialLanguage();
            document.querySelectorAll('[data-route-lang]').forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.routeLang)));
            const observer = new MutationObserver(records => {
                if (applying) return;
                const roots = new Set();
                records.forEach(record => {
                    if (record.type === 'characterData') roots.add(record.target.parentElement);
                    record.addedNodes.forEach(node => roots.add(node.nodeType === Node.TEXT_NODE ? node.parentElement : node));
                });
                roots.forEach(root => applyLanguage(root));
            });
            observer.observe(document.getElementById('root'), { childList: true, subtree: true, characterData: true });
            applyLanguage(document.body);

            window.setTimeout(() => {
                const root = document.getElementById('root');
                if (root?.childElementCount || (window.React && window.ReactDOM && window.Babel)) return;
                root.innerHTML = `<div class="route-dependency-error">${language === 'en' ? 'The Route Planner could not load its required libraries. Check the connection and reload this page.' : 'Công cụ Lịch đi tuyến chưa tải được thư viện cần thiết. Hãy kiểm tra kết nối và tải lại trang.'}</div>`;
            }, 8000);
            window.RouteLanguage = { get: () => language, set: setLanguage };
        })();
    </script>
</body>
</html>
