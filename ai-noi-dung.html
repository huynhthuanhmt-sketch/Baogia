<!DOCTYPE html>
<html lang="vi" data-lang="vi" data-title-vi="AI lập kế hoạch nội dung - Thuận Store" data-title-en="AI content planner - Thuan Store">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="AI chuyên gia lập trụ cột nội dung và lịch triển khai bốn tuần theo ngành, kênh và mục tiêu.">
    <title>AI lập kế hoạch nội dung - Thuận Store</title>
    <style data-thuanstore-inline="site.css">
:root {
    color-scheme: dark;
    --bg: #020617;
    --panel: #071426;
    --line: rgba(34, 211, 238, 0.16);
    --line-soft: rgba(148, 163, 184, 0.13);
    --text: #f8fafc;
    --muted: #a9b7ca;
    --quiet: #7f91aa;
    --cyan: #22d3ee;
    --blue: #60a5fa;
    --green: #34d399;
    --pink: #f472b6;
    --amber: #fbbf24;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", ui-sans-serif, sans-serif;
}

* {
    box-sizing: border-box;
    letter-spacing: 0;
}

html {
    background: var(--bg);
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    overflow-x: hidden;
    color: var(--text);
    background: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    border: 0;
}

html[data-lang="vi"] [data-lang="en"],
html[data-lang="en"] [data-lang="vi"] {
    display: none !important;
}

.sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
}

.site-shell {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    width: min(calc(100% - 2rem), 92rem);
    min-height: calc(100vh - 2rem);
    min-height: calc(100svh - 2rem);
    margin: 1rem auto;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 26px;
    background:
        radial-gradient(circle at 72% 40%, rgba(34, 211, 238, 0.12), transparent 31rem),
        linear-gradient(135deg, #020617, #041022 58%, #020817);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
}

.site-background {
    position: absolute;
    z-index: -1;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(to right, rgba(34, 211, 238, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.28), #000 46%, rgba(0, 0, 0, 0.72));
    mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.28), #000 46%, rgba(0, 0, 0, 0.72));
}

.site-header {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    min-height: 5.3rem;
    padding: 1rem 2.25rem 0.75rem;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 0.72rem;
    min-width: max-content;
}

.brand-mark {
    width: 1.78rem;
    height: 1.78rem;
    color: var(--cyan);
    filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.58));
}

.brand-copy {
    display: grid;
    gap: 0.2rem;
}

.brand-copy strong {
    font-size: 1.05rem;
    font-weight: 820;
    line-height: 1;
}

.brand-copy small {
    color: #86eaf7;
    font-size: 0.5rem;
    font-weight: 800;
    line-height: 1;
}

.desktop-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: clamp(1.5rem, 3.1vw, 2.65rem);
}

.desktop-nav a,
.desktop-nav button {
    padding: 0.4rem 0;
    color: #b8c4d5;
    background: transparent;
    font-size: 0.88rem;
    font-weight: 650;

}

.desktop-nav a:hover,
.desktop-nav button:hover,
.desktop-nav a:focus-visible,
.desktop-nav button:focus-visible {

}

.desktop-nav button.is-current {

}

.header-actions {

    align-items: center;
    justify-content: flex-end;

}

.language-switcher {

    border-radius: 999px;

}

.language-switcher button {
    width: 2rem;
    height: 2rem;

}

.language-switcher button.is-active {

}

.mobile-menu {

}

.mobile-menu summary {

    place-items: center;
    width: 2.55rem;
    height: 2.55rem;
    border: 1px solid rgba(148, 163, 184, 0.24);

    color: #dbe5f2;

}

.mobile-menu summary::-webkit-details-marker {

}

.mobile-menu summary svg {

}

.mobile-menu-panel {
    position: absolute;
    top: calc(100% + 0.55rem);

    display: grid;
    width: min(15rem, calc(100vw - 2rem));

.mobile-menu-panel a,
.mobile-menu-panel button {

.mobile-menu-panel button.is-current {

.landing-main {
    display: grid;
    grid-template-columns: minmax(0, 0.88fr) minmax(33rem, 1.12fr);
    align-items: center;
    flex: 1;
    min-height: 0;

}

.landing-copy {
    max-width: 40rem;
}

.eyebrow {
    display: inline-flex;
    align-items: center;

.landing-title {

}

.landing-title span,
.landing-title strong {
    display: block;
}

.landing-title strong {

}

.landing-description {
    max-width: 35rem;
    margin: 1.15rem 0 0;
    color: var(--muted);

}

.landing-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-top: 1.45rem;
}

.primary-action,
.secondary-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    min-height: 3.15rem;
    padding: 0.78rem 1rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 780;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}

.primary-action {

}

.secondary-action {
    border: 1px solid rgba(148, 163, 184, 0.24);
    color: #e2e8f0;

}

.primary-action:hover,
.secondary-action:hover,
.primary-action:focus-visible,
.secondary-action:focus-visible {

}

.landing-metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));

    margin-top: 1.25rem;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
}

.metric {
    min-width: 0;
    padding: 0.78rem 0.65rem;
    border-right: 1px solid var(--line-soft);
}

.metric:last-child {
    border-right: 0;
}

.metric strong,
.metric span {
    display: block;
}

.metric strong {
    color: #f8fafc;
    font-size: 0.83rem;
    font-weight: 820;
}

.metric span {
    margin-top: 0.18rem;
    color: var(--quiet);
    font-size: 0.64rem;
    font-weight: 620;
    line-height: 1.25;
}

.solution-finder {
    position: relative;
    z-index: 2;
    padding: clamp(2.75rem, 4vw, 3.75rem) 3.2rem clamp(3.5rem, 7vw, 6rem);
    background: linear-gradient(180deg, transparent, rgba(5, 18, 36, 0.58) 14%, rgba(5, 18, 36, 0.58) 86%, transparent);
}

.solution-inner {
    width: min(100%, 79rem);
    margin: 0 auto;
}

.solution-heading {
    display: grid;
    grid-template-columns: minmax(17rem, 0.78fr) minmax(0, 1.22fr);
    gap: clamp(2rem, 6vw, 6rem);
    align-items: end;
}

.solution-kicker {
    display: block;
    margin-bottom: 0.8rem;
    color: #67e8f9;
    font-size: 0.68rem;
    font-weight: 820;
}

.solution-title {
    max-width: 38rem;
    margin: 0;
    color: #f8fafc;
    font-size: clamp(2.1rem, 4vw, 3.8rem);
    font-weight: 840;
    line-height: 1.08;
}

.solution-heading > p {
    max-width: 42rem;
    margin: 0;
    color: #b7c5d8;
    font-size: clamp(1rem, 1.6vw, 1.16rem);
    font-weight: 520;
    line-height: 1.78;
}

.solution-tabs {
    display: flex;
    align-items: stretch;
    gap: clamp(1rem, 3vw, 2.4rem);
    margin-top: clamp(2.5rem, 5vw, 4rem);
    border-bottom: 1px solid var(--line-soft);
}

.solution-tabs button {
    position: relative;
    min-height: 3.2rem;
    padding: 0.65rem 0 0.8rem;
    color: #8fa0b7;
    background: transparent;
    font-size: 0.82rem;
    font-weight: 740;
    cursor: pointer;
}

.solution-tabs button::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 2px;
    background: transparent;
}

.solution-tabs button:hover,
.solution-tabs button:focus-visible,
.solution-tabs button[aria-selected="true"] {
    color: #f8fafc;
    outline: none;
}

.solution-tabs button[aria-selected="true"]::after {
    background: #22d3ee;
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.55);
}

.solution-panel {

}

.solution-panel[hidden] {

}

.solution-panel-intro {
    display: grid;
    grid-template-columns: 4.2rem minmax(0, 1fr);
    gap: 1.25rem;
    align-items: start;
}

.solution-panel-intro > span {

}

.solution-panel-intro h3 {
    max-width: 52rem;
    margin: 0.5rem 0 0;
    color: #f8fafc;
    font-size: clamp(1.55rem, 3vw, 2.6rem);
    font-weight: 820;
    line-height: 1.18;
}

.solution-panel-intro div > p:last-child {
    max-width: 56rem;
    margin: 0.9rem 0 0;
    color: #a9b7ca;
    font-size: 0.94rem;
    line-height: 1.72;
}

.solution-steps {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));

    border-top: 1px solid var(--line-soft);

}

.solution-step {
    min-width: 0;
    padding: 1.5rem clamp(1rem, 2.4vw, 2rem) 1.6rem;
    border-left: 1px solid var(--line-soft);
}

.solution-step:first-child {
    padding-left: 0;

}

.solution-step > span {
    display: block;
    color: #67e8f9;
    font-size: 0.64rem;
    font-weight: 820;
}

.solution-step h4 {
    margin: 0;
    margin-top: 0.75rem;
    color: #f8fafc;
    font-size: 1rem;
    font-weight: 790;
    line-height: 1.35;
}

.solution-step p {
    margin: 0.65rem 0 0;
    color: #a9b7ca;
    font-size: 0.8rem;
    line-height: 1.62;
}

.solution-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 0.85rem;
    margin-top: 0.9rem;
}

.solution-links a {
    color: #7dd3fc;
    font-size: 0.7rem;
    font-weight: 740;
    border-bottom: 1px solid rgba(125, 211, 252, 0.3);
}

.solution-links a:hover,
.solution-links a:focus-visible {
    color: #f8fafc;
    outline: none;
}

.solution-delivery {
    display: grid;
    grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.2fr) auto;
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items: center;
    margin-top: 2.4rem;
    padding-top: 1.5rem;
}

.solution-delivery h4 {
    margin: 0.45rem 0 0;
    color: #f8fafc;
    font-size: 1.05rem;
    font-weight: 790;
    line-height: 1.45;
}

.solution-delivery div > p:last-child {
    margin: 0.55rem 0 0;
    color: #8192aa;
    font-size: 0.72rem;
    line-height: 1.5;
}

.solution-delivery ul {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.65rem 1.2rem;
    margin: 0;
    padding: 0;
    list-style: none;
}

.solution-delivery li {
    position: relative;
    padding-left: 1rem;
    color: #a9b7ca;
    font-size: 0.72rem;
    line-height: 1.5;
}

.solution-delivery li::before {
    content: "";
    position: absolute;
    top: 0.48rem;
    left: 0;
    width: 0.34rem;
    height: 0.34rem;
    border-radius: 50%;
    background: #34d399;
}

.solution-delivery .primary-action {
    white-space: nowrap;
}

.available-tools {
    display: grid;
    grid-template-columns: minmax(15rem, 0.72fr) minmax(0, 1.28fr);
    gap: clamp(2rem, 6vw, 5rem);
    margin-top: clamp(4rem, 8vw, 6rem);
    padding-top: 1.5rem;
    border-top: 1px solid rgba(103, 232, 249, 0.24);
}

.available-tools h3 {
    margin: 0.5rem 0 0;
    color: #f8fafc;
    font-size: clamp(1.25rem, 2.3vw, 1.8rem);
    font-weight: 800;
}

.available-tools p:last-child {
    margin: 0.6rem 0 0;
    color: #8fa0b7;
    font-size: 0.76rem;
    line-height: 1.55;
}

.available-tool-links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.available-tool-links a {
    min-width: 0;
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--line-soft);
    border-left: 1px solid var(--line-soft);
}

.available-tool-links a:nth-child(odd) {
    padding-left: 0;
    border-left: 0;
}

.available-tool-links a:nth-child(-n + 2) {
    border-top: 0;
}

.available-tool-links strong,
.available-tool-links span {
    display: block;
}

.available-tool-links strong {
    color: #eaf2fb;
    font-size: 0.95rem;
    font-weight: 790;
}

.available-tool-links a > span {
    margin-top: 0.45rem;
    color: #8192aa;
    font-size: 0.82rem;
    line-height: 1.55;
}

.available-tool-links a:hover strong,
.available-tool-links a:focus-visible strong {
    color: #67e8f9;
}

.available-tool-links a:focus-visible {
    outline: none;
}

.orbit-visual {
    display: grid;
    place-items: center;
    min-height: clamp(34rem, 40vw, 36rem);
}

.mobile-intro {
    display: none;
}

.orbit {
    position: relative;
    width: min(36rem, 100%);
    height: 36rem;
    aspect-ratio: 1;
    isolation: isolate;
    --orbit-radius: 14.85rem;
}

.orbit::before {
    content: "";
    position: absolute;
    inset: 17%;
    border-radius: 50%;
    background: rgba(8, 47, 73, 0.2);
    filter: blur(18px);
}

.orbit-ring {
    display: none;
}

.orbit-ring::after {
    content: "";
    position: absolute;
    top: -0.18rem;
    left: 50%;
    width: 0.36rem;
    height: 0.36rem;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
}

.orbit-ring.outer { --inset: 7%; --alpha: 0.16; --speed: 38s; }
.orbit-ring.middle { --inset: 24%; --alpha: 0.2; --speed: 29s; animation-direction: reverse; }
.orbit-ring.inner { --inset: 38%; --alpha: 0.24; --speed: 22s; }

.orbit-center {
    position: absolute;
    z-index: 8;
    inset: 37.5%;
    display: grid;
    place-items: center;
    padding: 0;
    color: #67e8f9;
    background: transparent;
    cursor: pointer;
}

.orbit-center:focus-visible {
    outline: none;
}

.orbit-center:focus-visible .reactor {
    box-shadow: 0 0 0 2px rgba(103, 232, 249, 0.45), 0 0 38px rgba(34, 211, 238, 0.3), inset 0 0 20px rgba(34, 211, 238, 0.16);
}

.reactor {
    position: relative;
    display: grid;
    place-items: center;
    width: 5.6rem;
    height: 5.6rem;
    border: 1px solid rgba(34, 211, 238, 0.42);
    border-radius: 50%;
    background: rgba(8, 47, 73, 0.58);
    box-shadow: 0 0 32px rgba(34, 211, 238, 0.2), inset 0 0 20px rgba(34, 211, 238, 0.15);
    animation: reactor-pulse 3.2s ease-in-out infinite;
}

.reactor::before,
.reactor::after {
    content: "";
    position: absolute;
    border-radius: 50%;
}

.reactor::before {
    inset: 0.56rem;
    border: 1px dashed rgba(103, 232, 249, 0.55);
    animation: spin 7s linear infinite;
}

.reactor::after {
    width: 2.2rem;
    height: 2.2rem;
    border: 1px solid rgba(103, 232, 249, 0.72);
    background: rgba(34, 211, 238, 0.18);
    box-shadow: 0 0 24px rgba(34, 211, 238, 0.48);
}

.center-label {
    position: absolute;
    top: calc(50% + 3.4rem);
    left: 50%;
    min-width: 7.6rem;
    transform: translateX(-50%);
    color: #67e8f9;
    font-size: 0.65rem;
    font-weight: 820;
    line-height: 1.15;
    text-align: center;
}

.center-tools {
    display: none;
}

.orbit.is-tools .center-services {
    display: none;
}

.orbit.is-tools .center-tools {
    display: inline;
}

.orbit-item {
    position: absolute;
    z-index: 9;
    top: 50%;
    left: 50%;
    display: grid;
    width: 7rem;
    transform: translate(-50%, -50%) rotate(var(--orbit-angle)) translateY(calc(0px - var(--orbit-radius))) rotate(calc(0deg - var(--orbit-angle)));
    transform-origin: center;
    animation: orbit-item-spin 42s linear infinite;
    will-change: transform;
}

.orbit-item[style*="--i:0"] { --orbit-angle: 0deg; }
.orbit-item[style*="--i:1"] { --orbit-angle: 45deg; }
.orbit-item[style*="--i:2"] { --orbit-angle: 90deg; }
.orbit-item[style*="--i:3"] { --orbit-angle: 135deg; }
.orbit-item[style*="--i:4"] { --orbit-angle: 180deg; }
.orbit-item[style*="--i:5"] { --orbit-angle: 225deg; }
.orbit-item[style*="--i:6"] { --orbit-angle: 270deg; }
.orbit-item[style*="--i:7"] { --orbit-angle: 315deg; }

.orbit:hover .orbit-item {
    animation-play-state: paused;
}

.orbit-state {
    grid-area: 1 / 1;
    display: grid;
    justify-items: center;
    gap: 0.48rem;
    min-width: 0;
    color: var(--accent, var(--cyan));
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition:
        opacity 360ms ease,
        transform 440ms cubic-bezier(0.22, 1, 0.36, 1),
        filter 360ms ease,
        visibility 0s linear;
    transition-delay: calc(var(--i, 0) * 34ms);
}

.orbit.is-services .tool-state,
.orbit.is-tools .service-state {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    filter: blur(5px);
    transform: scale(0.68);
    transition-delay: 0s;
}

.node-icon {
    display: grid;
    place-items: center;
    width: 4.25rem;
    height: 4.25rem;
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-color: color-mix(in srgb, currentColor 38%, transparent);
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(8, 47, 73, 0.82), rgba(2, 6, 23, 0.88));
    box-shadow: 0 13px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(34, 211, 238, 0.18);
    box-shadow: 0 13px 30px rgba(0, 0, 0, 0.3), 0 0 20px color-mix(in srgb, currentColor 20%, transparent);
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}

.orbit-state:hover .node-icon,
.orbit-state:focus-visible .node-icon {
    border-color: rgba(103, 232, 249, 0.72);
    border-color: color-mix(in srgb, currentColor 70%, transparent);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32), 0 0 28px rgba(34, 211, 238, 0.28);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32), 0 0 28px color-mix(in srgb, currentColor 34%, transparent);
    transform: translateY(-2px) scale(1.06);
}

.orbit-state:focus-visible {
    outline: none;
}

.node-icon svg {
    width: 2rem;
    height: 2rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.node-label {
    width: 100%;
    color: #e7eef8;
    font-size: 0.78rem;
    font-weight: 680;
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
}

.node-status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.15rem;
    padding: 0.16rem 0.36rem;
    border: 1px solid color-mix(in srgb, currentColor 45%, transparent);
    border-radius: 999px;
    color: currentColor;
    background: rgba(2, 6, 23, 0.82);
    font-size: 0.5rem;
    font-weight: 760;
    line-height: 1;
    white-space: nowrap;
}

.node-status.is-live {
    color: #6ee7b7;
}

.node-status.is-utility {
    color: #5eead4;
}

.node-status.is-beta {
    color: #fde68a;
}

.site-footer {
    position: relative;
    z-index: 10;
    padding: 1rem 3.2rem calc(0.72rem + env(safe-area-inset-bottom));
    border-top: 0;
    background: transparent;
    font-family: var(--font);
}

.footer-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.9rem clamp(1.4rem, 3vw, 2.8rem);
    width: min(100%, 79rem);
    margin: 0 auto;
}

.footer-nav {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.15rem;
}

.footer-action {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 2.2rem;
    gap: 0.38rem;
    padding: 0.3rem 0.52rem;
    border-bottom: 1px solid transparent;
    color: #c8d4e4;
    background: transparent;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    transition: color 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.footer-action-icon,
.footer-contact-icon {
    display: grid;
    place-items: center;
    color: var(--footer-accent, #67e8f9);
    transition: color 180ms ease, transform 180ms ease;
}

.footer-action-icon {
    width: 1rem;
    height: 1rem;
    flex: 0 0 1rem;
}

.footer-action-icon svg,
.footer-contact-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
}

.footer-action-label {
    max-width: 100%;
    color: inherit;
    font-size: 0.71rem;
    font-weight: 700;
    line-height: 1.2;
}

.footer-action:hover,
.footer-action:focus-visible {
    color: #f8fafc;
    border-bottom-color: var(--footer-accent, #67e8f9);
    outline: none;
    transform: translateY(-1px);
}

.footer-action:hover .footer-action-icon,
.footer-action:focus-visible .footer-action-icon {
    color: var(--footer-accent, #67e8f9);
    transform: translateY(-1px);
}

.footer-contact {
    min-width: 0;
    text-align: right;
}

.footer-contact-kicker {
    display: block;
    margin-bottom: 0.42rem;
    color: #8fa0b7;
    font-size: 0.66rem;
    font-weight: 700;
    line-height: 1.2;
}

.footer-contact-link {
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.4rem;
    max-width: 100%;
    overflow-wrap: anywhere;
    color: #e2e8f0;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.3;
    transition: color 180ms ease, transform 180ms ease;
}

.footer-contact-note {
    display: block;
    max-width: 24rem;
    margin: 0 0 0.5rem auto;
    color: #7f91aa;
    font-size: 0.64rem;
    line-height: 1.45;
}

.footer-contact-icon {
    width: 1rem;
    height: 1rem;
    flex: 0 0 1rem;
    --footer-accent: #34d399;
}

.footer-contact-link:hover,
.footer-contact-link:focus-visible {
    color: #ecfeff;
    outline: none;
    transform: translateY(-1px);
}

.footer-contact-link:hover .footer-contact-icon,
.footer-contact-link:focus-visible .footer-contact-icon {
    color: #6ee7b7;
    transform: translateY(-1px);
}

.footer-bottom {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 1rem;
    width: min(100%, 79rem);
    margin: 0.48rem auto 0;
    padding-top: 0.28rem;
    border-top: 0;
    color: #8192aa;
    font-size: 0.66rem;
    font-weight: 600;
    line-height: 1.35;
}

.footer-bottom a:hover {
    color: #dffaff;
}

/* Shared service and information pages */
.subpage-shell {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    width: min(calc(100% - 2rem), 76rem);
    min-height: calc(100vh - 2rem);
    min-height: calc(100svh - 2rem);
    margin: 1rem auto;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(145deg, #020617, #061426);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
}

.subpage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 5rem;
    padding: 0.9rem 1.5rem;
    border-bottom: 1px solid var(--line-soft);
}

.subpage-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
}

.icon-link {
    display: grid;
    place-items: center;
    width: 2.55rem;
    height: 2.55rem;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-radius: 8px;
    color: #dbe5f2;
    background: rgba(15, 23, 42, 0.64);
}

.icon-link svg {
    width: 1.2rem;
    height: 1.2rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.service-main {
    flex: 1;
    width: min(100%, 68rem);
    margin: 0 auto;
    padding: clamp(2rem, 5vw, 4.5rem) clamp(1rem, 4vw, 3rem) 2rem;
}

.service-heading {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 1.2rem;
}

.service-heading-icon {
    display: grid;
    place-items: center;
    width: 4.8rem;
    height: 4.8rem;
    border: 1px solid rgba(34, 211, 238, 0.42);
    border-color: color-mix(in srgb, var(--service-color, var(--cyan)) 42%, transparent);
    border-radius: 50%;
    color: var(--service-color, var(--cyan));
    background: rgba(8, 47, 73, 0.45);
    box-shadow: 0 0 28px rgba(34, 211, 238, 0.18);
    box-shadow: 0 0 28px color-mix(in srgb, var(--service-color, var(--cyan)) 20%, transparent);
}

.service-heading-icon svg {
    width: 2.25rem;
    height: 2.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.service-kicker {
    margin: 0 0 0.45rem;
    color: #79e8f6;
    font-size: 0.68rem;
    font-weight: 820;
}

.service-title {
    margin: 0;
    color: #f8fafc;
    font-size: clamp(2.1rem, 5vw, 4.2rem);
    font-weight: 850;
    line-height: 1.04;
}

.service-summary {
    max-width: 50rem;
    margin: 1.6rem 0 0;
    color: #b5c2d3;
    font-size: clamp(1rem, 2vw, 1.18rem);
    font-weight: 540;
    line-height: 1.7;
}

.service-content {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(15rem, 0.85fr);
    gap: 2.2rem;
    margin-top: clamp(2rem, 5vw, 3.5rem);
    padding-top: 2rem;
    border-top: 1px solid var(--line-soft);
}

.section-label {
    margin: 0;
    color: #7f91aa;
    font-size: 0.66rem;
    font-weight: 820;
}

.service-list {
    display: grid;
    gap: 0;
    margin: 0.8rem 0 0;
    padding: 0;
    list-style: none;
}

.service-list li {
    position: relative;
    padding: 0.9rem 0 0.9rem 1.45rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    color: #d6e0ed;
    font-size: 0.92rem;
    font-weight: 580;
    line-height: 1.5;
}

.service-list li::before {
    content: "";
    position: absolute;
    top: 1.25rem;
    left: 0;
    width: 0.48rem;
    height: 0.48rem;
    border: 2px solid var(--service-color, var(--green));
    border-radius: 50%;
}

.service-result {
    align-self: start;
    padding: 1.1rem 0;
    border-top: 2px solid var(--service-color, var(--green));
    border-bottom: 1px solid var(--line-soft);
}

.service-result strong {
    display: block;
    color: var(--service-color, var(--green));
    font-size: 0.7rem;
    font-weight: 820;
}

.service-result p {
    margin: 0.55rem 0 0;
    color: #e2e8f0;
    font-size: 1rem;
    font-weight: 680;
    line-height: 1.55;
}

.service-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 2.2rem;
}

.info-content {
    display: grid;
    gap: 1.4rem;
    margin-top: 2rem;
}

.info-section {
    padding-top: 1.1rem;
    border-top: 1px solid var(--line-soft);
}

.info-section h2 {
    margin: 0;
    color: #f8fafc;
    font-size: 1rem;
    font-weight: 800;
}

.info-section p,
.info-section li {
    color: #b5c2d3;
    font-size: 0.9rem;
    line-height: 1.65;
}

.service-extra {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(15rem, 0.65fr);
    gap: clamp(2rem, 5vw, 4rem);
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line-soft);
}

.service-example-list {
    display: grid;
    gap: 0;
    margin: 0.75rem 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--line-soft);
}

.service-example-list li {
    position: relative;
    padding: 0.85rem 0 0.85rem 1.25rem;
    border-bottom: 1px solid var(--line-soft);
    color: #a9b7ca;
    font-size: 0.78rem;
    line-height: 1.55;
}

.service-example-list li::before {
    content: "";
    position: absolute;
    top: 1.2rem;
    left: 0;
    width: 0.42rem;
    height: 0.42rem;
    border-radius: 50%;
    background: var(--service-color, var(--green));
}

.service-text-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.45rem;
    color: var(--service-color, var(--green));
    font-size: 0.76rem;
    font-weight: 760;
    text-decoration: none;
    border-bottom: 1px solid transparent;
}

.service-text-link:hover,
.service-text-link:focus-visible {
    border-bottom-color: currentColor;
}

.service-principle {
    align-self: start;
    padding: 1rem 0 1rem 1.2rem;
    border-left: 2px solid var(--service-color, var(--green));
}

.service-principle strong {
    color: var(--service-color, var(--green));
    font-size: 0.62rem;
    font-weight: 820;
}

.service-principle p {
    margin: 0.55rem 0 0;
    color: #d4deea;
    font-size: 0.8rem;
    font-weight: 620;
    line-height: 1.6;
}

.info-section ol,
.info-section ul {
    margin: 0.7rem 0 0;
    padding-left: 1.2rem;
}

.subpage-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 1.5rem calc(0.9rem + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line-soft);
    color: #71839c;
    font-size: 0.66rem;
}

.contact-layout {
    display: grid;
    grid-template-columns: minmax(0, 0.84fr) minmax(25rem, 1.16fr);
    gap: clamp(2rem, 5vw, 5rem);
    margin-top: 2.6rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line-soft);
}

.contact-scope-list {
    display: grid;
    margin: 0.75rem 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--line-soft);
}

.contact-scope-list li {
    position: relative;
    display: grid;
    gap: 0.32rem;
    padding: 1rem 0 1rem 1.35rem;
    border-bottom: 1px solid var(--line-soft);
}

.contact-scope-list li::before {
    content: "";
    position: absolute;
    top: 1.35rem;
    left: 0;
    width: 0.45rem;
    height: 0.45rem;
    border: 2px solid var(--green);
    border-radius: 50%;
}

.contact-scope-list strong {
    color: #f8fafc;
    font-size: 0.86rem;
}

.contact-scope-list li > span {
    color: #93a4ba;
    font-size: 0.76rem;
    line-height: 1.55;
}

.contact-process {
    margin-top: 1.8rem;
}

.contact-process ol {
    display: grid;
    gap: 0.85rem;
    margin: 0.85rem 0 0;
    padding: 0;
    list-style: none;
}

.contact-process li {
    display: grid;
    grid-template-columns: 1.85rem minmax(0, 1fr);
    align-items: start;
    gap: 0.7rem;
}

.contact-process li > span {
    display: grid;
    place-items: center;
    width: 1.85rem;
    height: 1.85rem;
    border: 1px solid rgba(52, 211, 153, 0.4);
    border-radius: 50%;
    color: #6ee7b7;
    font-size: 0.68rem;
    font-weight: 820;
}

.contact-process p {
    display: grid;
    gap: 0.2rem;
    margin: 0;
}

.contact-process strong {
    color: #e8eef7;
    font-size: 0.78rem;
}

.contact-process small {
    color: #8192a9;
    font-size: 0.7rem;
    line-height: 1.45;
}

.contact-form {
    align-self: start;
    padding: clamp(1.15rem, 3vw, 1.75rem);
    border: 1px solid rgba(52, 211, 153, 0.24);
    border-radius: 8px;
    background: rgba(7, 20, 38, 0.82);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.18);
}

.contact-form-heading h2 {
    margin: 0.38rem 0 0;
    color: #f8fafc;
    font-size: clamp(1.35rem, 2.5vw, 1.8rem);
    line-height: 1.2;
}

.contact-form-heading > p:last-child {
    margin: 0.55rem 0 0;
    color: #8fa0b6;
    font-size: 0.76rem;
    line-height: 1.5;
}

.contact-choice-group {
    margin: 1.2rem 0 0;
    padding: 0;
    border: 0;
}

.contact-choice-group legend,
.contact-field > span {
    color: #c8d3e2;
    font-size: 0.68rem;
    font-weight: 760;
}

.contact-choice-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem;
    margin-top: 0.55rem;
}

.contact-choice-grid label {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    min-height: 2.65rem;
    padding: 0.55rem 0.7rem;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 6px;
    color: #d7e0ec;
    background: rgba(15, 23, 42, 0.46);
    font-size: 0.7rem;
    font-weight: 660;
    cursor: pointer;
}

.contact-choice-grid label.is-selected,
.contact-choice-grid label:focus-within {
    border-color: rgba(52, 211, 153, 0.58);
    background: rgba(6, 78, 59, 0.26);
}

.contact-choice-grid input {
    margin: 0;
    accent-color: #34d399;
}

.contact-field-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.7rem;
    margin-top: 1rem;
}

.contact-field {
    display: grid;
    gap: 0.42rem;
    margin-top: 0.8rem;
}

.contact-field-grid .contact-field {
    margin-top: 0;
}

.contact-field input,
.contact-field textarea {
    width: 100%;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 6px;
    outline: none;
    color: #f8fafc;
    background: rgba(2, 6, 23, 0.62);
    font: inherit;
    font-size: 0.78rem;
}

.contact-field input {
    min-height: 2.8rem;
    padding: 0 0.78rem;
}

.contact-field textarea {
    min-height: 7.2rem;
    padding: 0.72rem 0.78rem;
    line-height: 1.5;
    resize: vertical;
}

.contact-field input:focus,
.contact-field textarea:focus {
    border-color: rgba(52, 211, 153, 0.62);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
}

.contact-submit {
    width: 100%;
    min-height: 3rem;
    margin-top: 1rem;
    border-radius: 7px;
    color: #02120d;
    background: #6ee7b7;
    font-size: 0.78rem;
    font-weight: 820;
    cursor: pointer;
}

.contact-submit:disabled {
    cursor: wait;
    opacity: 0.65;
}

.contact-form-status {
    min-height: 1.1rem;
    margin: 0.7rem 0 0;
    color: #9fb0c4;
    font-size: 0.7rem;
    font-weight: 650;
    line-height: 1.45;
}

.contact-form-status[data-state="success"] { color: #6ee7b7; }
.contact-form-status[data-state="error"] { color: #fda4af; }

.contact-privacy {
    margin: 0.35rem 0 0;
    color: #6f8199;
    font-size: 0.64rem;
    line-height: 1.45;
}

.contact-direct {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-top: 2.2rem;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
}

.contact-direct a {
    display: grid;
    gap: 0.3rem;
    min-width: 0;
    padding: 1rem;
}

.contact-direct a + a {
    border-left: 1px solid var(--line-soft);
}

.contact-direct span {
    color: #6ee7b7;
    font-size: 0.6rem;
    font-weight: 800;
}

.contact-direct strong {
    overflow-wrap: anywhere;
    color: #e7eef8;
    font-size: 0.82rem;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes orbit-item-spin {
    from {
        transform: translate(-50%, -50%) rotate(var(--orbit-angle)) translateY(calc(0px - var(--orbit-radius))) rotate(calc(0deg - var(--orbit-angle)));
    }
    to {
        transform: translate(-50%, -50%) rotate(calc(var(--orbit-angle) + 360deg)) translateY(calc(0px - var(--orbit-radius))) rotate(calc(-360deg - var(--orbit-angle)));
    }
}

@keyframes reactor-pulse {
    0%, 100% { transform: scale(0.96); box-shadow: 0 0 26px rgba(34, 211, 238, 0.18), inset 0 0 18px rgba(34, 211, 238, 0.13); }
    50% { transform: scale(1.03); box-shadow: 0 0 38px rgba(34, 211, 238, 0.28), inset 0 0 22px rgba(34, 211, 238, 0.18); }
}

@media (max-width: 1180px) {
    .landing-main {
        grid-template-columns: minmax(0, 0.95fr) minmax(29rem, 1.05fr);
        padding-inline: 2.2rem;
    }

    .site-footer {
        padding-right: max(2.2rem, env(safe-area-inset-right));
        padding-left: max(2.2rem, env(safe-area-inset-left));
    }

    .solution-finder {
        padding-right: 2.2rem;
        padding-left: 2.2rem;
    }

    .orbit {
        width: min(32rem, 100%);
        height: 32rem;
        --orbit-radius: 13rem;
    }

    .landing-title {
        font-size: clamp(3rem, 5vw, 3.6rem);
    }
}

@media (max-width: 980px) {
    .site-shell,
    .subpage-shell {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        border-right: 0;
        border-left: 0;
        border-radius: 0;
    }

    .desktop-nav {
        display: none;
    }

    .mobile-menu {
        display: block;
    }

    .landing-main {
        grid-template-columns: minmax(0, 1fr);
        padding: 1.4rem 1.25rem 0.5rem;
    }

    .landing-copy {
        width: min(100%, 43rem);
        margin: 0 auto;
    }

    .orbit-visual {
        min-height: 33rem;
    }

    .orbit {
        width: min(34rem, 88vw);
        height: min(34rem, 88vw);
        --orbit-radius: 13.6rem;
    }

/* Needs assistant */
body.needs-advisor-open {
    overflow: hidden;
}

.needs-advisor-launcher {
    position: fixed;
    z-index: 880;
    right: max(1rem, env(safe-area-inset-right));
    bottom: max(1rem, env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.58rem;
    min-height: 3rem;
    padding: 0.68rem 0.9rem;
    border: 1px solid rgba(103, 232, 249, 0.5);
    border-radius: 8px;
    color: #eaf9fc;
    background: rgba(4, 16, 34, 0.94);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42), 0 0 24px rgba(34, 211, 238, 0.15);
    font-size: 0.88rem;
    font-weight: 650;
    cursor: pointer;
    backdrop-filter: blur(14px);
}

.needs-advisor-launcher svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: #67e8f9;
    stroke-width: 1.8;
}

.needs-advisor-launcher:hover,
.needs-advisor-launcher:focus-visible {
    border-color: #67e8f9;
    outline: 3px solid rgba(34, 211, 238, 0.18);
    outline-offset: 2px;
}

.needs-advisor {
    position: fixed;
    z-index: 900;
    inset: 0;
    visibility: hidden;
    pointer-events: none;
}

.needs-advisor.is-open {
    visibility: visible;
    pointer-events: auto;
}

.needs-advisor-backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    background: rgba(2, 6, 23, 0.76);
    opacity: 0;
    cursor: default;
    backdrop-filter: blur(8px);
    transition: opacity 240ms ease;
}

.needs-advisor.is-open .needs-advisor-backdrop {
    opacity: 1;
}

.needs-advisor-panel {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    width: min(47rem, 100%);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color: #f8fafc;
    background: #041022;
    box-shadow: -24px 0 70px rgba(0, 0, 0, 0.45);
    font-size: 17px;
    transform: translateX(100%);
    transition: transform 340ms cubic-bezier(0.22, 1, 0.36, 1);
}

.needs-advisor.is-open .needs-advisor-panel {
    transform: translateX(0);
}

.needs-advisor-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
    padding: max(1.15rem, env(safe-area-inset-top)) max(1.15rem, env(safe-area-inset-right)) 1rem 1.35rem;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(4, 16, 34, 0.97);
}

.needs-advisor-kicker {
    color: #67e8f9;
    font-size: 0.72rem;
    font-weight: 720;
}

.needs-advisor-header h2 {
    max-width: 35rem;
    margin: 0.45rem 0 0;
    color: #f8fafc;
    font-size: clamp(1.45rem, 3vw, 2.1rem);
    font-weight: 720;
    line-height: 1.15;
    text-wrap: balance;
}

.needs-advisor-close {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    color: #dbe5f1;
    background: rgba(15, 23, 42, 0.62);
    cursor: pointer;
}

.needs-advisor-close svg {
    width: 1.2rem;

            return localStorage.getItem(STORAGE_KEY);
        } catch (error) {
            return null;
        }
    };

    const readInitial = () => {
        const query = new URLSearchParams(window.location.search).get('lang');
        if (query === 'vi' || query === 'en') return query;
        const stored = readStored();
        if (stored === 'vi' || stored === 'en') return stored;
        return navigator.language && navigator.language.toLowerCase().startsWith('en') ? 'en' : 'vi';
    };

    let currentLanguage = normalize(readInitial());
    document.documentElement.lang = currentLanguage;
    document.documentElement.dataset.lang = currentLanguage;

    const persist = language => {
        try {
            localStorage.setItem(STORAGE_KEY, language);
        } catch (error) {
            /* Storage can be unavailable when a browser restricts local files. */
        }
    };

    const applyLabels = language => {
        document.querySelectorAll('[data-label-vi][data-label-en]').forEach(element => {
            const value = language === 'en' ? element.dataset.labelEn : element.dataset.labelVi;
            if (!value) return;
            element.setAttribute('aria-label', value);
            if (element.hasAttribute('title')) element.setAttribute('title', value);
        });
    };

    const apply = (language, shouldPersist = true) => {
        currentLanguage = normalize(language);
        document.documentElement.lang = currentLanguage;
        document.documentElement.dataset.lang = currentLanguage;
        document.body?.classList.toggle('lang-en', currentLanguage === 'en');
        document.body?.classList.toggle('lang-vi', currentLanguage === 'vi');
        const pageTitle = currentLanguage === 'en'
            ? document.documentElement.dataset.titleEn
            : document.documentElement.dataset.titleVi;
        if (pageTitle) document.title = pageTitle;

        document.querySelectorAll('[data-app-lang]').forEach(button => {
            const isActive = button.dataset.appLang === currentLanguage;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
        });

        applyLabels(currentLanguage);
        if (shouldPersist) persist(currentLanguage);
        window.dispatchEvent(new CustomEvent('thuanstore:languagechange', { detail: { language: currentLanguage } }));
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-app-lang]').forEach(button => {
            button.addEventListener('click', () => apply(button.dataset.appLang));
        });
        apply(currentLanguage, false);
    });

    window.ThuanStoreLanguage = {
        get: () => currentLanguage,
        set: apply
    };
})();
</script>
    <script data-thuanstore-inline="expert-core.js">
(() => {
    const mount = document.getElementById('expertApp');
    if (!mount) return;

    const getLanguage = () => window.ThuanStoreLanguage?.get?.() || document.documentElement.dataset.lang || 'vi';
    const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    const normalize = value => String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .trim();
    const number = (value, fallback = 0) => {
        const parsed = Number(String(value ?? '').replace(/[^0-9.-]/g, ''));
        return Number.isFinite(parsed) ? parsed : fallback;
    };
    const formatNumber = (value, language = getLanguage(), maximumFractionDigits = 1) => new Intl.NumberFormat(
        language === 'en' ? 'en-US' : 'vi-VN',
        { maximumFractionDigits }
    ).format(value);

    const bilingual = (vi, en) => `<span data-lang="vi">${escapeHtml(vi)}</span><span data-lang="en">${escapeHtml(en)}</span>`;
    const optionMarkup = option => `<option value="${escapeHtml(option.value)}" data-option-vi="${escapeHtml(option.vi)}" data-option-en="${escapeHtml(option.en)}">${escapeHtml(option.vi)}</option>`;

    const renderField = field => {
        const id = `expert-${field.id}`;
        const required = field.required ? ' required' : '';
        const span = field.span === 2 ? ' expert-field-wide' : '';
        const hint = field.hint ? `<small>${bilingual(field.hint.vi, field.hint.en)}</small>` : '';
        if (field.type === 'multiselect') {
            return `<fieldset class="expert-field expert-choice-field${span}" data-field-id="${escapeHtml(field.id)}"${required}>
                <legend>${bilingual(field.label.vi, field.label.en)}</legend>
                <div class="expert-choice-grid">${field.options.map(option => `<label><input type="checkbox" name="${escapeHtml(field.id)}" value="${escapeHtml(option.value)}"><span>${bilingual(option.vi, option.en)}</span></label>`).join('')}</div>
                ${hint}
            </fieldset>`;
        }
        if (field.type === 'select') {
            return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
                <select id="${id}" name="${escapeHtml(field.id)}"${required}>${field.options.map(optionMarkup).join('')}</select>${hint}
            </label>`;
        }
        if (field.type === 'textarea') {
            return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
                <textarea id="${id}" name="${escapeHtml(field.id)}" rows="${field.rows || 5}" data-placeholder-vi="${escapeHtml(field.placeholder?.vi || '')}" data-placeholder-en="${escapeHtml(field.placeholder?.en || '')}" placeholder="${escapeHtml(field.placeholder?.vi || '')}"${required}></textarea>${hint}
            </label>`;
        }
        const inputType = field.type === 'number' ? 'number' : 'text';
        const constraints = [
            field.min !== undefined ? ` min="${field.min}"` : '',
            field.max !== undefined ? ` max="${field.max}"` : '',
            field.step !== undefined ? ` step="${field.step}"` : ''
        ].join('');
        return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
            <input id="${id}" type="${inputType}" name="${escapeHtml(field.id)}" data-placeholder-vi="${escapeHtml(field.placeholder?.vi || '')}" data-placeholder-en="${escapeHtml(field.placeholder?.en || '')}" placeholder="${escapeHtml(field.placeholder?.vi || '')}"${constraints}${required}>${hint}
        </label>`;
    };

    const readValues = (form, fields) => Object.fromEntries(fields.map(field => {
        if (field.type === 'multiselect') {
            return [field.id, [...form.querySelectorAll(`input[name="${field.id}"]:checked`)].map(input => input.value)];
        }
        return [field.id, form.elements[field.id]?.value?.trim?.() ?? form.elements[field.id]?.value ?? ''];
    }));

    const setValues = (form, fields, values = {}) => {
        fields.forEach(field => {
            const value = values[field.id];
            if (value === undefined) return;
            if (field.type === 'multiselect') {
                form.querySelectorAll(`input[name="${field.id}"]`).forEach(input => {
                    input.checked = Array.isArray(value) && value.includes(input.value);
                });
                return;
            }
            if (form.elements[field.id]) form.elements[field.id].value = value;
        });
    };

    const resultToText = result => {
        const lines = [result.title, result.summary, ''];
        (result.metrics || []).forEach(metric => lines.push(`${metric.label}: ${metric.value}${metric.note ? ` - ${metric.note}` : ''}`));
        (result.sections || []).forEach(section => {
            lines.push('', section.title);
            (section.items || []).forEach(item => lines.push(`- ${typeof item === 'string' ? item : `${item.title}: ${item.text}`}`));
        });
        if (result.caution) lines.push('', result.caution);
        return lines.join('\n');
    };

    const createResult = (result, config, language) => {
        const output = document.getElementById('expertOutput');
        output.hidden = false;
        output.innerHTML = '';

        const header = document.createElement('header');
        header.className = 'expert-result-header';
        const kicker = document.createElement('span');
        kicker.className = 'expert-result-kicker';
        kicker.textContent = result.kicker || (language === 'en' ? 'EXPERT ANALYSIS' : 'PHÂN TÍCH CHUYÊN MÔN');
        const title = document.createElement('h2');
        title.textContent = result.title;
        const summary = document.createElement('p');
        summary.textContent = result.summary;
        header.append(kicker, title, summary);
        output.append(header);

        if (result.metrics?.length) {
            const metrics = document.createElement('div');
            metrics.className = 'expert-result-metrics';
            result.metrics.forEach(metric => {
                const item = document.createElement('div');
                const label = document.createElement('span');
                const value = document.createElement('strong');
                label.textContent = metric.label;
                value.textContent = metric.value;
                item.append(label, value);
                if (metric.note) {
                    const note = document.createElement('small');
                    note.textContent = metric.note;
                    item.append(note);
                }
                metrics.append(item);
            });
            output.append(metrics);
        }

        (result.sections || []).forEach((section, index) => {
            const block = document.createElement('section');
            block.className = 'expert-result-section';
            const heading = document.createElement('h3');
            heading.innerHTML = `<span>${String(index + 1).padStart(2, '0')}</span>${escapeHtml(section.title)}`;
            block.append(heading);
            if (section.intro) {
                const intro = document.createElement('p');
                intro.textContent = section.intro;
                block.append(intro);
            }
            const list = document.createElement('ul');
            (section.items || []).forEach(entry => {
                const item = document.createElement('li');
                if (typeof entry === 'string') {
                    item.textContent = entry;
                } else {
                    const strong = document.createElement('strong');
                    const text = document.createElement('span');
                    strong.textContent = entry.title;
                    text.textContent = entry.text;
                    item.append(strong, text);
                }
                list.append(item);
            });
            block.append(list);
            output.append(block);
        });

        if (result.table?.rows?.length) {
            const region = document.createElement('div');
            region.className = 'expert-table-region';
            region.tabIndex = 0;
            const table = document.createElement('table');
            const head = document.createElement('thead');
            const headRow = document.createElement('tr');
            result.table.headers.forEach(value => {
                const cell = document.createElement('th');
                cell.scope = 'col';
                cell.textContent = value;
                headRow.append(cell);
            });
            head.append(headRow);
            const body = document.createElement('tbody');
            result.table.rows.forEach(row => {
                const tableRow = document.createElement('tr');
                row.forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    tableRow.append(cell);
                });
                body.append(tableRow);
            });
            table.append(head, body);
            region.append(table);
            output.append(region);
        }

        if (result.caution) {
            const caution = document.createElement('p');
            caution.className = 'expert-caution';
            caution.textContent = result.caution;
            output.append(caution);
        }

        const actions = document.createElement('div');
        actions.className = 'expert-result-actions';
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'secondary-action';
        copy.textContent = language === 'en' ? 'Copy analysis' : 'Sao chép phân tích';
        copy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultToText(result));
                copy.textContent = language === 'en' ? 'Copied' : 'Đã sao chép';
            } catch (error) {
                copy.textContent = language === 'en' ? 'Select and copy manually' : 'Hãy chọn và sao chép thủ công';
            }
        });
        actions.append(copy);

        if (result.download) {
            const download = document.createElement('button');
            download.type = 'button';
            download.className = 'secondary-action';
            download.textContent = result.download.label;
            download.addEventListener('click', () => {
                const blob = new Blob([result.download.content], { type: result.download.type || 'text/csv;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = result.download.filename;
                link.click();
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
            });
            actions.append(download);
        }

        const contact = document.createElement('a');
        contact.className = 'primary-action';
        const brief = (result.brief || resultToText(result)).slice(0, 1800);
        contact.href = `lienhe.html?service=${encodeURIComponent(config.contactService)}&lang=${language}&brief=${encodeURIComponent(brief)}`;
        contact.textContent = language === 'en' ? 'Confirm and discuss implementation' : 'Xác nhận và trao đổi triển khai';
        actions.append(contact);
        output.append(actions);
    };

    const applyLanguage = config => {
        const language = getLanguage();
        mount.querySelectorAll('select option[data-option-vi]').forEach(option => {
            option.textContent = language === 'en' ? option.dataset.optionEn : option.dataset.optionVi;
        });
        mount.querySelectorAll('[data-placeholder-vi][data-placeholder-en]').forEach(field => {
            field.placeholder = language === 'en' ? field.dataset.placeholderEn : field.dataset.placeholderVi;
        });
        document.title = `${language === 'en' ? config.title.en : config.title.vi} - Thuan Store`;
    };

    const mountExpert = config => {
        mount.style.setProperty('--expert-color', config.color);
        mount.innerHTML = `<section class="expert-intro">
            <div>
                <span class="expert-badge">${bilingual('AI CHUYÊN GIA · BETA', 'EXPERT AI · BETA')}</span>
                <h1>${bilingual(config.title.vi, config.title.en)}</h1>
                <p>${bilingual(config.summary.vi, config.summary.en)}</p>
            </div>
            <ol class="expert-flow" aria-label="Workflow">
                <li><span>1</span>${bilingual('Nhập bối cảnh', 'Enter context')}</li>
                <li><span>2</span>${bilingual('Nhận phân tích', 'Get analysis')}</li>
                <li><span>3</span>${bilingual('Kiểm tra và dùng', 'Review and use')}</li>
            </ol>
        </section>
        <div class="expert-workspace">
            <form id="expertForm" class="expert-form">
                <div class="expert-form-heading"><span>${bilingual('DỮ LIỆU ĐẦU VÀO', 'INPUT')}</span><h2>${bilingual(config.formTitle.vi, config.formTitle.en)}</h2><p>${bilingual(config.formSummary.vi, config.formSummary.en)}</p></div>
                <div class="expert-field-grid">${config.fields.map(renderField).join('')}</div>
                <p id="expertFormError" class="expert-form-error" role="alert"></p>
                <div class="expert-form-actions">
                    <button class="primary-action" type="submit">${bilingual(config.submit.vi, config.submit.en)}</button>
                    <button id="expertExample" class="secondary-action" type="button">${bilingual('Điền dữ liệu mẫu', 'Use sample data')}</button>
                    <button id="expertReset" class="text-action" type="reset">${bilingual('Làm lại', 'Reset')}</button>
                </div>
                <p class="expert-local-note">${bilingual('Phân tích chạy trực tiếp trên thiết bị. Dữ liệu nhập tại đây không được gửi lên máy chủ.', 'Analysis runs directly on your device. Data entered here is not sent to a server.')}</p>
            </form>
            <section id="expertOutput" class="expert-output" aria-live="polite" hidden>
                <div class="expert-empty-state"><span>AI</span><h2>${bilingual('Kết quả sẽ xuất hiện tại đây', 'Your result will appear here')}</h2></div>
            </section>
        </div>`;

        const form = document.getElementById('expertForm');
        const output = document.getElementById('expertOutput');
        const error = document.getElementById('expertFormError');
        let lastValues = null;

        form.addEventListener('submit', event => {
            event.preventDefault();
            error.textContent = '';
            if (!form.checkValidity()) {
                error.textContent = getLanguage() === 'en' ? 'Please complete the required fields.' : 'Vui lòng nhập đủ các trường bắt buộc.';
                form.reportValidity();
                return;
            }
            const values = readValues(form, config.fields);
            const missingChoice = config.fields.find(field => field.type === 'multiselect' && field.required && !values[field.id].length);
            if (missingChoice) {
                error.textContent = getLanguage() === 'en' ? 'Please select at least one option.' : 'Vui lòng chọn ít nhất một lựa chọn.';
                form.querySelector(`[data-field-id="${missingChoice.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            try {
                lastValues = values;
                createResult(config.analyze(values, getLanguage(), { normalize, number, formatNumber }), config, getLanguage());
                output.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (analysisError) {
                error.textContent = getLanguage() === 'en' ? 'The input could not be analyzed. Please review it and try again.' : 'Chưa thể phân tích dữ liệu này. Hãy kiểm tra và thử lại.';
            }
        });

        document.getElementById('expertExample').addEventListener('click', () => {
            setValues(form, config.fields, config.example);
            form.requestSubmit();
        });
        form.addEventListener('reset', () => {
            setTimeout(() => {
                output.hidden = true;
                output.innerHTML = '';
                error.textContent = '';
                lastValues = null;
            });
        });
        window.addEventListener('thuanstore:languagechange', () => {
            applyLanguage(config);
            if (lastValues) createResult(config.analyze(lastValues, getLanguage(), { normalize, number, formatNumber }), config, getLanguage());
        });
        applyLanguage(config);
        if (window.location.hash === '#expertApp') setTimeout(() => mount.scrollIntoView({ block: 'start' }), 100);
    };

    window.ThuanExpert = { mount: mountExpert, normalize, number, formatNumber };
})();
</script>

    const platformNames = {
        facebook: { vi: 'Facebook', en: 'Facebook' },
        tiktok: { vi: 'TikTok', en: 'TikTok' },
        website: { vi: 'Website/SEO', en: 'Website/SEO' },
        google: { vi: 'Google Business', en: 'Google Business' },
        email: { vi: 'Email/Zalo chăm sóc khách', en: 'Email/customer messaging' }
    };
    const objectiveNames = {
        awareness: { vi: 'được biết đến', en: 'awareness' },
        trust: { vi: 'tạo tin cậy', en: 'trust' },
        leads: { vi: 'nhận yêu cầu', en: 'lead generation' },
        sales: { vi: 'tạo đơn hàng', en: 'sales' },
        retention: { vi: 'giữ khách và mua lại', en: 'retention and repeat purchase' }
    };

    window.ThuanExpert.mount({
        color: '#60a5fa',
        contactService: 'seo',
        title: { vi: 'AI lập kế hoạch nội dung', en: 'AI content planner' },
        summary: {
            vi: 'Tạo trụ cột nội dung, lịch 4 tuần, góc triển khai và tiêu chí kiểm tra theo đúng ngành, kênh và nguồn lực đăng bài.',
            en: 'Create content pillars, a four-week calendar, execution angles, and review criteria for your industry, channels, and publishing capacity.'
        },
        formTitle: { vi: 'Xác định nội dung cần duy trì', en: 'Define the content system to maintain' },
        formSummary: {
            vi: 'Công cụ ưu tiên nội dung có thể sản xuất đều, có mục tiêu và có người kiểm tra trước khi đăng.',
            en: 'The tool prioritizes content that can be produced consistently, tied to a goal, and reviewed before publishing.'
        },
        submit: { vi: 'Tạo kế hoạch nội dung', en: 'Build content plan' },
        fields: [
            { id: 'industry', type: 'select', required: true, label: { vi: 'Lĩnh vực', en: 'Industry' }, options: industryOptions },
            { id: 'objective', type: 'select', required: true, label: { vi: 'Mục tiêu 30 ngày', en: '30-day objective' }, options: [
                { value: 'awareness', vi: 'Tăng nhận biết', en: 'Increase awareness' },
                { value: 'trust', vi: 'Tăng mức độ tin cậy', en: 'Build trust' },
                { value: 'leads', vi: 'Nhận tin nhắn hoặc yêu cầu', en: 'Generate messages or inquiries' },
                { value: 'sales', vi: 'Hỗ trợ tạo đơn hàng', en: 'Support sales' },
                { value: 'retention', vi: 'Chăm sóc khách đã mua', en: 'Retain existing customers' }
            ] },
            { id: 'offer', type: 'text', required: true, span: 2, label: { vi: 'Sản phẩm, dịch vụ hoặc chủ đề trọng tâm', en: 'Primary product, service, or topic' }, placeholder: { vi: 'Ví dụ: sữa công thức cho trẻ theo từng độ tuổi', en: 'Example: infant formula organized by age group' } },
            { id: 'audience', type: 'text', required: true, span: 2, label: { vi: 'Người cần tiếp cận', en: 'Audience' }, placeholder: { vi: 'Ví dụ: cha mẹ có con dưới 3 tuổi, cần thông tin rõ và dễ kiểm tra', en: 'Example: parents of children under three who need clear, verifiable information' } },
            { id: 'channels', type: 'multiselect', required: true, span: 2, label: { vi: 'Kênh sẽ sử dụng', en: 'Channels' }, options: [
                { value: 'facebook', vi: 'Facebook', en: 'Facebook' },
                { value: 'tiktok', vi: 'TikTok', en: 'TikTok' },
                { value: 'website', vi: 'Website và SEO', en: 'Website and SEO' },
                { value: 'google', vi: 'Google Business', en: 'Google Business' },
                { value: 'email', vi: 'Email hoặc Zalo chăm sóc khách', en: 'Email or customer messaging' }
            ] },
            { id: 'frequency', type: 'number', required: true, min: 1, max: 7, step: 1, label: { vi: 'Số nội dung mỗi tuần', en: 'Posts per week' }, placeholder: { vi: '3', en: '3' } },
            { id: 'tone', type: 'select', required: true, label: { vi: 'Giọng nội dung', en: 'Content voice' }, options: [
                { value: 'clear', vi: 'Rõ ràng, dễ hiểu', en: 'Clear and accessible' },
                { value: 'expert', vi: 'Chuyên môn, có dẫn chứng', en: 'Expert and evidence-led' },
                { value: 'friendly', vi: 'Gần gũi, hỗ trợ', en: 'Friendly and supportive' },
                { value: 'premium', vi: 'Chỉn chu, cao cấp', en: 'Polished and premium' }
            ] }
        ],
        example: {
            industry: 'mother-baby', objective: 'trust', offer: 'Sữa, tã và đồ dùng thiết yếu cho mẹ và bé', audience: 'Cha mẹ có con dưới 3 tuổi, cần thông tin dễ hiểu và có thể kiểm tra', channels: ['facebook', 'tiktok', 'website'], frequency: '3', tone: 'clear'
        },
        analyze(values, lang, helpers) {
            const isEn = lang === 'en';
            const frequency = Math.max(1, Math.min(7, helpers.number(values.frequency, 3)));
            const total = frequency * 4;
            const chosenPillars = pillars[values.industry][lang];
            const channels = values.channels.map(value => platformNames[value][lang]);
            const objective = objectiveNames[values.objective][lang];
            const formats = isEn
                ? ['Plain-language explainer', 'Checklist or comparison', 'Short demonstration', 'Customer question answered', 'Behind the process', 'Evidence or case example', 'Offer with clear conditions']
                : ['Giải thích bằng ngôn ngữ dễ hiểu', 'Danh sách kiểm tra hoặc so sánh', 'Minh họa ngắn', 'Trả lời câu hỏi của khách', 'Hậu trường quy trình', 'Bằng chứng hoặc tình huống thực tế', 'Ưu đãi kèm điều kiện rõ'];
            const calendar = [];
            for (let index = 0; index < total; index += 1) {
                const week = Math.floor(index / frequency) + 1;
                const pillar = chosenPillars[index % chosenPillars.length];
                const format = formats[index % formats.length];
                const channel = channels[index % channels.length];
                calendar.push(isEn
                    ? `Week ${week} · ${channel}: ${format} about “${pillar}”, connected to ${values.offer}. End with one measurable action.`
                    : `Tuần ${week} · ${channel}: ${format} về “${pillar}”, gắn với ${values.offer}. Kết thúc bằng một hành động có thể đo.`);
            }
            const reuse = isEn
                ? ['Turn one researched website article into two social posts and one short-video brief.', 'Save approved facts, product attributes, and customer questions in a source library.', 'Record which topic creates qualified questions, not only views.', 'Refresh price, availability, and policy details before reusing old content.']
                : ['Chuyển một bài website có nghiên cứu thành hai bài mạng xã hội và một đề bài video ngắn.', 'Lưu dữ kiện đã duyệt, thuộc tính sản phẩm và câu hỏi khách hàng thành thư viện nguồn.', 'Theo dõi chủ đề tạo ra câu hỏi có chất lượng, không chỉ lượt xem.', 'Kiểm tra lại giá, hàng sẵn có và chính sách trước khi dùng lại nội dung cũ.'];
            const review = compliance[values.industry] || compliance.default;
            const hoursLow = Math.max(2, Math.ceil(frequency * 1.2));
            const hoursHigh = Math.max(4, Math.ceil(frequency * 2.5));

            return {
                title: isEn ? `Four-week content system for ${values.offer}` : `Hệ thống nội dung 4 tuần cho ${values.offer}`,
                summary: isEn
                    ? `The plan uses ${chosenPillars.length} distinct pillars across ${channels.join(', ')} to support ${objective} without repeating the same sales message.`
                    : `Kế hoạch dùng ${chosenPillars.length} trụ cột khác nhau trên ${channels.join(', ')} để hướng tới ${objective}, không lặp lại một thông điệp bán hàng.`,
                metrics: [
                    { label: isEn ? 'Planned outputs' : 'Số nội dung dự kiến', value: isEn ? `${total} items / 4 weeks` : `${total} nội dung / 4 tuần`, note: isEn ? `${frequency} per week` : `${frequency} nội dung mỗi tuần` },
                    { label: isEn ? 'Core pillars' : 'Trụ cột nội dung', value: String(chosenPillars.length), note: isEn ? 'Each answers a different customer need' : 'Mỗi trụ cột giải quyết một nhu cầu khác nhau' },
                    { label: isEn ? 'Production load' : 'Nguồn lực dự kiến', value: isEn ? `${hoursLow}–${hoursHigh} hours/week` : `${hoursLow}–${hoursHigh} giờ/tuần`, note: isEn ? 'Before filming-heavy content' : 'Chưa gồm nội dung cần quay phức tạp' }
                ],
                sections: [
                    { title: isEn ? 'Content pillars' : 'Trụ cột nội dung', items: chosenPillars },
                    { title: isEn ? 'Four-week publishing calendar' : 'Lịch triển khai 4 tuần', intro: isEn ? `Audience: ${values.audience}` : `Đối tượng: ${values.audience}`, items: calendar },
                    { title: isEn ? 'Reuse and measurement workflow' : 'Quy trình tái sử dụng và đo lường', items: reuse },
                    { title: isEn ? 'Required editorial review' : 'Kiểm tra bắt buộc trước khi đăng', items: [...review[lang], ...compliance.default[lang].slice(-1)] }
                ],
                caution: isEn
                    ? 'This plan is a working draft. Product facts, prices, claims, customer imagery, and regulated content require human verification before publication.'
                    : 'Đây là bản kế hoạch làm việc. Dữ kiện sản phẩm, giá, công dụng, hình ảnh khách hàng và nội dung có quy định phải được người phụ trách kiểm tra trước khi đăng.',
                brief: isEn
                    ? `Content plan\nOffer: ${values.offer}\nAudience: ${values.audience}\nObjective: ${objective}\nChannels: ${channels.join(', ')}\nFrequency: ${frequency}/week`
                    : `Kế hoạch nội dung\nSản phẩm/dịch vụ: ${values.offer}\nĐối tượng: ${values.audience}\nMục tiêu: ${objective}\nKênh: ${channels.join(', ')}\nTần suất: ${frequency}/tuần`
            };
        }
    });
})();
</script>
