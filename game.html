
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cứu Vợ - Ultimate Action</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background-color: #020617;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh; 
            width: 100vw; font-family: 'Pixelify Sans', sans-serif;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.1);
        }
        
        @media (min-width: 501px) {
            #game-container { border-radius: 20px; height: 95vh; border: 2px solid #1e293b; }
        }

        canvas {
            display: block; width: 100%; height: 100%;
            object-fit: contain; 
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            80% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .panel {
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #38bdf8;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center; color: white;
            pointer-events: auto; width: 85%; max-width: 380px;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .panel.show { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .game-title { 
            margin: 0 0 10px 0; font-size: 38px; 
            letter-spacing: 2px; text-transform: uppercase;
        }
        .desc { font-size: 16px; margin: 0 0 20px 0; color: #cbd5e1; }
        
        .score-box {
            background: rgba(0,0,0,0.5); border-radius: 8px; padding: 10px;
            color: #facc15; font-size: 26px; font-weight: bold;
            margin: 0 auto 25px auto; border: 1px solid #475569;
        }
        
        .btn {
            padding: 12px 20px; font-family: inherit; font-size: 20px;
            color: white; font-weight: bold; cursor: pointer; letter-spacing: 1px;
            width: 100%; text-transform: uppercase; border: none; border-radius: 8px;
            transition: all 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.4); }
        
        .btn-primary { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }
        .btn-success { background: linear-gradient(180deg, #10b981 0%, #047857 100%); }
        .btn-warning { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); }
        .btn-purple { background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%); }

        .hint-text {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: #fff; font-size: 18px; font-weight: bold;
            pointer-events: none; text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        /* Nút Tuyện Chiêu (Ultimate) */
        #btn-ult {
            position: absolute;
            bottom: 30px; right: 20px;
            width: 70px; height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #eab308 0%, #b45309 100%);
            border: 3px solid #fef08a;
            color: white; font-family: 'Pixelify Sans', sans-serif;
            font-size: 24px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; opacity: 0.3; transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0);
            z-index: 100;
        }
        #btn-ult.ready {
            pointer-events: auto; opacity: 1; transform: scale(1);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.8), inset 0 0 10px white;
            animation: ultPulse 0.5s infinite alternate; cursor: pointer;
        }
        #btn-ult:active { transform: scale(0.9); }

        .chest-container { display: flex; justify-content: space-around; margin: 20px 0; }
        .chest {
            font-size: 45px; cursor: pointer; transition: transform 0.2s;
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 5px;
            width: 75px; height: 75px; display: flex; align-items: center; justify-content: center;
            border: 2px solid transparent; text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        .chest:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); border-color: #38bdf8; }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        @keyframes ultPulse {
            from { box-shadow: 0 0 10px #facc15; }
            to { box-shadow: 0 0 30px #fef08a, inset 0 0 15px white; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hint-text" id="hint">CHẠM ĐỂ NHẢY<br>CHẠM 3 LẦN ĐỂ LƯỚT (DASH)</div>
        <div id="btn-ult" onclick="Game.activateUltimate()">NỘ</div>
        
        <div id="ui-layer">
            <div id="shop-menu" class="panel">
                <h2 class="game-title" style="color:#facc15; text-shadow: 2px 2px 0 #b45309;">THƯƠNG NHÂN</h2>
                <p style="font-size: 22px;">Tiền: <span id="shop-coins" style="color:#facc15; font-weight:bold; font-size:26px;">0</span> 💰</p>
                <button class="btn btn-success" onclick="Game.buyUpgrade('hp')">Bơm 1 Máu (50 💰)</button>
                <button class="btn btn-warning" onclick="Game.buyUpgrade('dmg')">Tăng Sát Thương (100 💰)</button>
                <button class="btn btn-purple" onclick="Game.openMinigame()">Mở Rương Bí Ẩn (20 💰)</button>
                <button class="btn btn-primary" onclick="Game.exitShop()">Tiếp Tục Lên Đường</button>
            </div>

            <div id="minigame-menu" class="panel" style="border-color: #a855f7;">
                <h2 class="game-title" style="color:#c084fc; text-shadow: 2px 2px 0 #6b21a8;">MAY MẮN</h2>
                <p style="font-size: 18px; color: #e2e8f0;">Lựa chọn 1 rương để thử vận may!</p>
                <div class="chest-container">
                    <div class="chest" onclick="Game.openChest(0)">🎁</div>
                    <div class="chest" onclick="Game.openChest(1)">🎁</div>
                    <div class="chest" onclick="Game.openChest(2)">🎁</div>
                </div>
                <button class="btn btn-primary" onclick="Game.closeMinigame()">Bỏ Qua</button>
            </div>

            <div id="game-over-menu" class="panel">
                <h1 class="game-title" style="color: #ef4444; text-shadow: 3px 3px 0 #7f1d1d;">GAME OVER</h1>
                <p class="desc">Vợ bạn vẫn đang bị giam giữ!</p>
                <div class="score-box">Điểm: <span id="final-score">0</span></div>
                <button class="btn btn-primary" onclick="Game.resetGame()">CHƠI LẠI</button>
            </div>

            <div id="victory-menu" class="panel">
                <h1 class="game-title" style="color: #4ade80; text-shadow: 3px 3px 0 #14532d;">THẮNG LỢI!</h1>
                <p class="desc">Anh hùng cứu mỹ nhân thành công! ♥</p>
                <div class="score-box">Điểm: <span id="win-score">0</span></div>
                <button class="btn btn-success" onclick="Game.resetGame()">CHƠI LẠI TỪ ĐẦU</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 

        const GW = 400; 
        const GH = 700;
        const GROUND_Y = 480; 

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = GW * dpr;
            canvas.height = GH * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const COLORS = {
            skyTop: '#0f172a', skyBot: '#1e293b',
            skyTopEvil: '#450a0a', skyBotEvil: '#7f1d1d',
            groundTop: '#15803d', groundBot: '#064e3b', 
            dirtTop: '#451a03', dirtBot: '#1c0a00',     
            mountBack: '#1e293b', mountFront: '#334155',
            playerSkin: '#fef08a', playerShirt: '#ef4444', playerPants: '#2563eb',
            bulletPlayer: '#fef08a', spark: '#fef08a',
            blood: ['#ef4444', '#991b1b'] // Đã thêm biến màu bị thiếu
        };

        function checkAABB(r1, r2) {
            let offset = 4;
            return r1.x + offset < r2.x + r2.w - offset && 
                   r1.x + r1.w - offset > r2.x + offset && 
                   r1.y + offset < r2.y + r2.h - offset && 
                   r1.y + r1.h - offset > r2.y + offset;
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * t;
        }

        // Fix click/touch overlay
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (Game.state !== 'PLAY') {
                if (Game.state === 'CUTSCENE' && Game.csPhase > 0) Game.csTimer = 9999; 
                return;
            }
            Game.player.doJump();
        });

        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                e.preventDefault();
                if (Game.state === 'PLAY') Game.player.doJump();
            }
            if (e.code === 'KeyE') { // E to use Ultimate
                Game.activateUltimate();
            }
        });

        class FloatingText {
            constructor(x, y, text, color, size = 18) {
                this.x = x; this.y = y; this.text = text;
                this.color = color; this.size = size;
                this.life = 40; this.maxLife = 40;
                this.vy = -2 - Math.random();
                this.vx = (Math.random() - 0.5) * 2;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color; ctx.font = `bold ${this.size}px "Pixelify Sans"`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y); ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Đã bổ sung class Pet bị thiếu
        class Pet {
            constructor(player) {
                this.player = player;
                this.x = player.x - 30;
                this.y = player.y - 20;
            }
            update() {
                this.x += ((this.player.x - 30) - this.x) * 0.1;
                this.y += ((this.player.y - 15 + Math.sin(Game.frameCount * 0.1) * 10) - this.y) * 0.1;
            }
            draw(ctx) {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y - 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Đã bổ sung class SupplyBird bị thiếu
        class SupplyBird {
            constructor() {
                this.x = GW + 50;
                this.y = 80 + Math.random() * 100;
                this.w = 35; this.h = 25;
                this.vx = -3;
                this.active = true;
            }
            update() {
                this.x += this.vx;
                this.y += Math.sin(Game.frameCount * 0.1) * 1.5;
                if (this.x < -100) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, this.w, this.h);
                let wingY = Math.sin(Game.frameCount * 0.4) * 15;
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath(); ctx.moveTo(this.w/2, 0); ctx.lineTo(-10, -10 + wingY); ctx.lineTo(this.w, -10 + wingY); ctx.fill();
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(5, 10, 25, 5); ctx.fillRect(15, 0, 5, 25); // Dấu cộng y tế xanh
                ctx.restore();
            }
        }

        // --- CORE CLASSES ---
        class Coin {
            constructor(x, y) {
                this.x = x; this.y = y; this.w = 10; this.h = 10;
                this.vx = (Math.random() - 0.5) * 6; this.vy = -4 - Math.random() * 5;
                this.active = true;
            }
            update() {
                this.x += this.vx; this.vy += 0.5; this.y += this.vy;
                if (this.y > GROUND_Y - 10) {
                    this.y = GROUND_Y - 10; this.vy = -this.vy * 0.5; this.vx *= 0.8;
                    if (Math.abs(this.vy) < 1) this.vy = 0;
                }
                if (Game.state === 'PLAY') this.x -= 2.8; 
                let dx = (Game.player.x + Game.player.w/2) - this.x;
                let dy = (Game.player.y + Game.player.h/2) - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 120) { this.x += (dx/dist) * 9; this.y += (dy/dist) * 9; }
                if (this.x < -20) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = '#ca8a04'; ctx.fillRect(this.x-5, this.y-5, 10, 10);
                ctx.fillStyle = '#facc15'; ctx.fillRect(this.x-4, this.y-4, 8, 8);
                ctx.fillStyle = '#fff'; ctx.fillRect(this.x-2, this.y-2, 2, 4);
            }
        }

        class Meteor {
            constructor() {
                this.x = Math.random() * GW + 100; this.y = -50;
                this.vx = -4 - Math.random() * 3; this.vy = 6 + Math.random() * 4;
                this.w = 20; this.h = 20; this.active = true;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.y > GROUND_Y) {
                    this.active = false; Game.shake = 5;
                    Game.spawnParticles(this.x, GROUND_Y, ['#ef4444', '#f59e0b', '#000'], 15, 4, true);
                    // Sát thương nổ lan
                    let dist = Math.hypot(Game.player.x - this.x, Game.player.y - GROUND_Y);
                    if (dist < 60 && Game.player.invuln <= 0) Game.player.takeDamage();
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(this.x - this.vx, this.y - this.vy, 14, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#450a0a'; ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2); ctx.fill();
            }
        }

        class Merchant {
            constructor() { this.x = GW + 50; this.y = GROUND_Y - 45; }
            update() { if (this.x > GW - 80) this.x -= 2; }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(15, 45, 20, 5, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(35, 25, 22, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fef08a'; ctx.fillRect(20, 15, 12, 12); 
                ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 15, 25, 30);
                ctx.fillStyle = '#2563eb'; ctx.fillRect(-5, 20, 10, 15);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(2, 45, 8, 10); ctx.fillRect(15, 45, 8, 10);
                ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.arc(12, 5, 14, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#7c2d12'; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(12, -20); ctx.lineTo(35, 0); ctx.fill();
                ctx.fillStyle = '#fef08a'; ctx.fillRect(5, 10, 15, 10);
                ctx.restore();
            }
        }

        class Trap {
            constructor(x, w) {
                this.x = x; this.w = w; this.h = 24; this.y = GROUND_Y - this.h;
                this.vx = -2.8; this.active = true;
            }
            update() { this.x += this.vx; if (this.x < -this.w) this.active = false; }
            draw(ctx) {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(this.x, GROUND_Y - 6, this.w, 6); 
                let spikeW = 16; let numSpikes = Math.floor(this.w / spikeW);
                let offsetX = this.x + (this.w - numSpikes * spikeW) / 2;
                for(let i=0; i<numSpikes; i++) {
                    let sx = offsetX + i*spikeW;
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(sx + 2, GROUND_Y - 6); ctx.lineTo(sx + spikeW/2, this.y + 4); ctx.lineTo(sx + spikeW - 2, GROUND_Y - 6); ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(sx + spikeW*0.35, this.y + 12); ctx.lineTo(sx + spikeW/2, this.y + 4); ctx.lineTo(sx + spikeW*0.65, this.y + 12); ctx.fill();
                }
            }
        }

        class Platform {
            constructor(x, y, w) {
                this.x = x; this.y = y; this.w = w; this.h = 16;
                this.vx = -2.8; this.active = true; this.oldY = y;
                this.isMoving = Math.random() > 0.6; this.baseY = y; this.moveOffset = Math.random() * Math.PI * 2;
            }
            update() {
                this.oldY = this.y; this.x += this.vx; 
                if (this.isMoving) this.y = this.baseY + Math.sin(Game.frameCount * 0.05 + this.moveOffset) * 25;
                if (this.x < -this.w) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x + 5, this.y + 10, this.w, this.h);
                ctx.fillStyle = '#334155'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#64748b'; ctx.fillRect(this.x, this.y, this.w, 4);
                ctx.fillStyle = '#eab308';
                for(let i=10; i<this.w-10; i+=20) { ctx.fillRect(this.x + i, this.y, 10, 4); }
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.w, this.h);
            }
        }

        class RainDrop {
            constructor() {
                this.x = Math.random() * (GW + 200); this.y = Math.random() * -100;
                this.vy = Math.random() * 10 + 15; this.vx = -4; this.len = Math.random() * 15 + 10;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.y > GH) { this.y = -20; this.x = Math.random() * (GW + 200); }
            }
            draw(ctx) {
                ctx.strokeStyle = 'rgba(200, 220, 255, 0.4)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.vx, this.y - this.len); ctx.stroke();
            }
        }

        class Player {
            constructor() {
                this.w = 30; this.h = 45; this.x = 80; this.y = GROUND_Y - this.h;
                this.vy = 0; this.jumpPower = -14;
                this.isGrounded = true; this.jumpCount = 0; this.rollAngle = 0;
                this.lives = 3; this.weapon = 'N';
                this.cooldown = 0; this.invuln = 0; this.gunAngle = 0; this.muzzleFlash = 0; 
                this.isDashing = false; this.dashTimer = 0; this.ghosts = [];
            }

            update() {
                let prevY = this.y;
                
                if (this.isDashing) {
                    this.dashTimer--;
                    this.x += 12; // Dash speed
                    this.vy = 0; // Anti-gravity during dash
                    if (Game.frameCount % 2 === 0) {
                        this.ghosts.push({x: this.x, y: this.y, life: 10});
                    }
                    if (this.dashTimer <= 0) { this.isDashing = false; this.vy = -3; }
                } else {
                    this.vy += 0.85; 
                }
                
                this.y += this.vy;
                this.isGrounded = false; let onPlatform = false;

                // Ghost trail logic
                this.ghosts.forEach(g => g.life--);
                this.ghosts = this.ghosts.filter(g => g.life > 0);

                if (Game.state === 'PLAY' && !this.isDashing) {
                    for (let p of Game.platforms) {
                        if (this.vy >= 0 && prevY + this.h <= p.oldY + 20 && this.x + this.w > p.x && this.x < p.x + p.w) {
                            if (this.y + this.h >= p.y) {
                                this.y = p.y - this.h; this.vy = 0;
                                this.isGrounded = true; this.jumpCount = 0; onPlatform = true; this.x += p.vx; 
                                break;
                            }
                        }
                    }
                }
                
                if (!onPlatform && this.y >= GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h; this.vy = 0; 
                    this.isGrounded = true; this.jumpCount = 0;
                }

                if (Game.state === 'PLAY') {
                    if (!this.isDashing) {
                        if (this.x < 80) this.x += 2;
                        if (this.x > 80) this.x -= 1;
                    } else if (this.x > GW - 50) {
                        this.x = GW - 50; // Clamp dash
                    }
                } else if (Game.state === 'SHOP' || Game.state === 'WIN_CUTSCENE') {
                    this.x += (100 - this.x) * 0.1; 
                }

                if (this.cooldown > 0) this.cooldown--;
                if (this.invuln > 0) this.invuln--;
                if (this.muzzleFlash > 0) this.muzzleFlash--;
                
                let targetAngle = 0;
                let px = this.x + this.w; let py = this.y + 15;

                if (Game.state === 'PLAY' && !this.isDashing) {
                    let target = Game.findNearestTarget(px, py);
                    if (target) {
                        let tx = target.x + target.w/2; let ty = target.y + target.h/2;
                        targetAngle = Math.atan2(ty - py, tx - px);
                        if (this.cooldown <= 0) this.shootAt(tx, ty, targetAngle);
                    } else {
                        targetAngle = 0; 
                        if (this.cooldown <= 0) this.shootAt(px + 200, py, targetAngle);
                    }
                }
                this.gunAngle = lerpAngle(this.gunAngle, targetAngle, 0.25);
            }

            doJump() {
                if (this.isGrounded || this.jumpCount === 0) {
                    this.vy = this.jumpPower; this.isGrounded = false; this.jumpCount = 1;
                    Game.spawnParticles(this.x + this.w/2, this.y + this.h, ['#e2e8f0', '#cbd5e1'], 8, 3);
                } else if (this.jumpCount === 1) { 
                    this.vy = this.jumpPower * 0.85; this.jumpCount = 2; this.rollAngle = 0; 
                    Game.spawnParticles(this.x + this.w/2, this.y + this.h, ['#60a5fa', '#38bdf8'], 12, 4);
                } else if (this.jumpCount === 2 && !this.isDashing) {
                    // AIR DASH
                    this.isDashing = true; this.dashTimer = 15; this.jumpCount = 3;
                    this.invuln = 20; // I-frames during dash
                    Game.spawnParticles(this.x, this.y + this.h/2, ['#a855f7', '#d8b4fe'], 20, 5);
                    Game.shake = 5;
                }
            }

            takeDamage() {
                this.lives--; this.invuln = 150; this.weapon = 'N'; 
                Game.shake = 25; Game.flashDamage = 4;
                Game.spawnParticles(this.x + 15, this.y + 20, COLORS.blood, 30, 5, true);
                Game.spawnDamage(this.x + 15, this.y - 10, "-1 TIM!", true, '#ef4444');

                if (this.lives <= 0) {
                    Game.state = 'GAMEOVER';
                    document.getElementById('game-over-menu').classList.add('show');
                    document.getElementById('final-score').innerText = Game.score;
                    document.getElementById('btn-ult').classList.remove('ready');
                }
            }

            shootAt(tx, ty, angleCalculated) {
                let px = this.x + this.w; let py = this.y + 15;
                let isCrit = Math.random() < 0.2; 
                let mulDmg = (isCrit ? 2.5 : 1) * Game.damageMultiplier; 
                let critColor = isCrit ? '#ef4444' : null;
                
                let speed = 20;
                let vx = Math.cos(angleCalculated) * speed; 
                let vy = Math.sin(angleCalculated) * speed;

                this.muzzleFlash = 3;

                if (this.weapon === 'M') { 
                    this.cooldown = 5;
                    let spreadY = vy + (Math.random()*3-1.5);
                    Game.bullets.push(new Bullet(px, py, vx, spreadY, 1 * mulDmg, isCrit?22:16, isCrit?8:4, critColor||'#4ade80', true));
                } else if (this.weapon === 'S') { 
                    this.cooldown = 15;
                    for(let i = -1; i <= 1; i++) {
                        let ang = angleCalculated + (i * 0.25);
                        Game.bullets.push(new Bullet(px, py, Math.cos(ang)*16, Math.sin(ang)*16, 1 * mulDmg, 14, isCrit?16:10, critColor||'#f97316', true));
                    }
                } else if (this.weapon === 'L') { 
                    this.cooldown = 20;
                    Game.bullets.push(new Bullet(px, py, vx*1.5, vy*1.5, 2 * mulDmg, 55, isCrit?14:8, critColor||'#22d3ee', true, true));
                } else if (this.weapon === 'F') { 
                    this.cooldown = 12;
                    let sz = isCrit ? 24 : 18;
                    Game.bullets.push(new Bullet(px, py, vx * 0.8, vy * 0.8, 2 * mulDmg, sz, sz, critColor||'#facc15', true, false, true));
                } else { 
                    this.cooldown = 10;
                    Game.bullets.push(new Bullet(px, py, vx, vy, 1 * mulDmg, isCrit?20:14, isCrit?6:4, critColor||COLORS.bulletPlayer, true));
                }
                
                Game.particles.push({
                    x: px - 10, y: py, vx: -2 - Math.random()*2, vy: -3 - Math.random()*2,
                    life: 1.0, color: '#fbbf24', size: 3, hasGravity: true
                });
            }

            drawBody(ctx, px, py, isGhost = false, ghostLife = 1) {
                ctx.save();
                if (isGhost) ctx.globalAlpha = ghostLife * 0.5;
                ctx.translate(px, py);
                
                let walkOffset = 0;
                let bodyBreath = (this.isGrounded && Game.state === 'PLAY') ? 0 : Math.sin(Game.frameCount * 0.15) * 1.5;
                if (Game.state === 'CUTSCENE' && Game.csPhase === 0) walkOffset = Math.sin(Game.frameCount * 0.8) * 8;
                else if (this.isGrounded && (Game.state === 'PLAY' || Game.state === 'WIN_CUTSCENE')) walkOffset = Math.sin(Game.frameCount * 0.8) * 8;
                if (this.isDashing) { walkOffset = 8; bodyBreath = 5; } // Action pose

                ctx.fillStyle = isGhost ? '#a855f7' : COLORS.playerPants; 
                ctx.fillRect(4 + walkOffset, 30, 8, 15); ctx.fillRect(18 - walkOffset, 30, 8, 15);
                
                ctx.translate(0, bodyBreath);
                ctx.fillStyle = isGhost ? '#d8b4fe' : COLORS.playerShirt; ctx.fillRect(5, 15, 20, 18);
                ctx.fillStyle = isGhost ? '#f3e8ff' : COLORS.playerSkin; ctx.beginPath(); ctx.arc(15, 8, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = isGhost ? '#7e22ce' : '#b91c1c'; ctx.fillRect(3, 2, 24, 4); 
                ctx.beginPath(); ctx.moveTo(3, 4); ctx.lineTo(-8, 2 + Math.sin(Game.frameCount*0.3)*4); ctx.lineTo(-5, 6); ctx.fill();
                ctx.fillStyle = isGhost ? '#000' : '#000'; ctx.fillRect(18, 5, 4, 4); 
                
                ctx.save();
                ctx.translate(15, 21);
                if (this.isDashing) ctx.rotate(Math.PI/8); else ctx.rotate(this.gunAngle);
                let recoil = this.cooldown > Math.max(0, this.cooldown - 5) ? -4 : 0;
                
                ctx.fillStyle = isGhost ? '#6b21a8' : '#1e293b'; ctx.fillRect(recoil, -4, 24, 8);
                ctx.fillStyle = isGhost ? '#9333ea' : '#64748b'; ctx.fillRect(recoil, -4, 20, 3);
                
                if (this.muzzleFlash > 0 && !isGhost) {
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(recoil + 28, 0, 8 + Math.random()*6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(recoil + 28, 0, 4, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
                ctx.restore();
            }

            draw(ctx) {
                if (this.invuln > 0 && this.invuln <= 120 && Game.frameCount % 8 < 4 && !this.isDashing) return;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                if (this.isGrounded) {
                    ctx.beginPath(); ctx.ellipse(this.x + this.w/2, this.y + this.h, 12, 4, 0, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.ellipse(this.x + this.w/2, GROUND_Y, 15 - Math.min(10, (GROUND_Y - this.y)*0.1), 4, 0, 0, Math.PI*2); ctx.fill();
                }

                // Shield
                if (this.invuln > 120) {
                    ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h/2);
                    ctx.beginPath(); ctx.arc(0, 0, 35 + Math.sin(Game.frameCount*0.2)*4, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.3)'; ctx.fill();
                    ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                    ctx.rotate(Game.frameCount * 0.05); ctx.stroke();
                    ctx.restore();
                }

                // Ghost Trail
                this.ghosts.forEach(g => { this.drawBody(ctx, g.x, g.y, true, g.life/10); });

                ctx.save();
                if (this.jumpCount === 2 && !this.isDashing) {
                    this.rollAngle += 0.5;
                    ctx.translate(this.x + this.w/2, this.y + this.h/2);
                    ctx.rotate(this.rollAngle);
                    ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));
                }
                this.drawBody(ctx, this.x, this.y);
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, damage, w, h, color, isPlayer, isPiercing = false, hasGravity = false, ignoreRotation = false) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.damage = damage; this.w = w; this.h = h;
                this.color = color; this.isPlayer = isPlayer;
                this.isPiercing = isPiercing; this.hasGravity = hasGravity;
                this.ignoreRotation = ignoreRotation;
                this.bounces = 0; this.active = true;
                this.angle = Math.atan2(vy, vx);
                if(this.isPiercing) this.hitTargets = new Set();
            }
            update() {
                if (this.hasGravity) { this.vy += 0.5; this.angle = Math.atan2(this.vy, this.vx); }
                this.x += this.vx; this.y += this.vy;
                
                if (this.hasGravity && this.y > GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h; this.vy = -6; this.bounces++;
                    if (this.bounces > 2) this.active = false;
                }
                if (this.x < -100 || this.x > GW + 100 || this.y < -100 || this.y > GH + 100) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                if (!this.ignoreRotation) ctx.rotate(this.angle);

                ctx.fillStyle = this.color;
                if (this.hasGravity) {
                    ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(-2, 0, this.w/2 + 4, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0; ctx.beginPath(); ctx.arc(0, 0, this.w/2, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(2, 0, this.w/4, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.globalAlpha = 0.4; ctx.fillRect(-this.w/2 - 4, -this.h/2 - 2, this.w + 8, this.h + 4);
                    ctx.globalAlpha = 1.0; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                    ctx.fillStyle = '#fff'; ctx.fillRect(-this.w/4, -this.h/4, this.w/2, this.h/2);
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type, dir = 1) {
                this.type = type; this.active = true; this.dir = dir; 
                this.x = dir === 1 ? GW + 20 : -40; this.flash = 0;
                
                if (type === 'soldier') {
                    this.y = GROUND_Y - 30; this.w = 20; this.h = 30; this.hp = 2; this.score = 5; 
                    this.vx = (-2.5 - Math.random()) * dir; this.shootTimer = Math.floor(Math.random() * 60 + 40);
                } else if (type === 'plane') {
                    this.y = Math.random() * 80 + 250; this.w = 45; this.h = 25; this.hp = 3; this.score = 10; 
                    this.vx = (-3.5 - Math.random()*2.5) * dir; this.baseY = this.y;
                } else if (type === 'drone') {
                    this.y = Math.random() * 50 + 130; this.w = 30; this.h = 20; this.hp = 4; this.score = 15;
                    this.vx = (-2.5 - Math.random()) * dir; this.shootTimer = Math.floor(Math.random() * 50 + 40);
                }
            }
            update() {
                this.x += this.vx;
                if (this.type === 'plane') { this.y = this.baseY + Math.sin(Game.frameCount * 0.08) * 20; } 
                else if (this.type === 'soldier') {
                    this.shootTimer--;
                    if (this.shootTimer <= 0) {
                        let px = this.dir === 1 ? this.x - 10 : this.x + this.w;
                        Game.bullets.push(new Bullet(px, this.y + 10, -6 * this.dir, 0, 1, 12, 4, '#f59e0b', false));
                        this.shootTimer = Math.floor(Math.random() * 60 + 60); 
                    }
                } else if (this.type === 'drone') {
                    this.shootTimer--;
                    if (this.shootTimer <= 0) {
                        Game.bullets.push(new Bullet(this.x + this.w/2, this.y + this.h, 0, 3, 1, 14, 14, '#ef4444', false, false, true));
                        this.shootTimer = Math.floor(Math.random() * 80 + 60);
                    }
                }
                if (this.dir === 1 && this.x < -100) this.active = false;
                if (this.dir === -1 && this.x > GW + 100) this.active = false;
                if (this.flash > 0) this.flash--;
            }
            draw(ctx) {
                ctx.save(); 
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                if(this.type === 'soldier') { ctx.beginPath(); ctx.ellipse(this.x + this.w/2, GROUND_Y, 12, 3, 0, 0, Math.PI*2); ctx.fill(); } 
                else { ctx.beginPath(); ctx.ellipse(this.x + this.w/2, GROUND_Y, 20, 5, 0, 0, Math.PI*2); ctx.fill(); }

                if (this.dir === -1) { ctx.translate(this.x + this.w, this.y); ctx.scale(-1, 1); } else { ctx.translate(this.x, this.y); }
                if (this.flash > 0) ctx.filter = "brightness(500%) drop-shadow(0 0 4px white)";

                if (this.type === 'soldier') {
                    let walk = Math.sin(Game.frameCount * 0.6) * 4;
                    ctx.fillStyle = '#65a30d'; ctx.fillRect(0, 10, 20, 20); 
                    ctx.fillStyle = '#4d7c0f'; ctx.fillRect(4 + walk, 20, 6, 10); ctx.fillRect(14 - walk, 20, 6, 10); 
                    ctx.fillStyle = '#fcd34d'; ctx.fillRect(4, 0, 12, 12); 
                    ctx.fillStyle = '#000'; ctx.fillRect(2, 4, 4, 3); 
                } else if (this.type === 'plane') {
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.ellipse(22, 12, 22, 12, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(5, 5, 15, 8); 
                    let rH = (Game.frameCount % 4 < 2) ? 28 : 8; let rY = (Game.frameCount % 4 < 2) ? -2 : 8;
                    ctx.fillStyle = '#334155'; ctx.fillRect(32, rY, 6, rH); 
                } else if (this.type === 'drone') {
                    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(30, 10); ctx.lineTo(15, 20); ctx.lineTo(0, 10); ctx.fill();
                    ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(15, 10, 6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(15, 10, 3, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    let rw = (Game.frameCount % 2 === 0) ? 35 : 10; ctx.fillRect(15 - rw/2, -5, rw, 3);
                }
                ctx.restore();
            }
        }

        class Boss {
            constructor(type) {
                this.type = type; this.active = true;
                this.x = GW + 100; this.state = 'enter'; this.timer = 0; this.flash = 0;
                
                if (type === 'ufo') {
                    this.w = 100; this.h = 50; this.y = 150; this.baseY = 150;
                    this.hp = 200; this.maxHp = 200; this.score = 80;
                } else if (type === 'tank') {
                    this.w = 140; this.h = 110; this.y = GROUND_Y - this.h;
                    this.hp = 400; this.maxHp = 400; this.score = 150;
                } else if (type === 'heli') {
                    this.w = 110; this.h = 65; this.y = 250; this.baseY = 250;
                    this.hp = 600; this.maxHp = 600; this.score = 250;
                } else if (type === 'mecha') {
                    this.w = 90; this.h = 120; this.y = GROUND_Y - this.h;
                    this.hp = 800; this.maxHp = 800; this.score = 350; this.vy = 0;
                } else if (type === 'worm') {
                    this.w = 120; this.h = 100; this.y = GROUND_Y + 100; this.baseY = GROUND_Y - 40;
                    this.hp = 1200; this.maxHp = 1200; this.score = 500;
                } else if (type === 'dragon') {
                    this.w = 110; this.h = 110; this.y = 240; this.baseY = 240;
                    this.hp = 1800; this.maxHp = 1800; this.score = 700;
                } else if (type === 'demon') {
                    this.w = 80; this.h = 120; this.y = 200; this.baseY = 200;
                    this.hp = 3000; this.maxHp = 3000; this.score = 1500; this.spiralAngle = 0;
                }
            }
            update() {
                this.timer++;
                if (this.flash > 0) this.flash--;

                if (this.state === 'enter') {
                    if (this.type === 'worm') {
                        this.x = GW - this.w - 20; this.y -= 2;
                        if (this.y <= this.baseY) this.state = 'attack';
                    } else {
                        this.x -= 1.5; if (this.x <= GW - this.w - 10) this.state = 'attack';
                    }
                } 
                else if (this.type === 'ufo') {
                    if (this.state === 'attack') {
                        this.y = this.baseY + Math.sin(this.timer * 0.05) * 40;
                        this.x += (Game.player.x + 100 - this.x) * 0.03; 
                        if (this.timer % 180 === 0) { this.state = 'laser_charge'; this.laserTimer = 40; } 
                        else if (this.timer % 60 === 0) {
                            for(let i=-1; i<=1; i+=2) Game.bullets.push(new Bullet(this.x + this.w/2, this.y + this.h, i*2, 7, 1, 10, 10, '#22d3ee', false));
                        }
                    } else if (this.state === 'laser_charge') {
                        this.laserTimer--; this.x += (Game.player.x + 20 - this.x) * 0.08; 
                        this.y = this.baseY + Math.sin(this.timer * 0.05) * 40;
                        if (this.laserTimer <= 0) {
                            this.state = 'laser_fire'; this.laserTimer = 30; Game.shake = 15;
                            Game.bullets.push(new Bullet(this.x + this.w/2 - 20, this.y + this.h, 0, 15, 2, 40, 300, '#ef4444', false, true, false, true));
                        }
                    } else if (this.state === 'laser_fire') {
                        this.laserTimer--; this.y = this.baseY + Math.sin(this.timer * 0.05) * 40;
                        if (this.laserTimer <= 0) this.state = 'attack';
                    }
                } 
                else if (this.type === 'tank') {
                    if (this.timer % 200 === 0) { this.state = 'dash'; this.dashTimer = 40; }
                    if (this.state === 'dash') {
                        this.x -= 5; this.dashTimer--; if (this.dashTimer <= 0) this.state = 'retreat';
                    } else if (this.state === 'retreat') {
                        if (this.x < GW - this.w - 10) this.x += 2; else this.state = 'attack';
                    } else {
                        if (this.timer % 90 === 75) Game.spawnParticles(this.x - 20, this.y + 35, '#f59e0b', 10, 2);
                        if (this.timer % 90 === 0) { Game.bullets.push(new Bullet(this.x - 20, this.y + 25, -7, -6, 1, 20, 20, '#ef4444', false, false, true)); Game.shake = 8; }
                        if (this.timer % 120 > 80 && this.timer % 6 === 0) Game.bullets.push(new Bullet(this.x - 10, this.y + 85, -10, (Math.random()-0.5)*3, 1, 14, 4, '#f59e0b', false));
                    }
                } 
                else if (this.type === 'heli') {
                    this.y = this.baseY + Math.sin(this.timer * 0.05) * 50; 
                    if (this.timer % 200 === 0) {
                        Game.enemies.push(new Enemy('drone', 1)); Game.enemies[Game.enemies.length-1].x = this.x; Game.enemies[Game.enemies.length-1].y = this.y + this.h;
                    }
                    if (this.timer % 120 === 0) { 
                        let dx = (Game.player.x + Game.player.w/2) - this.x; let dy = (Game.player.y + Game.player.h/2) - (this.y + this.h);
                        let dist = Math.hypot(dx, dy) || 1;
                        Game.bullets.push(new Bullet(this.x, this.y + this.h, (dx/dist)*8, (dy/dist)*8, 1, 18, 10, '#ef4444', false));
                    }
                    if (this.timer % 200 > 120 && this.timer % 8 === 0) {
                        Game.bullets.push(new Bullet(this.x + 20, this.y + this.h, -4 - Math.random()*3, 6, 1, 10, 10, '#22d3ee', false));
                    }
                } 
                else if (this.type === 'mecha') {
                    if (this.timer % 180 === 0) { this.vy = -14; this.state = 'jump'; }
                    if (this.state === 'jump') {
                        this.y += this.vy; if (this.y < GROUND_Y - this.h || this.vy < 0) this.vy += 0.5;
                        if (this.x > Game.player.x + 50 && this.vy < 0) this.x -= 2;
                        if (this.y >= GROUND_Y - this.h && this.vy > 0) { 
                            this.y = GROUND_Y - this.h; this.vy = 0; Game.shake = 15; this.state = 'attack';
                            for(let i=0; i<3; i++) Game.bullets.push(new Bullet(this.x, this.y + this.h - 10, -8 + i*2, -2 - i*2, 1, 14, 14, '#f59e0b', false, false, true));
                        }
                    } else {
                        if (this.x < GW - this.w - 10) this.x += 1;
                        if (this.timer % 100 === 0) Game.bullets.push(new Bullet(this.x, this.y + 30, -10, 0, 1, 30, 12, '#ef4444', false));
                    }
                } 
                else if (this.type === 'worm') {
                    this.y = this.baseY + Math.sin(this.timer * 0.05) * 30;
                    if (this.timer % 200 === 0) { this.state = 'burrow'; this.burrowTimer = 60; }

                    if (this.state === 'burrow') {
                        this.y += 5; this.burrowTimer--;
                        if (this.burrowTimer <= 0) { 
                            this.x = Game.player.x + 100; if(this.x > GW - this.w) this.x = GW - this.w;
                            this.state = 'emerge'; Game.shake = 10;
                            Game.spawnParticles(this.x + 50, GROUND_Y, '#78350f', 30, 6, true);
                        }
                    } else if (this.state === 'emerge') {
                        this.y -= 8; if (this.y <= this.baseY) this.state = 'attack';
                    } else {
                        if (this.timer % 80 === 0) {
                            for(let i=0; i<4; i++) {
                                Game.bullets.push(new Bullet(this.x + 30, this.y + 20, -5 - Math.random()*5, -6 - Math.random()*4, 1, 18, 18, '#84cc16', false, false, true));
                            }
                        }
                    }
                }
                else if (this.type === 'dragon') {
                    if (this.state === 'dash') {
                        this.x -= 18;
                        if (this.x < -this.w - 50) { this.x = GW + 50; this.state = 'attack'; this.y = this.baseY; }
                    } else {
                        this.y = this.baseY + Math.sin(this.timer * 0.04) * 80; 
                        if (this.timer % 300 === 0) { this.state = 'dash'; Game.spawnDamage(GW/2, GH/2, "RỒNG CUỒNG NỘ!", true); } 
                        else {
                            if (this.timer % 140 > 90 && this.timer % 4 === 0) {
                                 Game.bullets.push(new Bullet(this.x, this.y + 40, -10 - Math.random()*5, Math.random()*6 - 3, 1, 18, 18, '#ef4444', false));
                                 Game.spawnParticles(this.x, this.y+40, ['#f97316', '#ef4444'], 4, 4);
                            } 
                            if (this.timer % 90 === 0) { 
                                let dx = Game.player.x - this.x; let dy = Game.player.y - (this.y + 40);
                                let dist = Math.hypot(dx, dy) || 1;
                                for(let i=-1; i<=1; i++) Game.bullets.push(new Bullet(this.x, this.y + 40, (dx/dist)*9, (dy/dist)*9 + i*3, 1, 16, 16, '#facc15', false));
                            }
                        }
                    }
                }
                else if (this.type === 'demon') {
                    this.y = this.baseY + Math.sin(this.timer * 0.03) * 60;
                    
                    if (this.timer % 300 === 0) {
                        this.state = 'teleport';
                        Game.spawnParticles(this.x + 40, this.y + 60, '#9333ea', 50, 5);
                    }

                    if (this.state === 'teleport') {
                        this.x = Game.player.x + 150 + Math.random()*100;
                        if (this.x > GW - this.w) this.x = GW - this.w;
                        this.y = 100 + Math.random() * 150;
                        this.state = 'spiral'; this.spiralTimer = 100;
                        Game.spawnParticles(this.x + 40, this.y + 60, '#9333ea', 50, 5);
                    } else if (this.state === 'spiral') {
                        this.spiralTimer--;
                        this.spiralAngle += 0.4;
                        if (this.spiralTimer % 3 === 0) {
                            Game.bullets.push(new Bullet(this.x + 40, this.y + 60, Math.cos(this.spiralAngle)*6, Math.sin(this.spiralAngle)*6, 1, 15, 15, '#c084fc', false));
                            Game.bullets.push(new Bullet(this.x + 40, this.y + 60, Math.cos(this.spiralAngle + Math.PI)*6, Math.sin(this.spiralAngle + Math.PI)*6, 1, 15, 15, '#c084fc', false));
                        }
                        if (this.spiralTimer <= 0) this.state = 'attack';
                    } else {
                        // Normal attack
                        if (this.timer % 120 === 0) {
                            let dx = Game.player.x - this.x; let dy = Game.player.y - (this.y + 60);
                            let dist = Math.hypot(dx, dy) || 1;
                            Game.bullets.push(new Bullet(this.x + 40, this.y + 60, (dx/dist)*12, (dy/dist)*12, 1, 25, 25, '#ef4444', false));
                        }
                        if (this.timer % 200 === 0) {
                            Game.enemies.push(new Enemy('plane', 1)); Game.enemies[Game.enemies.length-1].x = this.x; Game.enemies[Game.enemies.length-1].y = this.y;
                        }
                    }
                }
            }
            draw(ctx) {
                ctx.save(); 
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); ctx.ellipse(this.x + this.w/2, GROUND_Y, this.w/2 - 10, 8, 0, 0, Math.PI*2); ctx.fill();

                ctx.translate(this.x, this.y);
                if (this.flash > 0) ctx.filter = "brightness(500%) drop-shadow(0 0 5px white)";

                if (this.type === 'ufo') {
                    if (this.state === 'laser_charge') {
                        ctx.strokeStyle = 'rgba(239, 68, 68, ' + (Math.sin(Game.frameCount * 0.5) * 0.5 + 0.5) + ')';
                        ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(this.w/2, this.h); ctx.lineTo(this.w/2, GROUND_Y - this.y); ctx.stroke();
                    }
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2 - 10, this.w/3, this.h/4, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = (Game.frameCount % 20 < 10) ? '#ef4444' : '#facc15';
                    ctx.beginPath(); ctx.arc(15, this.h/2, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(this.w - 15, this.h/2, 6, 0, Math.PI*2); ctx.fill();
                } else if (this.type === 'tank') {
                    ctx.fillStyle = '#334155'; ctx.fillRect(0, 50, this.w, 60); 
                    ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.arc(this.w/2, 50, 50, Math.PI, 0); ctx.fill(); 
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(-35, 25, 75, 15); ctx.fillStyle = '#1e293b'; ctx.fillRect(-15, 80, 25, 8); 
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 100, this.w, 10);
                    for(let i=10; i<this.w; i+=25) { ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(i, 105, 8, 0, Math.PI*2); ctx.fill(); }
                } else if (this.type === 'heli') {
                    ctx.fillStyle = '#0f766e'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-25, this.h/2 - 5, 25, 10); ctx.fillStyle = '#94a3b8'; ctx.fillRect(this.w/2 - 5, -12, 10, 12); 
                    ctx.fillStyle = 'rgba(255,255,255,0.6)'; let rot = (Game.frameCount % 2 === 0) ? 50 : 20; ctx.fillRect(this.w/2 - rot, -12, rot*2, 3); 
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(this.w/4, this.h/2, 15, 0, Math.PI*2); ctx.fill(); 
                } else if (this.type === 'mecha') {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(20, 30, 50, 60); ctx.fillStyle = '#cbd5e1'; ctx.fillRect(30, 10, 30, 20); 
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(35, 15, 20, 5); ctx.fillStyle = '#475569'; ctx.fillRect(0, 40, 20, 20); ctx.fillRect(70, 40, 20, 20); 
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(20, 90, 15, 30); ctx.fillRect(55, 90, 15, 30); 
                } else if (this.type === 'worm') {
                    ctx.fillStyle = '#14532d';
                    for(let i=0; i<4; i++) { ctx.beginPath(); ctx.ellipse(this.w/2, 20 + i*25, 40 + i*5, 20, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
                    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(40, 20, 8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(80, 20, 8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(40, 20, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(80, 20, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(this.w/2, 40, 15, 0, Math.PI, false); ctx.fill();
                } else if (this.type === 'dragon') {
                    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2 + 20, this.w/2, this.h/2-20, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(20, 30, 35, 0, Math.PI*2); ctx.fill(); 
                    let wingY = Math.sin(Game.frameCount * 0.4) * 30;
                    ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.moveTo(this.w/2 + 10, this.h/2 - 10); ctx.lineTo(this.w + 30, -30 + wingY); ctx.lineTo(this.w + 50, this.h/2 + wingY/2); ctx.fill(); 
                    ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 6, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                } else if (this.type === 'demon') {
                    // Cloak
                    ctx.fillStyle = '#4c1d95'; ctx.beginPath(); ctx.moveTo(this.w/2, 20); ctx.lineTo(0, this.h); ctx.lineTo(this.w, this.h); ctx.fill();
                    // Aura
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.4)'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2, 50 + Math.sin(Game.frameCount*0.2)*10, 60, 0, 0, Math.PI*2); ctx.fill();
                    // Head
                    ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.arc(this.w/2, 25, 20, 0, Math.PI*2); ctx.fill();
                    // Horns
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(this.w/2 - 10, 10); ctx.lineTo(this.w/2 - 25, -15); ctx.lineTo(this.w/2, 5); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(this.w/2 + 10, 10); ctx.lineTo(this.w/2 + 25, -15); ctx.lineTo(this.w/2, 5); ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
                    ctx.beginPath(); ctx.ellipse(this.w/2 - 8, 25, 6, 3, Math.PI/6, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(this.w/2 + 8, 25, 6, 3, -Math.PI/6, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
                
                if (this.state !== 'enter') {
                    let hpRatio = Math.max(0, this.hp/this.maxHp);
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, -30, this.w, 14);
                    let hpGrad = ctx.createLinearGradient(0, -30, this.w, -16);
                    if(hpRatio > 0.5) { hpGrad.addColorStop(0, '#22c55e'); hpGrad.addColorStop(1, '#15803d'); }
                    else if(hpRatio > 0.25) { hpGrad.addColorStop(0, '#eab308'); hpGrad.addColorStop(1, '#a16207'); }
                    else { hpGrad.addColorStop(0, '#ef4444'); hpGrad.addColorStop(1, '#991b1b'); }
                    ctx.fillStyle = hpGrad; ctx.fillRect(2, -28, (this.w - 4) * hpRatio, 10);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(0, -30, this.w, 14);
                }
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.w = 32; this.h = 32;
                this.type = type; this.active = true; this.vy = -6; this.floatY = 0;
            }
            update() {
                this.x -= 2.2; 
                if (this.y < GROUND_Y - 40) { this.vy += 0.4; this.y += this.vy; if (this.y > GROUND_Y - 40) { this.y = GROUND_Y - 40; this.vy = -5; } } 
                else { this.floatY = Math.sin(Game.frameCount * 0.1) * 5; }
                if (this.x < -50) this.active = false;
            }
            draw(ctx) {
                let dy = this.y + this.floatY;
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(this.x + this.w/2, GROUND_Y, 15, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(250, 204, 21, 0.4)'; ctx.fillRect(this.x - 6, dy - 6, this.w + 12, this.h + 12);
                ctx.fillStyle = '#b45309'; ctx.fillRect(this.x, dy, this.w, this.h);
                ctx.fillStyle = '#78350f'; ctx.fillRect(this.x, dy, this.w, 4); ctx.fillRect(this.x, dy + this.h - 4, this.w, 4);
                ctx.fillRect(this.x, dy, 4, this.h); ctx.fillRect(this.x + this.w - 4, dy, 4, this.h);
                ctx.fillStyle = '#000'; ctx.font = 'bold 24px "Pixelify Sans"'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
                ctx.fillText(this.type, this.x + this.w/2 + 2, dy + 27);
                ctx.fillStyle = '#fef08a'; ctx.fillText(this.type, this.x + this.w/2, dy + 25);
            }
        }

        // --- MAIN GAME ENGINE ---
        const Game = {
            state: 'CUTSCENE',
            frameCount: 0, score: 0, bgScroll: 0, shake: 0, flashDamage: 0, flashUlt: 0,
            
            player: null, pet: null, merchant: null, merchantWalkAway: false, shopOpened: false,
            bullets: [], enemies: [], items: [], particles: [], texts: [], platforms: [], traps: [],
            birds: [], raindrops: [], floatingTexts: [], coinsArr: [], meteors: [],
            weather: 'clear', isTransitioning: false,
            coins: 0, damageMultiplier: 1, energy: 0, maxEnergy: 100,
            
            currentBoss: null,
            bossStages: [
                { score: 50, type: 'ufo', done: false },
                { score: 150, type: 'tank', done: false },
                { score: 400, type: 'heli', done: false },
                { score: 800, type: 'mecha', done: false },
                { score: 1200, type: 'worm', done: false },
                { score: 1800, type: 'dragon', done: false },
                { score: 2500, type: 'demon', done: false }
            ],

            csPhase: 0, csTimer: 0, csGirlX: 0, csGirlY: 0, csDragonX: 0, csDragonY: 0,

            init() { 
                this.coins = 0; this.damageMultiplier = 1; this.coinsArr = [];
                this.startCutscene();
                requestAnimationFrame(() => this.loop()); 
            },

            addEnergy(amount) {
                if (this.energy >= this.maxEnergy) return;
                this.energy = Math.min(this.maxEnergy, this.energy + amount);
                let btn = document.getElementById('btn-ult');
                if (this.energy === this.maxEnergy && !btn.classList.contains('ready')) {
                    btn.classList.add('ready');
                    this.spawnDamage(this.player.x, this.player.y - 30, "NỘ ĐÃ SẴN SÀNG!", true, '#fef08a');
                }
            },

            activateUltimate() {
                if (this.energy < this.maxEnergy || this.state !== 'PLAY') return;
                this.energy = 0;
                document.getElementById('btn-ult').classList.remove('ready');
                
                this.flashUlt = 20; this.shake = 50;
                this.spawnDamage(GW/2, GH/2, "BẠO KÍCH TOÀN BẢN ĐỒ!!", true, '#38bdf8');
                
                // Clear all enemy bullets
                this.bullets = this.bullets.filter(b => b.isPlayer);
                
                // Damage all enemies
                this.enemies.forEach(e => {
                    e.hp -= 50; e.flash = 10;
                    this.spawnParticles(e.x + e.w/2, e.y + e.h/2, '#38bdf8', 20, 4);
                });
                if (this.currentBoss) {
                    this.currentBoss.hp -= 200; this.currentBoss.flash = 10;
                    this.spawnParticles(this.currentBoss.x + this.currentBoss.w/2, this.currentBoss.y + this.currentBoss.h/2, '#38bdf8', 50, 6);
                    this.spawnDamage(this.currentBoss.x, this.currentBoss.y, "-200 CRIT!", true, '#38bdf8');
                }
                
                this.player.invuln = 120; // 2 sec i-frames
            },

            findNearestTarget(fromX, fromY) {
                let target = null; let minDist = 450; 
                if (this.currentBoss && this.currentBoss.state !== 'enter' && this.currentBoss.state !== 'burrow') {
                    let d = Math.hypot((this.currentBoss.x + this.currentBoss.w/2) - fromX, (this.currentBoss.y + this.currentBoss.h/2) - fromY);
                    if (d < minDist) { minDist = d; target = this.currentBoss; }
                }
                for (let e of this.enemies) {
                    if (e.x > 0 && e.x < GW + 50) { 
                        let d = Math.hypot((e.x + e.w/2) - fromX, (e.y + e.h/2) - fromY);
                        if (d < minDist) { minDist = d; target = e; }
                    }
                }
                for (let b of this.birds) {
                    if (b.x > 0 && b.x < GW + 50) {
                        let d = Math.hypot((b.x + b.w/2) - fromX, (b.y + b.h/2) - fromY);
                        if (d < minDist) { minDist = d; target = b; }
                    }
                }
                for (let it of this.items) {
                    if (it.x > 0 && it.x < GW + 50) {
                        let d = Math.hypot((it.x + it.w/2) - fromX, (it.y + it.h/2) - fromY);
                        if (d < minDist) { minDist = d; target = it; }
                    }
                }
                return target;
            },

            startCutscene() {
                document.getElementById('hint').style.display = 'none';
                this.state = 'CUTSCENE'; this.csPhase = 0; this.csTimer = 0;
                this.player = new Player(); this.player.x = -50; 
                this.csGirlX = GW/2 + 30; this.csGirlY = GROUND_Y - 45; 
                this.csDragonX = GW + 50; this.csDragonY = -150; 
                this.texts = []; this.items = []; this.platforms = []; this.traps = [];
                this.birds = []; this.raindrops = []; this.floatingTexts = []; this.meteors = [];
                this.weather = 'clear'; this.isTransitioning = false;
            },

            startGame() {
                document.getElementById('hint').style.display = 'block';
                this.state = 'PLAY'; this.score = 0; this.frameCount = 0; this.energy = 0;
                this.bullets = []; this.enemies = []; this.particles = []; this.texts = []; 
                this.platforms = []; this.traps = []; this.meteors = [];
                this.birds = []; this.raindrops = []; this.floatingTexts = []; this.weather = 'clear';
                this.items = []; this.coinsArr = []; this.isTransitioning = false; this.merchant = null;
                
                this.currentBoss = null; this.bossStages.forEach(b => b.done = false);
                this.player = new Player(); this.pet = new Pet(this.player); 
                document.getElementById('btn-ult').classList.remove('ready');

                this.spawnDamage(GW/2, GH/2 + 50, "CHẠM ĐỂ NÉ!", true, '#4ade80');
                setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 6000);
            },

            resetGame() {
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
                this.startGame();
            },

            buyUpgrade(type) {
                if (type === 'hp' && this.coins >= 50) {
                    this.coins -= 50; this.player.lives++;
                    this.spawnDamage(this.player.x + 15, this.player.y - 20, "+1 TIM", true, '#4ade80'); 
                } else if (type === 'dmg' && this.coins >= 100) {
                    this.coins -= 100; this.damageMultiplier += 0.5;
                    this.spawnDamage(this.player.x + 15, this.player.y - 20, "SỨC MẠNH LÊN!", true, '#facc15');
                } else {
                    let el = document.getElementById('shop-coins');
                    el.style.color = 'red'; setTimeout(() => el.style.color = '#facc15', 300);
                }
                document.getElementById('shop-coins').innerText = this.coins;
            },

            openMinigame() {
                if (this.coins >= 20) {
                    this.coins -= 20;
                    document.getElementById('shop-menu').classList.remove('show');
                    document.getElementById('minigame-menu').classList.add('show');
                    let chests = document.querySelectorAll('.chest');
                    chests.forEach(c => { 
                        c.innerText = '🎁'; c.style.pointerEvents = 'auto'; 
                        c.style.fontSize = '45px'; c.style.color = 'white'; 
                    });
                    document.getElementById('shop-coins').innerText = this.coins;
                } else {
                    let el = document.getElementById('shop-coins');
                    el.style.color = 'red'; setTimeout(() => el.style.color = '#facc15', 300);
                }
            },

            openChest(index) {
                let chests = document.querySelectorAll('.chest');
                chests.forEach(c => c.style.pointerEvents = 'none'); 

                let rewards = [
                    { type: 'coin', val: 50, text: '+50💰', color: '#facc15' },
                    { type: 'weapon', val: 'F', text: 'ĐẠN LỬA', color: '#ef4444' },
                    { type: 'nothing', val: 0, text: 'Xịt...', color: '#94a3b8' },
                    { type: 'coin', val: 100, text: '+100💰', color: '#facc15' },
                    { type: 'weapon', val: 'L', text: 'LASER', color: '#22d3ee' }
                ];
                rewards.sort(() => Math.random() - 0.5); 

                let result = rewards[0];
                chests[index].innerText = result.text;
                chests[index].style.color = result.color;
                chests[index].style.fontSize = '22px';

                if (result.type === 'coin') {
                    this.coins += result.val;
                    this.spawnDamage(this.player.x + 15, this.player.y - 20, `+${result.val} COINS`, true, '#facc15');
                } else if (result.type === 'weapon') {
                    this.player.weapon = result.val;
                    this.spawnDamage(this.player.x + 15, this.player.y - 20, "VŨ KHÍ MỚI", true, result.color);
                }
                setTimeout(() => { this.closeMinigame(); }, 1800);
            },

            closeMinigame() {
                document.getElementById('minigame-menu').classList.remove('show');
                document.getElementById('shop-menu').classList.add('show');
                document.getElementById('shop-coins').innerText = this.coins;
            },

            exitShop() {
                document.getElementById('shop-menu').classList.remove('show');
                this.merchantWalkAway = true;
                setTimeout(() => {
                    this.state = 'PLAY'; this.merchantWalkAway = false;
                    this.merchant = null; this.isTransitioning = false;
                    this.traps = []; this.items = []; this.bullets = [];
                }, 1200);
            },

            spawnParticles(x, y, color, count, size, hasGravity = false) {
                let maxP = (window.innerWidth < 600) ? Math.min(count, 15) : count; 
                for(let i=0; i<maxP; i++) {
                    let col = Array.isArray(color) ? color[Math.floor(Math.random()*color.length)] : color;
                    this.particles.push({
                        x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12 - 2,
                        life: 1.0, color: col, size: Math.random() * size + size, hasGravity: hasGravity
                    });
                }
            },

            spawnText(txt, x, y, color, life = 60) { this.texts.push({ txt, x, y, life: life, maxLife: life, color }); },

            spawnDamage(x, y, text, isCrit = false, customColor = null) {
                let color = customColor || (isCrit ? '#ef4444' : '#facc15');
                let size = isCrit ? 26 : 18;
                this.floatingTexts.push(new FloatingText(x, y, text, color, size));
            },

            update() {
                this.frameCount++;
                if (this.shake > 0) { this.shake *= 0.85; if (this.shake < 0.5) this.shake = 0; }
                if (this.flashDamage > 0) this.flashDamage--;
                if (this.flashUlt > 0) this.flashUlt--;

                if (this.weather === 'rain') {
                    if (this.raindrops.length < 100) this.raindrops.push(new RainDrop());
                    this.raindrops.forEach(r => r.update());
                }

                if (this.state === 'CUTSCENE') {
                    this.csTimer++;
                    if (this.csTimer > 300) { this.startGame(); return; } 

                    if (this.csPhase === 0) {
                        this.player.x += 2.5;
                        if (this.player.x >= GW/2 - 50) { this.player.x = GW/2 - 50; this.csPhase = 1; this.csTimer = 0; }
                    } else if (this.csPhase === 1) {
                        if (this.csTimer === 20) this.spawnText("Làm vợ anh nhé!", this.player.x + 15, this.player.y - 20, 'white');
                        if (this.csTimer === 90) this.spawnText("Vâng! ♥", this.csGirlX + 15, this.csGirlY - 20, '#f472b6');
                        if (this.csTimer === 170) { this.csPhase = 2; this.csTimer = 0; }
                    } else if (this.csPhase === 2) {
                        let targetX = this.csGirlX - 40; let targetY = this.csGirlY - 60;
                        let dx = targetX - this.csDragonX; let dy = targetY - this.csDragonY;
                        let dist = Math.hypot(dx, dy);
                        if (dist < 12) {
                            this.csDragonX = targetX; this.csDragonY = targetY; this.shake = 20; 
                            this.spawnParticles(this.csDragonX + 50, GROUND_Y, '#475569', 30, 5); 
                            this.spawnText("CỨU EM!!!", this.csGirlX + 15, this.csGirlY - 30, '#ef4444');
                            this.csPhase = 3; this.csTimer = 0;
                        } else {
                            this.csDragonX += (dx / dist) * 14; this.csDragonY += (dy / dist) * 14;
                        }
                    } else if (this.csPhase === 3) {
                        if (this.csTimer > 25) { 
                            this.csDragonX += 6; this.csDragonY -= 7;
                            this.csGirlX = this.csDragonX + 20; this.csGirlY = this.csDragonY + 60;
                        }
                        if (this.csTimer === 70) this.spawnText("ĐỨNG LẠI TÊN KIA!", this.player.x + 15, this.player.y - 20, 'red');
                        if (this.csDragonY < -150) { this.csPhase = 4; this.csTimer = 0; }
                    } else if (this.csPhase === 4) {
                        if (this.csTimer > 30) this.startGame();
                    }
                    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
                    this.particles = this.particles.filter(p => p.life > 0);
                    this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
                    return; 
                }

                if (this.state === 'WIN_CUTSCENE') {
                    this.csTimer++;
                    this.player.update();
                    if (this.csTimer < 60) {
                        this.csGirlX = this.player.x + 50; this.csGirlY = GROUND_Y - 45 - (60 - this.csTimer)*6;
                    } else if (this.csTimer === 60) {
                        this.csGirlY = GROUND_Y - 45; this.shake = 10;
                        this.spawnText("ANH ƠI!!!", this.csGirlX, this.csGirlY - 20, '#f472b6');
                        this.spawnParticles(this.csGirlX, this.csGirlY + 20, '#f472b6', 20, 4);
                    } else if (this.csTimer > 90 && this.csTimer < 120) {
                        this.player.x += 1; this.csGirlX -= 1;
                    } else if (this.csTimer === 120) {
                        this.spawnText("♥ ♥ ♥", this.player.x + 15, this.player.y - 30, '#ef4444');
                        this.spawnParticles(this.player.x + 15, this.player.y, '#ef4444', 30, 4);
                    } else if (this.csTimer === 200) {
                        this.state = 'WIN';
                        document.getElementById('victory-menu').classList.add('show');
                        document.getElementById('win-score').innerText = this.score;
                    }
                    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; if(p.hasGravity) p.vy += 0.4; });
                    this.particles = this.particles.filter(p => p.life > 0);
                    this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
                    return;
                }

                if (this.state === 'SHOP') {
                    if (!this.merchantWalkAway) {
                        if (this.merchant) this.merchant.update();
                        if (this.merchant && this.merchant.x <= GW - 80 && !this.shopOpened) {
                            this.shopOpened = true;
                            document.getElementById('shop-menu').classList.add('show');
                            document.getElementById('shop-coins').innerText = this.coins;
                        }
                    } else {
                        if (this.merchant) this.merchant.x += 4;
                    }
                    
                    this.player.vy += 0.85; this.player.y += this.player.vy;
                    if (this.player.y >= GROUND_Y - this.player.h) {
                        this.player.y = GROUND_Y - this.player.h; this.player.vy = 0; this.player.isGrounded = true;
                    }
                    this.player.x += (100 - this.player.x) * 0.1;
                    this.player.muzzleFlash = 0; this.player.gunAngle = 0; 
                    if(this.pet) this.pet.update();

                    this.coinsArr.forEach(c => c.update()); this.coinsArr = this.coinsArr.filter(c => c.active);
                    let pRect = { x: this.player.x, y: this.player.y, w: this.player.w, h: this.player.h };
                    for (let c of this.coinsArr) {
                        if (c.active && checkAABB(pRect, {x: c.x - 5, y: c.y - 5, w: 10, h: 10})) {
                            c.active = false; this.coins++; this.addEnergy(1);
                            this.spawnParticles(c.x, c.y, ['#facc15', '#fff'], 4, 2);
                        }
                    }

                    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; if(p.hasGravity) p.vy += 0.4; });
                    this.particles = this.particles.filter(p => p.life > 0);
                    this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
                    this.floatingTexts.forEach(f => f.update()); this.floatingTexts = this.floatingTexts.filter(f => f.life > 0);
                    return;
                }

                if (this.state === 'WIN') return;
                if (this.state !== 'PLAY') return;

                this.bgScroll += 2.8; 

                this.platforms.forEach(p => p.update()); this.platforms = this.platforms.filter(p => p.active);
                this.traps.forEach(t => t.update()); this.traps = this.traps.filter(t => t.active);
                this.player.update();
                if(this.pet) this.pet.update(); 

                if (this.frameCount > 0 && this.frameCount % 1000 === 0 && !this.isTransitioning) this.birds.push(new SupplyBird());
                this.birds.forEach(b => b.update()); this.birds = this.birds.filter(b => b.active);

                if (!this.currentBoss) {
                    if (!this.isTransitioning) {
                        if (this.frameCount % 10 === 0) this.score++; 
                        
                        let nextBoss = this.bossStages.find(b => !b.done && this.score >= b.score);
                        if (nextBoss) {
                            this.currentBoss = new Boss(nextBoss.type);
                            this.spawnDamage(GW/2, GH/2, "CẢNH BÁO BOSS!", true, '#ef4444');
                            this.shake = 25;
                            if (nextBoss.type === 'heli') this.weather = 'rain';
                            if (nextBoss.type === 'dragon' || nextBoss.type === 'demon') this.weather = 'evil';
                        } else {
                            this.weather = 'clear'; this.raindrops = [];
                            
                            // Random Meteors late game
                            if (this.score > 1000 && this.frameCount % 150 === 0 && Math.random() > 0.5) {
                                this.meteors.push(new Meteor());
                            }

                            if (this.frameCount % 120 === 0) {
                                let rnd = Math.random();
                                if (rnd > 0.6) {
                                    let trapW = 40 + Math.random() * 60;
                                    this.traps.push(new Trap(GW + 50, trapW));
                                    if (trapW > 60 || Math.random() > 0.5) {
                                        this.platforms.push(new Platform(GW + 50 + trapW/2 - 40, GROUND_Y - 65 - Math.random() * 20, 80));
                                    }
                                } else if (rnd > 0.2) {
                                    this.platforms.push(new Platform(GW + 50, GROUND_Y - 50 - Math.random() * 60, 90 + Math.random()*50));
                                }
                            }

                            let spawnRate = Math.max(25, 75 - Math.floor(this.score/6));
                            if (this.frameCount % spawnRate === 0) {
                                let typeRnd = Math.random();
                                let type = typeRnd > 0.8 ? 'drone' : (typeRnd > 0.4 ? 'plane' : 'soldier');
                                this.enemies.push(new Enemy(type, Math.random() > 0.65 ? 1 : -1));
                            }
                            if (this.frameCount % 300 === 0 && Math.random() > 0.4) {
