                                let types = ['M', 'S', 'L', 'F'];
                                this.items.push(new Item(GW, -50, types[Math.floor(Math.random()*types.length)]));
                            }
                        }
                    }
                } else {
                    this.currentBoss.update();
                }

                this.bullets.forEach(b => b.update()); this.bullets = this.bullets.filter(b => b.active);
                this.enemies.forEach(e => e.update()); this.enemies = this.enemies.filter(e => e.active);
                this.items.forEach(i => i.update()); this.items = this.items.filter(i => i.active);
                this.floatingTexts.forEach(f => f.update()); this.floatingTexts = this.floatingTexts.filter(f => f.life > 0);
                this.coinsArr.forEach(c => c.update()); this.coinsArr = this.coinsArr.filter(c => c.active);
                this.meteors.forEach(m => m.update()); this.meteors = this.meteors.filter(m => m.active);

                for (let i = 0; i < this.bullets.length; i++) {
                    let b = this.bullets[i];
                    if (!b.isPlayer || !b.active) continue;
                    let bRect = { x: b.x, y: b.y, w: b.w, h: b.h };
                    let hitSomething = false;

                    if (this.currentBoss && this.currentBoss.state !== 'enter' && this.currentBoss.state !== 'burrow') {
                        let boss = this.currentBoss;
                        if (checkAABB(bRect, { x: boss.x, y: boss.y, w: boss.w, h: boss.h })) {
                            if (b.isPiercing && b.hitTargets && b.hitTargets.has(boss)) {
                                if (Game.frameCount % 10 === 0) {
                                    boss.hp -= b.damage * 0.5; boss.flash = 4;
                                    this.spawnDamage(b.x, b.y, `-${b.damage * 0.5}`, false);
                                }
                            } else {
                                boss.hp -= b.damage; boss.flash = 4; hitSomething = true;
                                if (b.isPiercing) b.hitTargets.add(boss);
                                this.spawnDamage(b.x, b.y, b.damage > 1.5 ? `Crit! -${b.damage}` : `-${b.damage}`, b.damage > 1.5);
                                this.spawnParticles(b.x, b.y, b.damage >= 2 ? '#ef4444' : COLORS.spark, 5, b.damage >= 2 ? 3 : 2);
                            }

                            if (boss.hp <= 0) {
                                this.score += boss.score; boss.active = false; this.shake = 35;
                                this.spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, ['#ef4444', '#facc15', '#000'], 120, 7, true);
                                for(let c=0; c<35; c++) this.coinsArr.push(new Coin(boss.x + boss.w/2, boss.y + boss.h/2));
                                
                                this.isTransitioning = true;
                                let bStage = this.bossStages.find(bs => bs.type === boss.type);
                                if (bStage) bStage.done = true;
                                
                                if (boss.type === 'demon') {
                                    setTimeout(() => { 
                                        if (Game.state === 'PLAY') {
                                            this.state = 'WIN_CUTSCENE'; 
                                            this.csGirlX = GW + 50; this.csGirlY = -50; this.csTimer = 0;
                                            this.weather = 'clear'; this.enemies = []; this.bullets = [];
                                        }
                                    }, 3000);
                                } else {
                                    setTimeout(() => { 
                                        if (Game.state === 'PLAY') {
                                            this.state = 'SHOP'; 
                                            this.merchant = new Merchant(); 
                                            this.shopOpened = false;
                                            this.enemies = []; this.bullets = []; this.birds = [];
                                        }
                                    }, 3000);
                                }
                                this.currentBoss = null; this.weather = 'clear';
                            }
                        }
                    }

                    if (!hitSomething) {
                        for (let j = 0; j < this.enemies.length; j++) {
                            let e = this.enemies[j];
                            if (checkAABB(bRect, { x: e.x, y: e.y, w: e.w, h: e.h })) {
                                if (b.isPiercing && b.hitTargets && b.hitTargets.has(e)) continue;

                                e.hp -= b.damage; e.flash = 4; hitSomething = true;
                                if (b.isPiercing) b.hitTargets.add(e);

                                this.spawnDamage(b.x, b.y, b.damage > 1.5 ? `Crit! -${b.damage}` : `-${b.damage}`, b.damage > 1.5);
                                this.spawnParticles(b.x, b.y, b.damage >= 2 ? '#ef4444' : COLORS.spark, 4, 2);
                                if (e.hp <= 0) {
                                    this.score += e.score; e.active = false; this.addEnergy(5);
                                    this.spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef4444', 15, 3);
                                    if (Math.random() > 0.5) this.coinsArr.push(new Coin(e.x + e.w/2, e.y + e.h/2));
                                }
                                break;
                            }
                        }
                    }
                    
                    if (!hitSomething) {
                        for (let j = 0; j < this.birds.length; j++) {
                            let bird = this.birds[j];
                            if (checkAABB(bRect, { x: bird.x, y: bird.y, w: bird.w, h: bird.h })) {
                                this.player.invuln = 1800; 
                                this.spawnDamage(this.player.x, this.player.y - 40, "KHIÊN ÁNH SÁNG 30S!", true, '#38bdf8');
                                this.shake = 10;
                                this.spawnParticles(bird.x + 20, bird.y + 10, ['#38bdf8', '#ffffff'], 50, 6, true);
                                bird.active = false; hitSomething = true; break;
                            }
                        }
                    }

                    if (!hitSomething) {
                        for (let j = 0; j < this.items.length; j++) {
                            let it = this.items[j];
                            if (checkAABB(bRect, { x: it.x, y: it.y, w: it.w, h: it.h })) {
                                this.player.weapon = it.type;
                                let wName = it.type === 'M' ? 'SÚNG MÁY' : (it.type === 'S' ? 'ĐẠN TỎA' : (it.type === 'L' ? 'LASER' : 'ĐẠN LỬA'));
                                this.spawnDamage(this.player.x, this.player.y - 20, "TRANG BỊ " + wName, true, '#4ade80');
                                this.shake = 5; this.spawnParticles(it.x + 15, it.y + 15, '#facc15', 30, 4, true);
                                it.active = false; hitSomething = true; break;
                            }
                        }
                    }
                    if (hitSomething && !b.isPiercing) b.active = false;
                }

                let pRectHit = { x: this.player.x + 8, y: this.player.y + 10, w: this.player.w - 16, h: this.player.h - 15 };
                let pRectFull = { x: this.player.x, y: this.player.y, w: this.player.w, h: this.player.h };
                
                for (let c of this.coinsArr) {
                    if (c.active && checkAABB(pRectFull, {x: c.x - 5, y: c.y - 5, w: 10, h: 10})) {
                        c.active = false; this.coins++; this.addEnergy(1);
                        this.spawnParticles(c.x, c.y, ['#facc15', '#fff'], 4, 2);
                    }
                }

                for (let it of this.items) {
                    if (checkAABB(pRectFull, { x: it.x, y: it.y, w: it.w, h: it.h })) {
                        this.player.weapon = it.type;
                        let wName = it.type === 'M' ? 'SÚNG MÁY' : (it.type === 'S' ? 'ĐẠN TỎA' : (it.type === 'L' ? 'LASER' : 'ĐẠN LỬA'));
                        this.spawnDamage(this.player.x, this.player.y - 20, "TRANG BỊ " + wName, true, '#4ade80');
                        this.shake = 5; this.spawnParticles(it.x + 15, it.y + 15, '#facc15', 30, 4, true);
                        it.active = false;
                    }
                }

                if (this.player.invuln <= 0) {
                    let isHit = false;
                    for (let b of this.bullets) {
                        if (!b.isPlayer && b.active && checkAABB(pRectHit, { x: b.x + 4, y: b.y + 4, w: b.w - 8, h: b.h - 8 })) {
                            isHit = true; b.active = false; break;
                        }
                    }
                    if (!isHit) {
                        for (let e of this.enemies) {
                            if (checkAABB(pRectHit, { x: e.x, y: e.y, w: e.w, h: e.h })) { isHit = true; break; }
                        }
                    }
                    if (!isHit) {
                        for (let t of this.traps) {
                            if (checkAABB(pRectHit, { x: t.x + 5, y: t.y + 10, w: t.w - 10, h: t.h - 10 })) { isHit = true; break; }
                        }
                    }
                    if (!isHit && this.currentBoss && this.currentBoss.state !== 'burrow') {
                        let boss = this.currentBoss;
                        let shave = boss.type === 'mecha' ? 30 : 40;
                        if (checkAABB(pRectHit, { x: boss.x + shave/2, y: boss.y + shave/2, w: boss.w - shave, h: boss.h - shave/2 })) isHit = true;
                    }

                    if (isHit) {
                        this.player.takeDamage();
                    }
                }

                this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; if(p.hasGravity) p.vy += 0.4; });
                this.particles = this.particles.filter(p => p.life > 0);
                this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
            },

            draw() {
                ctx.save();
                if (this.shake > 0) {
                    let mag = this.shake * 0.5; ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
                }

                let grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
                let sTop = COLORS.skyTop, sBot = COLORS.skyBot;
                if (this.weather === 'rain') { sTop = '#020617'; sBot = '#0f172a'; }
                if (this.weather === 'evil') { sTop = COLORS.skyTopEvil; sBot = COLORS.skyBotEvil; }
                
                grad.addColorStop(0, sTop); grad.addColorStop(1, sBot);
                ctx.fillStyle = grad; ctx.fillRect(0, 0, GW, GH);

                if (this.weather === 'clear') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 60, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 40, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(GW - 80, 120, 22, 0, Math.PI*2); ctx.fill();
                } else if (this.weather === 'evil') {
                    ctx.fillStyle = 'rgba(220, 38, 38, 0.05)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 60, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(220, 38, 38, 0.2)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 40, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(GW - 80, 120, 22, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.05)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 50, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#991b1b'; ctx.beginPath(); ctx.arc(GW - 80, 120, 20, 0, Math.PI*2); ctx.fill();
                }

                ctx.fillStyle = (this.weather === 'rain' || this.weather === 'evil') ? 'rgba(30, 41, 59, 0.6)' : 'rgba(255, 255, 255, 0.15)';
                for(let i=0; i<4; i++) {
                    let cx = (GW + 200 - ((this.bgScroll * 0.15) + i * 160) % (GW + 300)) - 50; let cy = 60 + (i % 2) * 40;
                    ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 25, cy - 15, 35, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 50, cy, 25, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(cx, cy - 5, 50, 30); 
                }

                if (this.weather === 'clear') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    for(let i=0; i<30; i++) { 
                        let sx = (i * 73 - this.bgScroll * 0.03) % GW; if(sx < 0) sx += GW;
                        ctx.fillRect(sx, (i * 91) % (GROUND_Y - 150), Game.frameCount%20 < 10 ? 2 : 1, Game.frameCount%20 < 10 ? 2 : 1); 
                    }
                }

                ctx.fillStyle = (this.weather === 'rain' || this.weather === 'evil') ? '#0f172a' : COLORS.mountBack;
                let offBack = -(this.bgScroll * 0.2 % 300);
                for(let i=-1; i<=Math.ceil(GW/300)+1; i++) {
                    ctx.beginPath(); ctx.moveTo(offBack + i*300, GROUND_Y); ctx.lineTo(offBack + i*300 + 150, GROUND_Y - 220); ctx.lineTo(offBack + i*300 + 300, GROUND_Y); ctx.fill();
                }
                
                ctx.fillStyle = (this.weather === 'rain' || this.weather === 'evil') ? '#1e293b' : COLORS.mountFront;
                let offFront = -(this.bgScroll * 0.4 % 250);
                for(let i=-1; i<=Math.ceil(GW/250)+1; i++) {
                    ctx.beginPath(); ctx.moveTo(offFront + i*250, GROUND_Y); ctx.lineTo(offFront + i*250 + 125, GROUND_Y - 140); ctx.lineTo(offFront + i*250 + 250, GROUND_Y); ctx.fill();
                }

                let grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 40);
                grassGrad.addColorStop(0, COLORS.groundTop); grassGrad.addColorStop(1, COLORS.groundBot);
                ctx.fillStyle = grassGrad; ctx.fillRect(0, GROUND_Y, GW, 40);
                
                ctx.fillStyle = (this.weather === 'evil') ? '#65a30d' : '#22c55e'; 
                let grassOffset = -(this.bgScroll % 40);
                for(let i=-1; i<=GW/40 + 1; i++) { ctx.fillRect(grassOffset + i*40, GROUND_Y, 20, 6); }

                let dirtGrad = ctx.createLinearGradient(0, GROUND_Y + 40, 0, GH);
                dirtGrad.addColorStop(0, COLORS.dirtTop); dirtGrad.addColorStop(1, COLORS.dirtBot);
                ctx.fillStyle = dirtGrad; ctx.fillRect(0, GROUND_Y + 40, GW, GH - (GROUND_Y + 40));

                if (this.state === 'CUTSCENE' || this.state === 'WIN_CUTSCENE') {
                    ctx.save(); ctx.translate(this.csGirlX, this.csGirlY);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(15, GROUND_Y - this.csGirlY, 12, 3, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(0, 45); ctx.lineTo(30, 45); ctx.fill();
                    ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.arc(15, 10, 10, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#e879f9'; ctx.beginPath(); ctx.arc(15, 8, 12, Math.PI, 0); ctx.fill(); 
                    ctx.restore();

                    if (this.state === 'CUTSCENE') {
                        ctx.save(); ctx.translate(this.csDragonX, this.csDragonY);
                        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(50, GROUND_Y - this.csDragonY, 40, 8, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(50, 70, 50, 30, 0, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(20, 30, 35, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(120, -20); ctx.lineTo(140, 50); ctx.fill(); 
                        ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 6, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                        ctx.restore();
                    }

                    this.player.draw(ctx);
                } 
                else if (this.state === 'PLAY' || this.state === 'WIN' || this.state === 'GAMEOVER' || this.state === 'SHOP') {
                    this.traps.forEach(t => t.draw(ctx));
                    this.platforms.forEach(p => p.draw(ctx)); 
                    this.items.forEach(it => it.draw(ctx));
                    this.birds.forEach(b => b.draw(ctx)); 
                    this.enemies.forEach(e => e.draw(ctx));
                    this.coinsArr.forEach(c => c.draw(ctx));

                    if (this.merchant) this.merchant.draw(ctx);
                    
                    if (this.state !== 'GAMEOVER') {
                        this.player.draw(ctx);
                        if(this.pet) this.pet.draw(ctx);
                    }
                    if (this.currentBoss) this.currentBoss.draw(ctx);
                    this.bullets.forEach(b => b.draw(ctx));
                    this.meteors.forEach(m => m.draw(ctx));
                    
                    if (this.weather === 'rain') this.raindrops.forEach(r => r.draw(ctx));
                }

                ctx.lineJoin = 'round';
                this.particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;

                this.floatingTexts.forEach(f => f.draw(ctx));

                this.texts.forEach(t => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
                    ctx.fillStyle = t.color; ctx.font = 'bold 28px "Pixelify Sans"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    let ty = t.y - (t.maxLife - t.life)*0.6;
                    ctx.strokeStyle = 'black'; ctx.lineWidth = 5;
                    ctx.strokeText(t.txt, t.x, ty); ctx.fillText(t.txt, t.x, ty);
                    ctx.restore();
                });

                if (this.flashDamage > 0) {
                    ctx.fillStyle = `rgba(239, 68, 68, ${this.flashDamage * 0.1})`;
                    ctx.fillRect(0, 0, GW, GH);
                }
                if (this.flashUlt > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.flashUlt * 0.05})`;
                    ctx.fillRect(0, 0, GW, GH);
                }

                if (this.state === 'PLAY' || this.state === 'WIN' || this.state === 'SHOP' || this.state === 'WIN_CUTSCENE') {
                    let maxDrawLives = Math.max(3, this.player.lives);
                    for (let i = 0; i < maxDrawLives; i++) {
                        let cx = 35 + i * 36; let cy = 25;
                        ctx.fillStyle = i < this.player.lives ? '#ef4444' : '#475569';
                        ctx.beginPath(); ctx.moveTo(cx, cy + 6);
                        ctx.bezierCurveTo(cx - 14, cy - 9, cx - 22, cy + 7, cx, cy + 17);
                        ctx.bezierCurveTo(cx + 22, cy + 7, cx + 14, cy - 9, cx, cy + 6); ctx.fill();
                        
                        if (i < this.player.lives) {
                            ctx.fillStyle = 'rgba(255,255,255,0.4)';
                            ctx.beginPath(); ctx.ellipse(cx - 6, cy - 2, 4, 2, Math.PI/4, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    
                    let wpx = 15, wpy = 50;
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.beginPath(); ctx.roundRect(wpx, wpy, 130, 28, 4); ctx.fill();
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
                    
                    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 16px "Pixelify Sans"'; 
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    let wName = this.player.weapon === 'M' ? 'SÚNG MÁY' : (this.player.weapon === 'S' ? 'ĐẠN TỎA' : (this.player.weapon === 'L' ? 'LASER' : (this.player.weapon === 'F' ? 'ĐẠN LỬA' : 'SÚNG LỤC')));
                    ctx.fillText(wName, wpx + 65, wpy + 15);

                    // Energy Bar under weapon
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(wpx, wpy + 32, 130, 10);
                    ctx.fillStyle = this.energy === this.maxEnergy ? '#facc15' : '#38bdf8';
                    ctx.fillRect(wpx, wpy + 32, 130 * (this.energy/this.maxEnergy), 10);
                    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1; ctx.strokeRect(wpx, wpy + 32, 130, 10);
                    
                    ctx.textAlign = 'right'; ctx.textBaseline = 'top'; 
                    ctx.font = 'bold 36px "Pixelify Sans"';
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeText(this.score, GW - 15, 15);
                    ctx.fillStyle = '#facc15'; ctx.fillText(this.score, GW - 15, 15);

                    ctx.font = 'bold 24px "Pixelify Sans"';
                    let coinTxt = "💰 " + this.coins;
                    ctx.strokeText(coinTxt, GW - 15, 55);
                    ctx.fillStyle = '#fff'; ctx.fillText(coinTxt, GW - 15, 55);

                    if (this.player.invuln > 120 && !this.player.isDashing) {
                        let secs = Math.ceil((this.player.invuln - 120) / 60);
                        ctx.textAlign = 'center'; ctx.font = 'bold 26px "Pixelify Sans"';
                        ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText("BẢO VỆ: " + secs + "s", GW/2, 90);
                        ctx.fillStyle = '#38bdf8'; ctx.fillText("BẢO VỆ: " + secs + "s", GW/2, 90);
                    }
                }
                ctx.restore();
            },

            loop() {
                this.update(); this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        Game.init();
    </script>
</body>
</html>
