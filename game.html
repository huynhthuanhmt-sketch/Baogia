
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cứu Vợ - Chiến Dịch Contra (Bản Sửa Lỗi)</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #020617;
            display: flex; justify-content: center; align-items: center;
            /* Sửa lỗi thanh địa chỉ che khuất trên trình duyệt Mobile */
            height: 100vh; height: 100dvh; 
            width: 100vw; font-family: 'Pixelify Sans', sans-serif;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1), 0 0 25px rgba(56, 189, 248, 0.4);
            overflow: hidden;
        }
        
        @media (min-width: 501px) {
            #game-container { border-radius: 20px; height: 95vh; border: 1px solid #1e293b; }
        }

        canvas {
            display: block; width: 100%; height: 100%;
            object-fit: contain;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(56, 189, 248, 0.6);
            border-radius: 24px; padding: 40px 30px;
            text-align: center; color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(56, 189, 248, 0.15);
            pointer-events: auto; width: 85%;
            display: none;
        }
        .panel.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .game-title { 
            margin: 0 0 15px 0; font-size: 42px; color: #facc15; 
            text-shadow: 3px 3px 0 #b45309, 0 0 20px rgba(250, 204, 21, 0.4); 
            line-height: 1.1; letter-spacing: 2px; text-transform: uppercase;
        }
        .desc { font-size: 18px; margin: 0 0 25px 0; color: #cbd5e1; line-height: 1.5; }
        
        .score-box {
            background: rgba(0,0,0,0.7); border: 2px solid #facc15;
            color: #facc15; font-size: 30px; font-weight: bold;
            padding: 12px 30px; border-radius: 14px; margin: 0 auto 30px auto;
            display: inline-block; box-shadow: 0 0 20px rgba(250,204,21,0.25);
        }
        
        .btn {
            border-radius: 14px; padding: 18px 36px; font-family: inherit; font-size: 24px;
            color: white; font-weight: bold; cursor: pointer; letter-spacing: 2px;
            transition: all 0.15s ease; width: 100%; text-transform: uppercase;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0 transparent !important; }
        
        .btn-primary {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            border: 2px solid #fca5a5; box-shadow: 0 8px 0 #7f1d1d, 0 15px 25px rgba(0,0,0,0.6);
        }
        .btn-success {
            background: linear-gradient(to bottom, #10b981, #047857);
            border: 2px solid #6ee7b7; box-shadow: 0 8px 0 #064e3b, 0 15px 25px rgba(0,0,0,0.6);
        }

        #controls-layer {
            position: absolute; 
            bottom: 25px; bottom: max(25px, env(safe-area-inset-bottom)); 
            left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 40; pointer-events: none;
        }

        .ctrl-group { display: flex; gap: 18px; pointer-events: auto; }

        .ctrl-btn {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.2);
            transition: all 0.1s; cursor: pointer;
        }
        
        /* Chống lỗi chạm lệch màng loa icon trên mobile */
        .ctrl-btn svg, .ctrl-btn path, .ctrl-btn circle {
            pointer-events: none;
        }

        .ctrl-btn svg {
            width: 34px; height: 34px; stroke: #ffffff;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
        }
        .ctrl-btn.active { 
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
            transform: scale(0.9) translateY(4px); 
            box-shadow: 0 0px 5px rgba(0,0,0,0.5), inset 0 4px 10px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .ctrl-btn.active svg { stroke: #facc15; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="game-over-menu" class="panel">
                <h1 class="game-title" style="color: #ef4444; text-shadow: 3px 3px 0 #7f1d1d;">TỬ TRẬN!</h1>
                <p class="desc">Nhiệm vụ thất bại. Vợ bạn vẫn đang chờ!</p>
                <div class="score-box">ĐIỂM: <span id="final-score">0</span></div>
                <button class="btn btn-primary" onclick="Game.resetGame()">THỬ LẠI</button>
            </div>

            <div id="victory-menu" class="panel">
                <h1 class="game-title" style="color: #4ade80; text-shadow: 3px 3px 0 #14532d;">THẮNG LỢI!</h1>
                <p class="desc">Anh hùng cứu mỹ nhân! ♥</p>
                <div class="score-box">ĐIỂM: <span id="win-score">0</span></div>
                <button class="btn btn-success" onclick="Game.resetGame()">CHƠI LẠI</button>
            </div>
        </div>

        <div id="controls-layer">
            <div class="ctrl-group">
                <div class="ctrl-btn" id="btn-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </div>
                <div class="ctrl-btn" id="btn-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </div>
            </div>
            <div class="ctrl-group">
                <div class="ctrl-btn" id="btn-jump">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                </div>
                <div class="ctrl-btn" id="btn-shoot">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GW = 400; 
        const GH = 700;
        const GROUND_Y = 480; 

        canvas.width = GW;
        canvas.height = GH;

        const COLORS = {
            skyTop: '#0f172a', skyBot: '#1e293b',
            groundTop: '#15803d', groundBot: '#14532d', 
            dirtTop: '#451a03', dirtBot: '#1c0a00',     
            mountBack: '#1e293b', mountFront: '#334155',
            playerSkin: '#fde047', playerShirt: '#ef4444', playerPants: '#2563eb',
            bulletPlayer: '#fef08a', bulletEnemy: '#f43f5e',
            blood: '#dc2626', spark: '#fef08a'
        };

        const keys = { left: false, right: false, jump: false, shoot: false };

        function bindButton(id, keyName) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
            
            btn.addEventListener('touchstart', press, {passive: false});
            btn.addEventListener('touchend', release, {passive: false});
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');
        bindButton('btn-jump', 'jump');
        bindButton('btn-shoot', 'shoot');

        // Ngăn chặn lỗi cuộn trang của trình duyệt khi bấm Space/Mũi tên trên Máy tính
        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = true;
            if (e.code === 'KeyX' || e.code === 'Enter') keys.shoot = true;
        }, {passive: false});

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = false;
            if (e.code === 'KeyX' || e.code === 'Enter') keys.shoot = false;
        });

        function checkAABB(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        // ==========================================
        // CLASSES
        // ==========================================

        class Platform {
            constructor(x, y, w) {
                this.x = x; this.y = y; this.w = w; this.h = 16;
                this.vx = -1.5; 
                this.active = true;
            }
            update() {
                this.x += this.vx;
                if (this.x < -this.w) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = '#334155'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#64748b'; ctx.fillRect(this.x, this.y, this.w, 4);
                ctx.fillStyle = '#eab308';
                for(let i=10; i<this.w-10; i+=20) { ctx.fillRect(this.x + i, this.y, 10, 4); }
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.w, this.h);
            }
        }

        class Player {
            constructor() {
                this.w = 30; this.h = 45;
                this.x = 80; this.y = GROUND_Y - this.h;
                this.vx = 0; this.vy = 0;
                this.speed = 4.5; this.jumpPower = -12.5;
                this.isGrounded = true;
                this.lives = 3; this.weapon = 'N';
                this.cooldown = 0; this.invuln = 0;
            }

            update() {
                let prevY = this.y;
                
                this.vy += 0.65; 
                this.y += this.vy;
                
                this.isGrounded = false;
                let onPlatform = false;

                // Tối ưu thuật toán check va chạm Platform không bị lọt thỏm
                for (let p of Game.platforms) {
                    if (this.vy >= 0 && prevY + this.h <= p.y + 20 && this.x + this.w > p.x && this.x < p.x + p.w) {
                        if (this.y + this.h >= p.y) {
                            this.y = p.y - this.h;
                            this.vy = 0;
                            this.isGrounded = true;
                            onPlatform = true;
                            this.x += p.vx; 
                            break;
                        }
                    }
                }

                if (!onPlatform && this.y >= GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h;
                    this.vy = 0; 
                    this.isGrounded = true;
                }

                if (keys.left) this.x -= this.speed;
                if (keys.right) this.x += this.speed;
                if (this.x < 0) this.x = 0;
                if (this.x > GW - this.w) this.x = GW - this.w;

                if (keys.jump && this.isGrounded) {
                    this.vy = this.jumpPower;
                    this.isGrounded = false;
                    Game.spawnParticles(this.x + this.w/2, this.y + this.h, '#94a3b8', 6, 2.5);
                }

                if (this.cooldown > 0) this.cooldown--;
                if (keys.shoot && this.cooldown <= 0) this.shoot();
                if (this.invuln > 0) this.invuln--;
            }

            shoot() {
                let px = this.x + this.w;
                let py = this.y + 15;
                
                if (this.weapon === 'M') { 
                    this.cooldown = 6;
                    Game.bullets.push(new Bullet(px, py + (Math.random()*6-3), 16, 0, 1, 14, 4, '#4ade80', true));
                } else if (this.weapon === 'S') { 
                    this.cooldown = 15;
                    Game.bullets.push(new Bullet(px, py, 12, -2, 1, 10, 10, '#f97316', true));
                    Game.bullets.push(new Bullet(px, py, 12, 0, 1, 10, 10, '#f97316', true));
                    Game.bullets.push(new Bullet(px, py, 12, 2, 1, 10, 10, '#f97316', true));
                } else if (this.weapon === 'L') { 
                    this.cooldown = 20;
                    Game.bullets.push(new Bullet(px, py, 20, 0, 2, 60, 6, '#22d3ee', true, true));
                } else { 
                    this.cooldown = 12;
                    Game.bullets.push(new Bullet(px, py, 12, 0, 1, 10, 4, COLORS.bulletPlayer, true));
                }
                Game.spawnParticles(px, py + 2, '#fbbf24', 2, 1);
            }

            draw(ctx) {
                if (this.invuln > 0 && Game.frameCount % 10 < 5) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                
                let walkOffset = 0;
                if (Game.state === 'CUTSCENE' && Game.csPhase === 0) {
                    walkOffset = Math.sin(Game.frameCount * 0.6) * 6;
                } else {
                    walkOffset = (this.isGrounded && (keys.left || keys.right)) ? Math.sin(Game.frameCount * 0.5) * 6 : 0;
                }
                
                ctx.fillStyle = COLORS.playerPants;
                ctx.fillRect(4 + walkOffset, 30, 8, 15);
                ctx.fillRect(18 - walkOffset, 30, 8, 15);
                
                ctx.fillStyle = COLORS.playerShirt;
                ctx.fillRect(5, 15, 20, 18);
                
                ctx.fillStyle = COLORS.playerSkin;
                ctx.beginPath(); ctx.arc(15, 8, 12, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(3, 2, 24, 4);

                ctx.fillStyle = 'black';
                ctx.fillRect(18, 5, 3, 3);
                
                ctx.fillStyle = '#475569';
                let recoil = this.cooldown > Math.max(0, this.cooldown - 3) ? -3 : 0;
                ctx.fillRect(15 + recoil, 18, 22, 6);
                
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, damage, w, h, color, isPlayer, isPiercing = false) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.damage = damage; this.w = w; this.h = h;
                this.color = color; this.isPlayer = isPlayer;
                this.isPiercing = isPiercing;
                this.active = true;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < -100 || this.x > GW + 100 || this.y < -100 || this.y > GH + 100) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillRect(this.x + 1, this.y + 1, this.w - 2, this.h - 2);
                ctx.shadowBlur = 0;
            }
        }

        class Enemy {
            constructor(type) {
                this.type = type; this.active = true;
                this.x = GW + 20; this.flash = 0;
                
                if (type === 'soldier') {
                    this.y = GROUND_Y - 30; this.w = 20; this.h = 30;
                    this.hp = 1; this.score = 5; this.vx = -2.5 - Math.random();
                    this.shootTimer = Math.floor(Math.random() * 60 + 50);
                } else if (type === 'plane') {
                    this.y = Math.random() * 60 + 300; 
                    this.w = 40; this.h = 25;
                    this.hp = 2; this.score = 10; this.vx = -4 - Math.random()*2; this.baseY = this.y;
                }
            }
            update() {
                this.x += this.vx;
                
                if (this.type === 'plane') {
                    this.y = this.baseY + Math.sin(Game.frameCount * 0.05) * 20;
                } else if (this.type === 'soldier') {
                    this.shootTimer--;
                    if (this.shootTimer <= 0) {
                        Game.bullets.push(new Bullet(this.x, this.y + 10, -5, 0, 1, 10, 4, '#f59e0b', false));
                        this.shootTimer = Math.floor(Math.random() * 80 + 80); 
                    }
                }

                if (this.x < -100) this.active = false;
                if (this.flash > 0) this.flash--;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.flash > 0) {
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, this.w, this.h);
                } else {
                    if (this.type === 'soldier') {
                        ctx.fillStyle = '#65a30d'; ctx.fillRect(0, 10, 20, 20); 
                        ctx.fillStyle = '#fcd34d'; ctx.fillRect(4, 0, 12, 12); 
                        ctx.fillStyle = 'black'; ctx.fillRect(2, 4, 3, 3); 
                    } else if (this.type === 'plane') {
                        ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.ellipse(20, 12, 20, 12, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ef4444'; ctx.fillRect(5, 5, 15, 8); 
                        
                        let rH = (Game.frameCount % 4 < 2) ? 25 : 8;
                        let rY = (Game.frameCount % 4 < 2) ? 0 : 8;
                        ctx.fillStyle = '#334155'; ctx.fillRect(30, rY, 8, rH); 
                    }
                }
                ctx.restore();
            }
        }

        class Boss {
            constructor(type) {
                this.type = type; this.active = true;
                this.x = GW + 100; this.state = 'enter'; this.timer = 0; this.flash = 0;
                
                if (type === 'tank') {
                    this.w = 120; this.h = 70; this.y = GROUND_Y - this.h;
                    this.hp = 100; this.maxHp = 100; this.score = 100;
                } else if (type === 'heli') {
                    this.w = 100; this.h = 60; 
                    this.y = 300; this.baseY = 300;
                    this.hp = 250; this.maxHp = 250; this.score = 200;
                } else if (type === 'dragon') {
                    this.w = 100; this.h = 100; 
                    this.y = 260; this.baseY = 260;
                    this.hp = 600; this.maxHp = 600; this.score = 500;
                }
            }
            update() {
                this.timer++;
                if (this.flash > 0) this.flash--;

                if (this.state === 'enter') {
                    this.x -= 2;
                    if (this.x <= GW - this.w - 20) this.state = 'attack';
                } else if (this.state === 'attack') {
                    if (this.type === 'tank') {
                        if (this.timer % 80 === 0) { 
                            Game.bullets.push(new Bullet(this.x, this.y + 20, -6, 0, 1, 20, 20, '#ef4444', false));
                            Game.shake = 10;
                        }
                        if (this.timer % 120 > 90 && this.timer % 10 === 0) { 
                            Game.bullets.push(new Bullet(this.x, this.y + 50, -8, 0, 1, 10, 4, '#f59e0b', false));
                        }
                        if (this.timer % 120 === 0) {
                            Game.platforms.push(new Platform(GW + 50, GROUND_Y - 80, 100));
                        }
                    } else if (this.type === 'heli') {
                        this.y = this.baseY + Math.sin(this.timer * 0.04) * 40; 
                        if (this.timer % 50 === 0) { 
                            let dx = (Game.player.x + Game.player.w/2) - (this.x);
                            let dy = (Game.player.y + Game.player.h/2) - (this.y + this.h);
                            let dist = Math.hypot(dx, dy);
                            Game.bullets.push(new Bullet(this.x, this.y + this.h, (dx/dist)*6, (dy/dist)*6, 1, 12, 12, '#a855f7', false));
                        }
                    } else if (this.type === 'dragon') {
                        this.y = this.baseY + Math.sin(this.timer * 0.05) * 60; 
                        if (this.timer % 60 === 0) { 
                            for(let i=-2; i<=2; i+=2) {
                                Game.bullets.push(new Bullet(this.x, this.y + 40, -5, i, 1, 16, 16, '#f97316', false));
                            }
                        }
                        if (this.timer % 300 === 0) { 
                            this.state = 'dash';
                            Game.spawnText("CẨN THẬN!", GW/2, GH/2, '#ef4444');
                        }
                    }
                } else if (this.state === 'dash') {
                    this.x -= 15;
                    if (this.x < -this.w) {
                        this.x = GW + 50; this.state = 'enter';
                    }
                }
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.flash > 0) {
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, this.w, this.h);
                } else {
                    if (this.type === 'tank') {
                        ctx.fillStyle = '#475569'; ctx.fillRect(0, 30, this.w, 40); 
                        ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.arc(this.w/2, 30, 40, Math.PI, 0); ctx.fill(); 
                        ctx.fillStyle = '#1e293b'; ctx.fillRect(-30, 15, 60, 10); 
                        ctx.fillRect(-10, 45, 20, 6); 
                    } else if (this.type === 'heli') {
                        ctx.fillStyle = '#0f766e'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-20, this.h/2 - 5, 20, 10); 
                        ctx.fillStyle = '#94a3b8'; ctx.fillRect(this.w/2 - 5, -10, 10, 10); 
                        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(this.w/2 - 40, -10, 80, 2); 
                    } else if (this.type === 'dragon') {
                        ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2 + 20, this.w/2, this.h/2-20, 0, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(20, 30, 30, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(this.w/2, this.h/2); ctx.lineTo(this.w + 20, -20); ctx.lineTo(this.w + 40, this.h/2); ctx.fill(); 
                        ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 5, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                    }
                }
                
                if (this.state !== 'enter') {
                    let hpRatio = Math.max(0, this.hp/this.maxHp);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, -25, this.w, 12);
                    ctx.fillStyle = hpRatio > 0.4 ? '#22c55e' : (hpRatio > 0.2 ? '#eab308' : '#ef4444'); 
                    ctx.fillRect(1, -24, (this.w - 2) * hpRatio, 10);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(0, -25, this.w, 12);
                }
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.w = 30; this.h = 30;
                this.type = type; this.active = true;
                this.vy = -5;
            }
            update() {
                this.x -= 2;
                this.vy += 0.5; this.y += this.vy;
                if (this.y > GROUND_Y - this.h) { this.y = GROUND_Y - this.h; this.vy = 0; }
                if (this.x < -50) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = '#b45309'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#78350f'; 
                ctx.fillRect(this.x, this.y, this.w, 4); ctx.fillRect(this.x, this.y + this.h - 4, this.w, 4);
                ctx.fillRect(this.x, this.y, 4, this.h); ctx.fillRect(this.x + this.w - 4, this.y, 4, this.h);
                
                ctx.fillStyle = '#fef08a'; ctx.font = 'bold 22px "Pixelify Sans"'; ctx.textAlign = 'center';
                ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                ctx.fillText(this.type, this.x + this.w/2, this.y + 24);
                ctx.shadowBlur = 0;
            }
        }

        // ==========================================
        // MAIN GAME ENGINE
        // ==========================================

        const Game = {
            state: 'CUTSCENE',
            frameCount: 0, score: 0, bgScroll: 0, shake: 0,
            
            player: null, bullets: [], enemies: [], items: [], particles: [], texts: [], platforms: [],
            currentBoss: null,
            bossStages: [
                { score: 100, type: 'tank', done: false },
                { score: 300, type: 'heli', done: false },
                { score: 1000, type: 'dragon', done: false }
            ],

            csPhase: 0, csTimer: 0, csGirlX: 0, csGirlY: 0, csDragonX: 0, csDragonY: 0,

            init() { 
                Game.startCutscene();
                requestAnimationFrame(() => Game.loop()); 
            },

            startCutscene() {
                document.getElementById('controls-layer').style.display = 'none';
                
                Game.state = 'CUTSCENE'; 
                Game.csPhase = 0; Game.csTimer = 0;
                
                Game.player = new Player();
                Game.player.x = -50; 
                
                Game.csGirlX = GW/2 + 30;
                Game.csGirlY = GROUND_Y - 45; 
                
                Game.csDragonX = GW + 50;
                Game.csDragonY = -150; 
                
                Game.texts = []; Game.items = []; Game.platforms = [];
            },

            startGame() {
                Game.state = 'PLAY';
                Game.score = 0; Game.frameCount = 0;
                Game.bullets = []; Game.enemies = []; Game.particles = []; Game.texts = []; Game.platforms = [];
                // Sửa lỗi: Cấp súng Máy mặc định tại vị trí người chơi ngay khi Game bắt đầu!
                Game.items = [];
                Game.items.push(new Item(80 + 50, GROUND_Y - 30, 'M'));
                
                Game.currentBoss = null;
                Game.bossStages.forEach(b => b.done = false);
                Game.player = new Player(); 
                document.getElementById('controls-layer').style.display = 'flex';
            },

            resetGame() {
                document.getElementById('game-over-menu').classList.remove('show');
                document.getElementById('victory-menu').classList.remove('show');
                Game.startGame();
            },

            spawnParticles(x, y, color, count, size) {
                for(let i=0; i<count; i++) {
                    let col = Array.isArray(color) ? color[Math.floor(Math.random()*color.length)] : color;
                    Game.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 2,
                        life: 1.0, color: col, size: Math.random() * size + size
                    });
                }
            },

            spawnText(txt, x, y, color) {
                Game.texts.push({ txt, x, y, life: 60, color });
            },

            update() {
                Game.frameCount++;
                if (Game.shake > 0) Game.shake--;

                if (Game.state === 'CUTSCENE') {
                    Game.csTimer++;
                    if (Game.csPhase === 0) {
                        Game.player.x += 2.5;
                        if (Game.player.x >= GW/2 - 50) {
                            Game.player.x = GW/2 - 50;
                            Game.csPhase = 1; Game.csTimer = 0;
                        }
                    } else if (Game.csPhase === 1) {
                        if (Game.csTimer === 20) Game.spawnText("Làm vợ anh nhé!", Game.player.x + 15, Game.player.y - 20, 'white');
                        if (Game.csTimer === 90) Game.spawnText("Vâng! ♥", Game.csGirlX + 15, Game.csGirlY - 20, '#f472b6');
                        if (Game.csTimer === 170) { Game.csPhase = 2; Game.csTimer = 0; }
                    } else if (Game.csPhase === 2) {
                        // FIX: Thuật toán nội suy đường bay mượt mà, chống giật lác (snapping)
                        let targetX = Game.csGirlX - 40;
                        let targetY = Game.csGirlY - 60;
                        let dx = targetX - Game.csDragonX;
                        let dy = targetY - Game.csDragonY;
                        let dist = Math.hypot(dx, dy);
                        
                        if (dist < 12) {
                            Game.csDragonX = targetX; Game.csDragonY = targetY;
                            Game.shake = 30; 
                            Game.spawnParticles(Game.csDragonX + 50, GROUND_Y, '#475569', 25, 4); 
                            Game.spawnText("CỨU EM!!!", Game.csGirlX + 15, Game.csGirlY - 30, '#ef4444');
                            Game.csPhase = 3; Game.csTimer = 0;
                        } else {
                            Game.csDragonX += (dx / dist) * 11;
                            Game.csDragonY += (dy / dist) * 11;
                        }
                    } else if (Game.csPhase === 3) {
                        if (Game.csTimer > 25) { 
                            Game.csDragonX += 5; Game.csDragonY -= 6;
                            Game.csGirlX = Game.csDragonX + 20; Game.csGirlY = Game.csDragonY + 60;
                        }
                        if (Game.csTimer === 70) Game.spawnText("TRẢ VỢ CHO TAAA!", Game.player.x + 15, Game.player.y - 20, 'red');
                        if (Game.csDragonY < -150) { Game.csPhase = 4; Game.csTimer = 0; }
                    } else if (Game.csPhase === 4) {
                        if (Game.csTimer === 30) Game.startGame();
                    }
                    
                    Game.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
                    Game.particles = Game.particles.filter(p => p.life > 0);
                    Game.texts.forEach(t => t.life--);
                    Game.texts = Game.texts.filter(t => t.life > 0);
                    return; 
                }

                if (Game.state === 'WIN') return;
                if (Game.state !== 'PLAY') return;

                Game.bgScroll += 1.5; 
                Game.player.update();

                if (!Game.currentBoss && Game.frameCount % 180 === 0 && Math.random() > 0.3) {
                    Game.platforms.push(new Platform(GW, GROUND_Y - 80 - Math.random() * 30, 80 + Math.random() * 40));
                }

                Game.platforms.forEach(p => p.update());
                Game.platforms = Game.platforms.filter(p => p.active);

                if (!Game.currentBoss) {
                    if (Game.frameCount % 10 === 0) Game.score++; 
                    
                    let nextBoss = Game.bossStages.find(b => !b.done && Game.score >= b.score);
                    if (nextBoss) {
                        Game.currentBoss = new Boss(nextBoss.type);
                        Game.spawnText("WARNING BOSS!", GW/2, GH/2, '#ef4444');
                        Game.shake = 20;
                    } else {
                        let spawnRate = Math.max(30, 90 - Math.floor(Game.score/10));
                        if (Game.frameCount % spawnRate === 0) Game.enemies.push(new Enemy(Math.random() > 0.5 ? 'soldier' : 'plane'));
                        if (Game.frameCount % 300 === 0 && Math.random() > 0.3) {
                            let types = ['M', 'S', 'L'];
                            Game.items.push(new Item(GW, -50, types[Math.floor(Math.random()*3)]));
                        }
                    }
                } else {
                    Game.currentBoss.update();
                    if (!Game.currentBoss.active) {
                        let bStage = Game.bossStages.find(b => b.type === Game.currentBoss.type);
                        if (bStage) bStage.done = true;
                        
                        if (Game.currentBoss.type === 'dragon') {
                            Game.state = 'WIN';
                            document.getElementById('controls-layer').style.display = 'none';
                            document.getElementById('victory-menu').classList.add('show');
                            document.getElementById('win-score').innerText = Game.score;
                            Game.spawnParticles(GW/2, GH/2, ['#facc15', '#f472b6', '#38bdf8'], 200, 6);
                        }
                        Game.currentBoss = null;
                    }
                }

                Game.bullets.forEach(b => b.update());
                Game.bullets = Game.bullets.filter(b => b.active);
                Game.enemies.forEach(e => e.update());
                Game.enemies = Game.enemies.filter(e => e.active);
                Game.items.forEach(i => i.update());
                Game.items = Game.items.filter(i => i.active);

                let pRect = { x: Game.player.x + 5, y: Game.player.y + 5, w: Game.player.w - 10, h: Game.player.h - 10 };

                for (let i = 0; i < Game.bullets.length; i++) {
                    let b = Game.bullets[i];
                    if (!b.isPlayer || !b.active) continue;
                    let bRect = { x: b.x, y: b.y, w: b.w, h: b.h };
                    let hitSomething = false;

                    if (Game.currentBoss && Game.currentBoss.state !== 'enter') {
                        let boss = Game.currentBoss;
                        if (checkAABB(bRect, { x: boss.x, y: boss.y, w: boss.w, h: boss.h })) {
                            boss.hp -= b.damage; boss.flash = 3; hitSomething = true;
                            Game.spawnParticles(b.x, b.y, COLORS.spark, 3, 2);
                            if (boss.hp <= 0) {
                                Game.score += boss.score; boss.active = false; Game.shake = 30;
                                Game.spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, ['#ef4444', '#facc15'], 80, 6);
                            }
                        }
                    }

                    if (!hitSomething) {
                        for (let j = 0; j < Game.enemies.length; j++) {
                            let e = Game.enemies[j];
                            if (checkAABB(bRect, { x: e.x, y: e.y, w: e.w, h: e.h })) {
                                e.hp -= b.damage; e.flash = 3; hitSomething = true;
                                Game.spawnParticles(b.x, b.y, COLORS.spark, 3, 2);
                                if (e.hp <= 0) {
                                    Game.score += e.score; e.active = false;
                                    Game.spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef4444', 10, 3);
                                }
                                break;
                            }
                        }
                    }
                    if (hitSomething && !b.isPiercing) b.active = false;
                }

                if (Game.player.invuln <= 0) {
                    let isHit = false;
                    for (let b of Game.bullets) {
                        if (!b.isPlayer && b.active && checkAABB(pRect, { x: b.x, y: b.y, w: b.w, h: b.h })) {
                            isHit = true; b.active = false; break;
                        }
                    }
                    if (!isHit) {
                        for (let e of Game.enemies) {
                            if (checkAABB(pRect, { x: e.x, y: e.y, w: e.w, h: e.h })) { isHit = true; break; }
                        }
                    }
                    if (!isHit && Game.currentBoss) {
                        let boss = Game.currentBoss;
                        if (checkAABB(pRect, { x: boss.x, y: boss.y, w: boss.w, h: boss.h })) isHit = true;
                    }

                    if (isHit) {
                        Game.player.lives--;
                        Game.player.invuln = 120;
                        Game.player.weapon = 'N'; 
                        Game.shake = 15;
                        Game.spawnParticles(Game.player.x + 15, Game.player.y + 20, COLORS.blood, 20, 4);

                        if (Game.player.lives <= 0) {
                            Game.state = 'GAMEOVER';
                            document.getElementById('controls-layer').style.display = 'none';
                            document.getElementById('game-over-menu').classList.add('show');
                            document.getElementById('final-score').innerText = Game.score;
                        }
                    }
                }

                for (let i = 0; i < Game.items.length; i++) {
                    let it = Game.items[i];
                    if (checkAABB(pRect, { x: it.x, y: it.y, w: it.w, h: it.h })) {
                        Game.player.weapon = it.type;
                        let wName = it.type === 'M' ? 'SÚNG MÁY' : (it.type === 'S' ? 'ĐẠN TỎA' : 'LASER');
                        Game.spawnText("NHẶT " + wName, Game.player.x, Game.player.y - 20, '#4ade80');
                        it.active = false;
                    }
                }

                Game.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
                Game.particles = Game.particles.filter(p => p.life > 0);
                Game.texts.forEach(t => t.life--);
                Game.texts = Game.texts.filter(t => t.life > 0);
            },

            draw() {
                ctx.save();
                if (Game.shake > 0) ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);

                let grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
                grad.addColorStop(0, COLORS.skyTop); grad.addColorStop(1, COLORS.skyBot);
                ctx.fillStyle = grad; ctx.fillRect(0, 0, GW, GH);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for(let i=0; i<30; i++) {
                    ctx.fillRect((i * 73) % GW, (i * 91) % GROUND_Y, 2, 2);
                }

                ctx.fillStyle = COLORS.mountBack;
                let offBack = -(Game.bgScroll * 0.15 % 400);
                for(let i=-1; i<3; i++) {
                    ctx.beginPath(); ctx.moveTo(offBack + i*300, GROUND_Y); ctx.lineTo(offBack + i*300 + 150, GROUND_Y - 200); ctx.lineTo(offBack + i*300 + 300, GROUND_Y); ctx.fill();
                }
                
                ctx.fillStyle = COLORS.mountFront;
                let offFront = -(Game.bgScroll * 0.3 % 400);
                for(let i=-1; i<3; i++) {
                    ctx.beginPath(); ctx.moveTo(offFront + i*250, GROUND_Y); ctx.lineTo(offFront + i*250 + 125, GROUND_Y - 120); ctx.lineTo(offFront + i*250 + 250, GROUND_Y); ctx.fill();
                }

                let grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 40);
                grassGrad.addColorStop(0, COLORS.groundTop); grassGrad.addColorStop(1, COLORS.groundBot);
                ctx.fillStyle = grassGrad; ctx.fillRect(0, GROUND_Y, GW, 40);
                
                ctx.fillStyle = '#22c55e'; 
                let grassOffset = -(Game.bgScroll % 40);
                for(let i=0; i<GW+40; i+=40) { ctx.fillRect(grassOffset + i, GROUND_Y, 20, 5); }

                let dirtGrad = ctx.createLinearGradient(0, GROUND_Y + 40, 0, GH);
                dirtGrad.addColorStop(0, COLORS.dirtTop); dirtGrad.addColorStop(1, COLORS.dirtBot);
                ctx.fillStyle = dirtGrad; ctx.fillRect(0, GROUND_Y + 40, GW, GH - (GROUND_Y + 40));

                if (Game.state === 'CUTSCENE') {
                    ctx.save(); ctx.translate(Game.csGirlX, Game.csGirlY);
                    ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(0, 45); ctx.lineTo(30, 45); ctx.fill();
                    ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.arc(15, 10, 10, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#e879f9'; ctx.beginPath(); ctx.arc(15, 8, 12, Math.PI, 0); ctx.fill(); 
                    ctx.restore();

                    ctx.save(); ctx.translate(Game.csDragonX, Game.csDragonY);
                    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(50, 70, 50, 30, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(20, 30, 30, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(120, -20); ctx.lineTo(140, 50); ctx.fill(); 
                    ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 5, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                    Game.player.draw(ctx);
                } 
                else if (Game.state === 'PLAY' || Game.state === 'WIN' || Game.state === 'GAMEOVER') {
                    Game.platforms.forEach(p => p.draw(ctx)); 
                    Game.items.forEach(it => it.draw(ctx));
                    Game.enemies.forEach(e => e.draw(ctx));
                    if (Game.currentBoss) Game.currentBoss.draw(ctx);
                    if (Game.state !== 'GAMEOVER') Game.player.draw(ctx);
                    Game.bullets.forEach(b => b.draw(ctx));
                }

                Game.particles.forEach(p => {
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                Game.texts.forEach(t => {
                    ctx.fillStyle = t.color; ctx.font = 'bold 26px "Pixelify Sans"'; ctx.textAlign = 'center';
                    let ty = t.y - (60 - t.life)*0.8;
                    ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
                    ctx.strokeText(t.txt, t.x, ty);
                    ctx.fillText(t.txt, t.x, ty);
                });

                if (Game.state === 'PLAY' || Game.state === 'WIN') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(0, 0, GW, 60);

                    for (let i = 0; i < 3; i++) {
                        let cx = 35 + i * 35; let cy = 25;
                        ctx.fillStyle = i < Game.player.lives ? '#ef4444' : '#475569';
                        ctx.strokeStyle = i < Game.player.lives ? '#f87171' : '#334155';
                        ctx.lineWidth = 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(cx, cy + 5);
                        ctx.bezierCurveTo(cx - 12, cy - 8, cx - 20, cy + 6, cx, cy + 15);
                        ctx.bezierCurveTo(cx + 20, cy + 6, cx + 12, cy - 8, cx, cy + 5);
                        ctx.fill(); ctx.stroke();
                    }
                    
                    let wpx = 10, wpy = 70;
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(wpx, wpy, 130, 30);
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(wpx, wpy, 130, 30);
                    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 18px "Pixelify Sans"'; ctx.textAlign = 'center';
                    let wName = Game.player.weapon === 'M' ? 'SÚNG MÁY' : (Game.player.weapon === 'S' ? 'ĐẠN TỎA' : (Game.player.weapon === 'L' ? 'LASER' : 'SÚNG LỤC'));
                    ctx.fillText(wName, wpx + 65, wpy + 22);
                    
                    ctx.textAlign = 'right'; ctx.font = 'bold 34px "Pixelify Sans"';
                    ctx.lineWidth = 4; ctx.strokeStyle = 'black';
                    ctx.strokeText("ĐIỂM: " + Game.score, GW - 15, 42);
                    ctx.fillStyle = '#facc15';
                    ctx.fillText("ĐIỂM: " + Game.score, GW - 15, 42);
                }

                ctx.restore();
            },

            loop() {
                Game.update();
                Game.draw();
                requestAnimationFrame(() => Game.loop());
            }
        };

        Game.init();
    </script>
