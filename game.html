
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cứu Vợ - Auto Shoot Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background-color: #020617;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh; 
            width: 100vw; font-family: 'Pixelify Sans', sans-serif;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px;
            background-color: #000;
            overflow: hidden;
        }
        
        @media (min-width: 501px) {
            #game-container { border-radius: 20px; height: 95vh; border: 1px solid #1e293b; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        }

        canvas {
            display: block; width: 100%; height: 100%;
            object-fit: contain; image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .panel {
            background: #0f172a;
            border: 2px solid #fff;
            padding: 30px 20px;
            text-align: center; color: white;
            pointer-events: auto; width: 85%; max-width: 380px;
            display: none;
        }
        .panel.show {
            display: block;
            animation: popIn 0.3s ease-out forwards;
        }

        .game-title { 
            margin: 0 0 15px 0; font-size: 38px; color: #facc15; 
            text-shadow: 2px 2px 0 #b45309; 
            letter-spacing: 2px; text-transform: uppercase;
        }
        .desc { font-size: 18px; margin: 0 0 25px 0; color: #cbd5e1; }
        
        .score-box {
            color: #facc15; font-size: 26px; font-weight: bold;
            margin: 0 auto 30px auto;
        }
        
        .btn {
            padding: 15px 30px; font-family: inherit; font-size: 22px;
            color: white; font-weight: bold; cursor: pointer; letter-spacing: 1px;
            width: 100%; text-transform: uppercase; border: 2px solid #fff;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-primary { background-color: #ef4444; }
        .btn-success { background-color: #10b981; }

        .hint-text {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 18px; font-weight: bold;
            pointer-events: none; text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hint-text" id="hint">CHẠM MÀN HÌNH ĐỂ NHẢY / XOAY VÒNG</div>
        <div id="ui-layer">
            <div id="game-over-menu" class="panel">
                <h1 class="game-title" style="color: #ef4444; text-shadow: 2px 2px 0 #7f1d1d;">GAME OVER</h1>
                <p class="desc">Vợ bạn vẫn đang bị giam giữ!</p>
                <div class="score-box">Điểm của bạn: <span id="final-score">0</span></div>
                <button class="btn btn-primary" onclick="Game.resetGame()">CHƠI LẠI</button>
            </div>

            <div id="victory-menu" class="panel">
                <h1 class="game-title" style="color: #4ade80; text-shadow: 2px 2px 0 #14532d;">THẮNG LỢI!</h1>
                <p class="desc">Anh hùng cứu mỹ nhân thành công! ♥</p>
                <div class="score-box">Điểm của bạn: <span id="win-score">0</span></div>
                <button class="btn btn-success" onclick="Game.resetGame()">CHƠI LẠI</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const container = document.getElementById('game-container');

        const GW = 400; 
        const GH = 700;
        const GROUND_Y = 480; 

        canvas.width = GW;
        canvas.height = GH;

        const COLORS = {
            skyTop: '#0f172a', skyBot: '#1e293b',
            groundTop: '#15803d', groundBot: '#14532d', 
            dirtTop: '#451a03', dirtBot: '#1c0a00',     
            mountBack: '#1e293b', mountFront: '#334155',
            playerSkin: '#fde047', playerShirt: '#ef4444', playerPants: '#2563eb',
            bulletPlayer: '#fef08a', bulletEnemy: '#f43f5e',
            blood: '#dc2626', spark: '#fef08a'
        };

        function checkAABB(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        // ==========================================
        // SỰ KIỆN 1 CHẠM TRÊN TOÀN MÀN HÌNH
        // ==========================================
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (Game.state !== 'PLAY') {
                if (Game.state === 'CUTSCENE' && Game.csPhase > 0) {
                    Game.csTimer += 35; // Tua nhanh Cutscene khi chạm
                }
                return;
            }
            // Chạm bất kỳ đâu cũng nhảy!
            Game.player.doJump();
        });

        // Hỗ trợ cả phím Space/ArrowUp trên máy tính
        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                e.preventDefault();
                if (Game.state === 'PLAY') {
                    Game.player.doJump();
                }
            }
        });

        // ==========================================
        // CÁC ĐỐI TƯỢNG TRONG GAME
        // ==========================================

        class Pet {
            constructor(player) {
                this.player = player;
                this.x = player.x; this.y = player.y - 30;
                this.w = 16; this.h = 16;
                this.cooldown = 0;
            }
            update() {
                let targetX = this.player.x - 25;
                let targetY = this.player.y - 25 + Math.sin(Game.frameCount * 0.1) * 6;
                this.x += (targetX - this.x) * 0.15;
                this.y += (targetY - this.y) * 0.15;
                
                if (this.cooldown > 0) this.cooldown--;
                
                // Pet tự động bắn mục tiêu gần nhất
                if (this.cooldown <= 0 && Game.state === 'PLAY' && Game.frameCount % 60 === 0) {
                    let target = Game.findNearestTarget(this.x, this.y);
                    if (target) {
                        this.cooldown = 30;
                        let dx = target.x + target.w/2 - this.x; 
                        let dy = target.y + target.h/2 - this.y;
                        let dist = Math.hypot(dx, dy) || 1;
                        Game.bullets.push(new Bullet(this.x, this.y, (dx/dist)*12, (dy/dist)*12, 0.5, 10, 3, '#38bdf8', true));
                        Game.spawnParticles(this.x + 8, this.y + 8, '#38bdf8', 4, 1);
                    }
                }
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0ea5e9';
                ctx.beginPath(); ctx.arc(12, 8, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                let bladeW = (Game.frameCount % 4 < 2) ? 20 : 4;
                ctx.fillRect(8 - bladeW/2, -2, bladeW, 2);
                ctx.restore();
            }
        }

        class SupplyBird {
            constructor() {
                this.w = 44; this.h = 24;
                this.x = GW + 50; this.y = Math.random() * 80 + 180; 
                this.vx = -3.5; this.active = true;
            }
            update() {
                this.x += this.vx; this.y += Math.sin(Game.frameCount * 0.1) * 2;
                if (this.x < -100) this.active = false;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = '#b45309'; ctx.fillRect(8, 6, 26, 12);
                ctx.fillStyle = '#fde047'; ctx.fillRect(0, 10, 8, 4);
                let wingY = (Game.frameCount % 16 < 8) ? -10 : 10;
                ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.moveTo(14, 12); ctx.lineTo(24, wingY + 12); ctx.lineTo(34, 12); ctx.fill();
                ctx.fillStyle = '#38bdf8'; ctx.fillRect(16, 20, 10, 10);
                ctx.strokeStyle = 'white'; ctx.strokeRect(16, 20, 10, 10);
                ctx.fillStyle = '#000'; ctx.font = 'bold 16px "Pixelify Sans"'; ctx.textAlign = 'center';
                ctx.fillText("TIẾP TẾ!", this.w/2 + 1, -14);
                ctx.fillStyle = '#38bdf8'; ctx.fillText("TIẾP TẾ!", this.w/2, -15);
                ctx.restore();
            }
        }

        class RainDrop {
            constructor() {
                this.x = Math.random() * (GW + 200);
                this.y = Math.random() * -100;
                this.vy = Math.random() * 8 + 12; this.vx = -3;
                this.len = Math.random() * 10 + 10;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.y > GH) { this.y = -20; this.x = Math.random() * (GW + 200); }
            }
            draw(ctx) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.vx, this.y - this.len); ctx.stroke();
            }
        }

        class Platform {
            constructor(x, y, w) {
                this.x = x; this.y = y; this.w = w; this.h = 16;
                this.vx = -2.2; this.active = true;
            }
            update() {
                this.x += this.vx; if (this.x < -this.w) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = '#334155'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#64748b'; ctx.fillRect(this.x, this.y, this.w, 4);
                ctx.fillStyle = '#eab308';
                for(let i=10; i<this.w-10; i+=20) { ctx.fillRect(this.x + i, this.y, 10, 4); }
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.w, this.h);
            }
        }

        class Player {
            constructor() {
                this.w = 30; this.h = 45;
                this.x = 80; this.y = GROUND_Y - this.h;
                this.vy = 0;
                this.jumpPower = -13.5;
                
                this.isGrounded = true; this.jumpCount = 0;
                this.rollAngle = 0;
                
                this.lives = 3; this.weapon = 'N';
                this.cooldown = 0; this.invuln = 0;
                this.gunAngle = 0;
            }

            update() {
                let prevY = this.y;
                this.vy += 0.8; this.y += this.vy;
                this.isGrounded = false; let onPlatform = false;

                for (let p of Game.platforms) {
                    if (this.vy >= 0 && prevY + this.h <= p.y + 20 && this.x + this.w > p.x && this.x < p.x + p.w) {
                        if (this.y + this.h >= p.y) {
                            this.y = p.y - this.h; this.vy = 0;
                            this.isGrounded = true; this.jumpCount = 0; onPlatform = true; this.x += p.vx; 
                            break;
                        }
                    }
                }
                if (!onPlatform && this.y >= GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h; this.vy = 0; 
                    this.isGrounded = true; this.jumpCount = 0;
                }

                // Giữ vị trí người chơi chạy dọc mượt mà
                if (Game.state === 'PLAY') {
                    if (this.x < 80) this.x += 1.5;
                    if (this.x > 80) this.x -= 1;
                }

                if (this.cooldown > 0) this.cooldown--;
                if (this.invuln > 0) this.invuln--;
                
                // TỰ ĐỘNG DÒ TÌM VÀ BẮN QUÁI VẬT
                if (this.cooldown <= 0 && Game.state === 'PLAY') {
                    let px = this.x + this.w; let py = this.y + 15;
                    let target = Game.findNearestTarget(px, py);
                    
                    if (target) {
                        this.shootAt(target.x + target.w/2, target.y + target.h/2);
                    } else {
                        // Nếu không có quái, tự động bắn thẳng về phía trước để dọn đường
                        this.shootAt(px + 200, py);
                    }
                }
            }

            doJump() {
                if (this.isGrounded || this.jumpCount === 0) {
                    this.vy = this.jumpPower; this.isGrounded = false; this.jumpCount = 1;
                    Game.spawnParticles(this.x + this.w/2, this.y + this.h, ['#e2e8f0', '#cbd5e1'], 6, 3);
                } else if (this.jumpCount === 1) { 
                    this.vy = this.jumpPower * 0.9; this.jumpCount = 2; this.rollAngle = 0; 
                    Game.spawnParticles(this.x + this.w/2, this.y + this.h, ['#60a5fa', '#38bdf8'], 10, 4);
                }
            }

            shootAt(tx, ty) {
                let px = this.x + this.w; let py = this.y + 15;
                let dx = tx - px; let dy = ty - py;
                let dist = Math.hypot(dx, dy) || 1;

                this.gunAngle = Math.atan2(dy, dx); // Xoay tay cầm súng hướng về phía quái

                let isCrit = Math.random() < 0.15;
                let mulDmg = isCrit ? 2.5 : 1; let critColor = isCrit ? '#ef4444' : null;
                
                let speed = 18;
                let vx = (dx/dist) * speed; let vy = (dy/dist) * speed;

                if (this.weapon === 'M') { 
                    this.cooldown = 6;
                    let c = critColor || '#4ade80';
                    let w = isCrit ? 20 : 14; let h = isCrit ? 8 : 4;
                    let spreadY = vy + (Math.random()*2-1);
                    Game.bullets.push(new Bullet(px, py, vx, spreadY, 1 * mulDmg, w, h, c, true));
                } else if (this.weapon === 'S') { 
                    this.cooldown = 16;
                    let c = critColor || '#f97316'; let sz = isCrit ? 16 : 10;
                    let baseAngle = this.gunAngle;
                    for(let i = -1; i <= 1; i++) {
                        let ang = baseAngle + (i * 0.22);
                        Game.bullets.push(new Bullet(px, py, Math.cos(ang)*15, Math.sin(ang)*15, 1 * mulDmg, 12, sz, c, true));
                    }
                } else if (this.weapon === 'L') { 
                    this.cooldown = 22;
                    let c = critColor || '#22d3ee'; let h = isCrit ? 12 : 6;
                    Game.bullets.push(new Bullet(px, py, vx*1.5, vy*1.5, 2 * mulDmg, 45, h, c, true, true));
                } else if (this.weapon === 'F') { 
                    this.cooldown = 14;
                    let c = critColor || '#facc15'; let sz = isCrit ? 22 : 16;
                    Game.bullets.push(new Bullet(px, py, vx * 0.75, vy * 0.75, 2 * mulDmg, sz, sz, c, true, false, true));
                } else { 
                    this.cooldown = 11;
                    let c = critColor || COLORS.bulletPlayer;
                    let w = isCrit ? 18 : 12; let h = isCrit ? 8 : 4;
                    Game.bullets.push(new Bullet(px, py, vx, vy, 1 * mulDmg, w, h, c, true));
                }
                Game.spawnParticles(px, py, isCrit ? '#ef4444' : '#fbbf24', isCrit ? 5 : 2, isCrit ? 3 : 1);
            }

            draw(ctx) {
                if (this.invuln > 0 && this.invuln <= 120 && Game.frameCount % 10 < 5) return;

                if (this.invuln > 120) {
                    ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h/2);
                    ctx.beginPath(); ctx.arc(0, 0, 32 + Math.sin(Game.frameCount*0.2)*4, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.25)'; ctx.fill();
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                    ctx.rotate(Game.frameCount * 0.05); ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                if (this.jumpCount === 2) {
                    this.rollAngle += 0.45;
                    ctx.translate(this.x + this.w/2, this.y + this.h/2);
                    ctx.rotate(this.rollAngle);
                    ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));
                }

                ctx.translate(this.x, this.y);
                
                let walkOffset = 0;
                if (Game.state === 'CUTSCENE' && Game.csPhase === 0) walkOffset = Math.sin(Game.frameCount * 0.6) * 6;
                else walkOffset = (this.isGrounded && Game.state === 'PLAY') ? Math.sin(Game.frameCount * 0.6) * 6 : 0;
                
                // Vẽ thân dưới và chân
                ctx.fillStyle = COLORS.playerPants; ctx.fillRect(4 + walkOffset, 30, 8, 15); ctx.fillRect(18 - walkOffset, 30, 8, 15);
                // Vẽ áo
                ctx.fillStyle = COLORS.playerShirt; ctx.fillRect(5, 15, 20, 18);
                // Đầu
                ctx.fillStyle = COLORS.playerSkin; ctx.beginPath(); ctx.arc(15, 8, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#b91c1c'; ctx.fillRect(3, 2, 24, 4); // Băng đô đỏ
                ctx.fillStyle = 'black'; ctx.fillRect(18, 5, 3, 3); // Mắt
                
                // Cánh tay cầm súng (xoay mượt theo hướng ngắm quái hiện tại)
                ctx.save();
                ctx.translate(15, 21);
                ctx.rotate(this.gunAngle);
                let recoil = this.cooldown > Math.max(0, this.cooldown - 4) ? -3 : 0;
                ctx.fillStyle = '#475569';
                ctx.fillRect(recoil, -3, 22, 6);
                ctx.restore();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, damage, w, h, color, isPlayer, isPiercing = false, hasGravity = false) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.damage = damage; this.w = w; this.h = h;
                this.color = color; this.isPlayer = isPlayer;
                this.isPiercing = isPiercing; this.hasGravity = hasGravity;
                this.bounces = 0; this.active = true;
                this.angle = Math.atan2(vy, vx);
            }
            update() {
                if (this.hasGravity) {
                    this.vy += 0.4;
                    this.angle = Math.atan2(this.vy, this.vx);
                }
                this.x += this.vx; this.y += this.vy;
                
                if (this.hasGravity && this.y > GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h; this.vy = -6; this.bounces++;
                    if (this.bounces > 2) this.active = false;
                }
                if (this.x < -100 || this.x > GW + 100 || this.y < -100 || this.y > GH + 100) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                ctx.rotate(this.angle);

                ctx.fillStyle = this.color;
                if (this.hasGravity) {
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath(); ctx.arc(0, 0, this.w/2 + 4, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                    ctx.beginPath(); ctx.arc(0, 0, this.w/2, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 0, this.w/4, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(-this.w/2 - 2, -this.h/2 - 2, this.w + 4, this.h + 4);
                    ctx.globalAlpha = 1.0;
                    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.fillRect(-this.w/2 + 1, -this.h/2 + 1, this.w - 2, this.h - 2);
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type, dir = 1) {
                this.type = type; this.active = true; this.dir = dir; 
                this.x = dir === 1 ? GW + 20 : -40; this.flash = 0;
                
                if (type === 'soldier') {
                    this.y = GROUND_Y - 30; this.w = 20; this.h = 30;
                    this.hp = 2; this.score = 5; 
                    this.vx = (-2 - Math.random()) * dir;
                    this.shootTimer = Math.floor(Math.random() * 60 + 50);
                } else if (type === 'plane') {
                    this.y = Math.random() * 80 + 280; this.w = 40; this.h = 25;
                    this.hp = 3; this.score = 10; 
                    this.vx = (-3 - Math.random()*2) * dir; this.baseY = this.y;
                } else if (type === 'drone') {
                    this.y = Math.random() * 50 + 150; this.w = 30; this.h = 20;
                    this.hp = 4; this.score = 15;
                    this.vx = (-2 - Math.random()) * dir;
                    this.shootTimer = Math.floor(Math.random() * 50 + 50);
                }
            }
            update() {
                this.x += this.vx;
                if (this.type === 'plane') { this.y = this.baseY + Math.sin(Game.frameCount * 0.05) * 30; } 
                else if (this.type === 'soldier') {
                    this.shootTimer--;
                    if (this.shootTimer <= 0) {
                        let px = this.dir === 1 ? this.x - 10 : this.x + this.w;
                        Game.bullets.push(new Bullet(px, this.y + 10, -5.5 * this.dir, 0, 1, 10, 4, '#f59e0b', false));
                        this.shootTimer = Math.floor(Math.random() * 60 + 70); 
                    }
                } else if (this.type === 'drone') {
                    this.shootTimer--;
                    if (this.shootTimer <= 0) {
                        Game.bullets.push(new Bullet(this.x + this.w/2, this.y + this.h, 0, 2.5, 1, 14, 14, '#ef4444', false, false, true));
                        this.shootTimer = Math.floor(Math.random() * 80 + 70);
                    }
                }
                if (this.dir === 1 && this.x < -100) this.active = false;
                if (this.dir === -1 && this.x > GW + 100) this.active = false;
                if (this.flash > 0) this.flash--;
            }
            draw(ctx) {
                ctx.save(); 
                if (this.dir === -1) { ctx.translate(this.x + this.w, this.y); ctx.scale(-1, 1); } 
                else { ctx.translate(this.x, this.y); }
                
                if (this.flash > 0) {
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, this.w, this.h);
                } else {
                    if (this.type === 'soldier') {
                        ctx.fillStyle = '#65a30d'; ctx.fillRect(0, 10, 20, 20); 
                        ctx.fillStyle = '#fcd34d'; ctx.fillRect(4, 0, 12, 12); 
                        ctx.fillStyle = 'black'; ctx.fillRect(2, 4, 3, 3); 
                    } else if (this.type === 'plane') {
                        ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.ellipse(20, 12, 20, 12, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ef4444'; ctx.fillRect(5, 5, 15, 8); 
                        let rH = (Game.frameCount % 4 < 2) ? 25 : 8; let rY = (Game.frameCount % 4 < 2) ? 0 : 8;
                        ctx.fillStyle = '#334155'; ctx.fillRect(30, rY, 8, rH); 
                    } else if (this.type === 'drone') {
                        ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(30, 10); ctx.lineTo(15, 20); ctx.lineTo(0, 10); ctx.fill();
                        ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(15, 10, 6, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                        let rw = (Game.frameCount % 2 === 0) ? 30 : 10; ctx.fillRect(15 - rw/2, -5, rw, 3);
                    }
                }
                ctx.restore();
            }
        }

        class Boss {
            constructor(type) {
                this.type = type; this.active = true;
                this.x = GW + 100; this.state = 'enter'; this.timer = 0; this.flash = 0;
                
                if (type === 'tank') {
                    this.w = 140; this.h = 110; this.y = GROUND_Y - this.h;
                    this.hp = 250; this.maxHp = 250; this.score = 100;
                } else if (type === 'heli') {
                    this.w = 100; this.h = 60; this.y = 280; this.baseY = 280;
                    this.hp = 400; this.maxHp = 400; this.score = 200;
                } else if (type === 'dragon') {
                    this.w = 100; this.h = 100; this.y = 260; this.baseY = 260;
                    this.hp = 800; this.maxHp = 800; this.score = 500;
                }
            }
            update() {
                this.timer++;
                if (this.flash > 0) this.flash--;

                if (this.state === 'enter') {
                    this.x -= 2; if (this.x <= GW - this.w - 20) this.state = 'attack';
                } else if (this.state === 'attack') {
                    if (this.timer % 90 === 0) Game.platforms.push(new Platform(GW + 50, GROUND_Y - 70, 90));

                    if (this.type === 'tank') {
                        if (this.timer % 80 === 0) { 
                            Game.bullets.push(new Bullet(this.x - 20, this.y + 25, -7, -4, 1, 20, 20, '#ef4444', false, false, true));
                            Game.shake = 6;
                        }
                        if (this.timer % 100 > 70 && this.timer % 10 === 0) { 
                            Game.bullets.push(new Bullet(this.x - 10, this.y + 85, -8, 0, 1, 10, 4, '#f59e0b', false));
                        }
                    } else if (this.type === 'heli') {
                        this.y = this.baseY + Math.sin(this.timer * 0.04) * 40; 
                        if (this.timer % 200 > 150 && this.timer % 5 === 0) {
                             Game.bullets.push(new Bullet(this.x + 20, this.y + this.h, -4 - Math.random()*2, 6, 1, 8, 8, '#22d3ee', false));
                        } else if (this.timer % 60 === 0) { 
                            let dx = (Game.player.x + Game.player.w/2) - (this.x); let dy = (Game.player.y + Game.player.h/2) - (this.y + this.h);
                            let dist = Math.hypot(dx, dy);
                            Game.bullets.push(new Bullet(this.x, this.y + this.h, (dx/dist)*6, (dy/dist)*6, 1, 12, 12, '#a855f7', false));
                        }
                        if (this.timer % 150 === 0) {
                            let d = new Enemy('drone', 1); d.x = this.x; d.y = this.y + this.h;
                            Game.enemies.push(d);
                        }
                    } else if (this.type === 'dragon') {
                        this.y = this.baseY + Math.sin(this.timer * 0.05) * 60; 
                        if (this.timer % 120 > 80 && this.timer % 5 === 0) {
                             Game.bullets.push(new Bullet(this.x, this.y + 40, -8 - Math.random()*3, Math.random()*4 - 1, 1, 14, 14, '#ef4444', false));
                             Game.spawnParticles(this.x, this.y+40, '#f97316', 3, 4);
                        } else if (this.timer % 60 === 0) { 
                            for(let i=-4; i<=4; i+=4) Game.bullets.push(new Bullet(this.x, this.y + 40, -6, i, 1, 16, 16, '#facc15', false));
                        }
                        if (this.timer % 300 === 0) { 
                            this.state = 'dash'; Game.spawnText("RỒNG CUỒNG NỘ!", GW/2, GH/2, '#ef4444', 60);
                        }
                    }
                } else if (this.state === 'dash') {
                    this.x -= 18;
                    if (this.x < -this.w) { this.x = GW + 50; this.state = 'enter'; }
                }
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.flash > 0) {
                    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, this.w, this.h);
                } else {
                    if (this.type === 'tank') {
                        ctx.fillStyle = '#475569'; ctx.fillRect(0, 50, this.w, 60); 
                        ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.arc(this.w/2, 50, 50, Math.PI, 0); ctx.fill(); 
                        ctx.fillStyle = '#1e293b'; ctx.fillRect(-30, 25, 70, 15); ctx.fillRect(-10, 80, 20, 8); 
                    } else if (this.type === 'heli') {
                        ctx.fillStyle = '#0f766e'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-20, this.h/2 - 5, 20, 10); 
                        ctx.fillStyle = '#94a3b8'; ctx.fillRect(this.w/2 - 5, -10, 10, 10); 
                        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(this.w/2 - 40, -10, 80, 2); 
                    } else if (this.type === 'dragon') {
                        ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2 + 20, this.w/2, this.h/2-20, 0, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(20, 30, 30, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(this.w/2, this.h/2); ctx.lineTo(this.w + 20, -20); ctx.lineTo(this.w + 40, this.h/2); ctx.fill(); 
                        ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 5, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                    }
                }
                if (this.state !== 'enter') {
                    let hpRatio = Math.max(0, this.hp/this.maxHp);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, -25, this.w, 12);
                    ctx.fillStyle = hpRatio > 0.4 ? '#22c55e' : (hpRatio > 0.2 ? '#eab308' : '#ef4444'); 
                    ctx.fillRect(1, -24, (this.w - 2) * hpRatio, 10);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(0, -25, this.w, 12);
                }
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.w = 30; this.h = 30;
                this.type = type; this.active = true; this.vy = -5;
            }
            update() {
                this.x -= 2; this.vy += 0.4; this.y += this.vy;
                if (this.y > GROUND_Y - 40) { this.y = GROUND_Y - 40; this.vy = -6; }
                if (this.x < -50) this.active = false;
            }
            draw(ctx) {
                ctx.fillStyle = 'rgba(250, 204, 21, 0.4)'; ctx.fillRect(this.x - 4, this.y - 4, this.w + 8, this.h + 8);
                ctx.fillStyle = '#b45309'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#78350f'; 
                ctx.fillRect(this.x, this.y, this.w, 4); ctx.fillRect(this.x, this.y + this.h - 4, this.w, 4);
                ctx.fillRect(this.x, this.y, 4, this.h); ctx.fillRect(this.x + this.w - 4, this.y, 4, this.h);
                
                ctx.fillStyle = '#000'; ctx.font = 'bold 22px "Pixelify Sans"'; ctx.textAlign = 'center';
                ctx.fillText(this.type, this.x + this.w/2 + 2, this.y + 26);
                ctx.fillStyle = '#fef08a'; ctx.fillText(this.type, this.x + this.w/2, this.y + 24);
            }
        }

        const Game = {
            state: 'CUTSCENE',
            frameCount: 0, score: 0, bgScroll: 0, shake: 0,
            
            player: null, pet: null, bullets: [], enemies: [], items: [], particles: [], texts: [], platforms: [],
            birds: [], raindrops: [], weather: 'clear',
            currentBoss: null,
            bossStages: [
                { score: 100, type: 'tank', done: false },
                { score: 300, type: 'heli', done: false },
                { score: 1000, type: 'dragon', done: false }
            ],

            csPhase: 0, csTimer: 0, csGirlX: 0, csGirlY: 0, csDragonX: 0, csDragonY: 0,

            init() { 
                this.startCutscene();
                requestAnimationFrame(() => this.loop()); 
            },

            // Thuật toán dò tìm mục tiêu tối ưu để auto bắn
            findNearestTarget(fromX, fromY) {
                let target = null;
                let minDist = 380; // Tầm bắn xa tối đa để tránh bắn quá tầm màn hình

                // 1. Dò tìm boss
                if (this.currentBoss && this.currentBoss.state !== 'enter') {
                    let d = Math.hypot((this.currentBoss.x + this.currentBoss.w/2) - fromX, (this.currentBoss.y + this.currentBoss.h/2) - fromY);
                    if (d < minDist) {
                        minDist = d;
                        target = this.currentBoss;
                    }
                }

                // 2. Dò tìm lính/quái
                for (let e of this.enemies) {
                    if (e.x > 0 && e.x < GW + 50) { // Chỉ ngắm quái đang ở trên màn hình
                        let d = Math.hypot((e.x + e.w/2) - fromX, (e.y + e.h/2) - fromY);
                        if (d < minDist) {
                            minDist = d;
                            target = e;
                        }
                    }
                }

                // 3. Dò tìm chim tiếp tế
                for (let b of this.birds) {
                    if (b.x > 0 && b.x < GW + 50) {
                        let d = Math.hypot((b.x + b.w/2) - fromX, (b.y + b.h/2) - fromY);
                        if (d < minDist) {
                            minDist = d;
                            target = b;
                        }
                    }
                }

                // 4. Dò tìm hộp đạn (để tự bắn tự ăn vật phẩm)
                for (let it of this.items) {
                    if (it.x > 0 && it.x < GW + 50) {
                        let d = Math.hypot((it.x + it.w/2) - fromX, (it.y + it.h/2) - fromY);
                        if (d < minDist) {
                            minDist = d;
                            target = it;
                        }
                    }
                }

                return target;
            },

            startCutscene() {
                document.getElementById('hint').style.display = 'none';
                this.state = 'CUTSCENE'; this.csPhase = 0; this.csTimer = 0;
                this.player = new Player(); this.player.x = -50; 
                this.csGirlX = GW/2 + 30; this.csGirlY = GROUND_Y - 45; 
                this.csDragonX = GW + 50; this.csDragonY = -150; 
                this.texts = []; this.items = []; this.platforms = []; this.birds = []; this.raindrops = [];
                this.weather = 'clear';
            },

            startGame() {
                document.getElementById('hint').style.display = 'block';
                this.state = 'PLAY'; this.score = 0; this.frameCount = 0;
                this.bullets = []; this.enemies = []; this.particles = []; this.texts = []; this.platforms = [];
                this.birds = []; this.raindrops = []; this.weather = 'clear';
                this.items = []; this.items.push(new Item(250, GROUND_Y - 30, 'M'));
                
                this.currentBoss = null; this.bossStages.forEach(b => b.done = false);
                this.player = new Player(); this.pet = new Pet(this.player); 

                this.spawnText("CHẠM BẤT KỲ ĐÂU ĐỂ NÉ!", GW/2, GH/2 + 50, '#4ade80', 160);
                setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 6000);
            },

            resetGame() {
                document.getElementById('game-over-menu').classList.remove('show');
                document.getElementById('victory-menu').classList.remove('show');
                this.startGame();
            },

            spawnParticles(x, y, color, count, size) {
                let maxP = (window.innerWidth < 600) ? Math.min(count, 10) : count;
                for(let i=0; i<maxP; i++) {
                    let col = Array.isArray(color) ? color[Math.floor(Math.random()*color.length)] : color;
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 2,
                        life: 1.0, color: col, size: Math.random() * size + size
                    });
                }
            },

            spawnText(txt, x, y, color, life = 60) {
                this.texts.push({ txt, x, y, life: life, maxLife: life, color });
            },

            update() {
                this.frameCount++;
                if (this.shake > 0) this.shake--;

                if (this.weather === 'rain') {
                    if (this.raindrops.length < 80) this.raindrops.push(new RainDrop());
                    this.raindrops.forEach(r => r.update());
                }

                if (this.state === 'CUTSCENE') {
                    this.csTimer++;
                    if (this.csPhase === 0) {
                        this.player.x += 2.5;
                        if (this.player.x >= GW/2 - 50) { this.player.x = GW/2 - 50; this.csPhase = 1; this.csTimer = 0; }
                    } else if (this.csPhase === 1) {
                        if (this.csTimer === 20) this.spawnText("Làm vợ anh nhé!", this.player.x + 15, this.player.y - 20, 'white');
                        if (this.csTimer === 90) this.spawnText("Vâng! ♥", this.csGirlX + 15, this.csGirlY - 20, '#f472b6');
                        if (this.csTimer === 170) { this.csPhase = 2; this.csTimer = 0; }
                    } else if (this.csPhase === 2) {
                        let targetX = this.csGirlX - 40; let targetY = this.csGirlY - 60;
                        let dx = targetX - this.csDragonX; let dy = targetY - this.csDragonY;
                        let dist = Math.hypot(dx, dy);
                        if (dist < 12) {
                            this.csDragonX = targetX; this.csDragonY = targetY; this.shake = 30; 
                            this.spawnParticles(this.csDragonX + 50, GROUND_Y, '#475569', 25, 4); 
                            this.spawnText("CỨU EM!!!", this.csGirlX + 15, this.csGirlY - 30, '#ef4444');
                            this.csPhase = 3; this.csTimer = 0;
                        } else {
                            this.csDragonX += (dx / dist) * 11; this.csDragonY += (dy / dist) * 11;
                        }
                    } else if (this.csPhase === 3) {
                        if (this.csTimer > 25) { 
                            this.csDragonX += 5; this.csDragonY -= 6;
                            this.csGirlX = this.csDragonX + 20; this.csGirlY = this.csDragonY + 60;
                        }
                        if (this.csTimer === 70) this.spawnText("ĐỨNG LẠI TÊN KIA!", this.player.x + 15, this.player.y - 20, 'red');
                        if (this.csDragonY < -150) { this.csPhase = 4; this.csTimer = 0; }
                    } else if (this.csPhase === 4) {
                        if (this.csTimer > 30) this.startGame();
                    }
                    
                    this.items.forEach(it => it.update());
                    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
                    this.particles = this.particles.filter(p => p.life > 0);
                    this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
                    return; 
                }

                if (this.state === 'WIN') return;
                if (this.state !== 'PLAY') return;

                this.bgScroll += 2.2; // Tốc độ chạy nhanh hơn kích thích cảm giác né tránh kịch tính
                this.player.update();
                this.pet.update(); 

                if (this.frameCount > 0 && this.frameCount % 900 === 0) this.birds.push(new SupplyBird());
                this.birds.forEach(b => b.update()); this.birds = this.birds.filter(b => b.active);

                if (!this.currentBoss && this.frameCount % 120 === 0 && Math.random() > 0.3) {
                    this.platforms.push(new Platform(GW + 50, GROUND_Y - 60 - Math.random() * 40, 90 + Math.random()*40));
                }
                this.platforms.forEach(p => p.update()); this.platforms = this.platforms.filter(p => p.active);

                if (!this.currentBoss) {
                    if (this.frameCount % 10 === 0) this.score++; 
                    
                    let nextBoss = this.bossStages.find(b => !b.done && this.score >= b.score);
                    if (nextBoss) {
                        this.currentBoss = new Boss(nextBoss.type);
                        this.spawnText("CẢNH BÁO BOSS!", GW/2, GH/2, '#ef4444');
                        this.shake = 20;
                        if (nextBoss.type === 'heli' || nextBoss.type === 'dragon') this.weather = 'rain';
                    } else {
                        this.weather = 'clear'; this.raindrops = [];
                        let spawnRate = Math.max(30, 80 - Math.floor(this.score/5));
                        if (this.frameCount % spawnRate === 0) {
                            let typeRnd = Math.random();
                            let type = typeRnd > 0.8 ? 'drone' : (typeRnd > 0.4 ? 'plane' : 'soldier');
                            this.enemies.push(new Enemy(type, Math.random() > 0.6 ? 1 : -1));
                        }
                        if (this.frameCount % 250 === 0 && Math.random() > 0.3) {
                            let types = ['M', 'S', 'L', 'F'];
                            this.items.push(new Item(GW, -50, types[Math.floor(Math.random()*types.length)]));
                        }
                    }
                } else {
                    this.currentBoss.update();
                    if (!this.currentBoss.active) {
                        let bStage = this.bossStages.find(b => b.type === this.currentBoss.type);
                        if (bStage) bStage.done = true;
                        
                        if (this.currentBoss.type === 'dragon') {
                            this.state = 'WIN';
                            document.getElementById('victory-menu').classList.add('show');
                            document.getElementById('win-score').innerText = this.score;
                            this.spawnParticles(GW/2, GH/2, ['#facc15', '#f472b6', '#38bdf8'], 150, 6);
                        }
                        this.currentBoss = null; this.weather = 'clear'; 
                    }
                }

                this.bullets.forEach(b => b.update()); this.bullets = this.bullets.filter(b => b.active);
                this.enemies.forEach(e => e.update()); this.enemies = this.enemies.filter(e => e.active);
                this.items.forEach(i => i.update()); this.items = this.items.filter(i => i.active);

                // Kiểm tra va chạm đạn của người chơi với quái và vật phẩm
                for (let i = 0; i < this.bullets.length; i++) {
                    let b = this.bullets[i];
                    if (!b.isPlayer || !b.active) continue;
                    let bRect = { x: b.x, y: b.y, w: b.w, h: b.h };
                    let hitSomething = false;

                    // 1. Trúng Boss
                    if (this.currentBoss && this.currentBoss.state !== 'enter') {
                        let boss = this.currentBoss;
                        if (checkAABB(bRect, { x: boss.x, y: boss.y, w: boss.w, h: boss.h })) {
                            boss.hp -= b.damage; boss.flash = 3; hitSomething = true;
                            this.spawnParticles(b.x, b.y, b.damage >= 2 ? '#ef4444' : COLORS.spark, 4, b.damage >= 2 ? 3 : 2);
                            if (boss.hp <= 0) {
                                this.score += boss.score; boss.active = false; this.shake = 30;
                                this.spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, ['#ef4444', '#facc15'], 80, 6);
                            }
                        }
                    }

                    // 2. Trúng lính
                    if (!hitSomething) {
                        for (let j = 0; j < this.enemies.length; j++) {
                            let e = this.enemies[j];
                            if (checkAABB(bRect, { x: e.x, y: e.y, w: e.w, h: e.h })) {
                                e.hp -= b.damage; e.flash = 3; hitSomething = true;
                                this.spawnParticles(b.x, b.y, b.damage >= 2 ? '#ef4444' : COLORS.spark, 3, 2);
                                if (e.hp <= 0) {
                                    this.score += e.score; e.active = false;
                                    this.spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef4444', 10, 3);
                                }
                                break;
                            }
                        }
                    }
                    
                    // 3. Đạn bắn trúng chim (Tự ăn khiên)
                    if (!hitSomething) {
                        for (let j = 0; j < this.birds.length; j++) {
                            let bird = this.birds[j];
                            if (checkAABB(bRect, { x: bird.x, y: bird.y, w: bird.w, h: bird.h })) {
                                this.player.invuln = 1800; 
                                this.spawnText("KHIÊN ÁNH SÁNG 30S!", this.player.x, this.player.y - 40, '#38bdf8', 120);
                                this.shake = 10;
                                this.spawnParticles(bird.x + 20, bird.y + 10, ['#38bdf8', '#ffffff'], 40, 6);
                                bird.active = false; hitSomething = true; break;
                            }
                        }
                    }

                    // 4. Đạn bắn trúng Hộp Đạn (Tự nâng cấp vũ khí)
                    if (!hitSomething) {
                        for (let j = 0; j < this.items.length; j++) {
                            let it = this.items[j];
                            if (checkAABB(bRect, { x: it.x, y: it.y, w: it.w, h: it.h })) {
                                this.player.weapon = it.type;
                                let wName = it.type === 'M' ? 'SÚNG MÁY' : (it.type === 'S' ? 'ĐẠN TỎA' : (it.type === 'L' ? 'LASER' : 'ĐẠN LỬA'));
                                this.spawnText("TRANG BỊ " + wName, this.player.x, this.player.y - 20, '#4ade80');
                                this.shake = 3; this.spawnParticles(it.x + 15, it.y + 15, '#facc15', 20, 4);
                                it.active = false; hitSomething = true; break;
                            }
                        }
                    }

                    if (hitSomething && !b.isPiercing) b.active = false;
                }

                // Va chạm trực tiếp giữa Người chơi với Chướng ngại vật / Quái vật / Đạn địch
                let pRect = { x: this.player.x + 5, y: this.player.y + 5, w: this.player.w - 10, h: this.player.h - 10 };
                
                // Người chơi chạm trực tiếp ăn hộp đạn (phòng hờ)
                for (let it of this.items) {
                    if (checkAABB(pRect, { x: it.x, y: it.y, w: it.w, h: it.h })) {
                        this.player.weapon = it.type;
                        let wName = it.type === 'M' ? 'SÚNG MÁY' : (it.type === 'S' ? 'ĐẠN TỎA' : (it.type === 'L' ? 'LASER' : 'ĐẠN LỬA'));
                        this.spawnText("TRANG BỊ " + wName, this.player.x, this.player.y - 20, '#4ade80');
                        this.shake = 3; this.spawnParticles(it.x + 15, it.y + 15, '#facc15', 20, 4);
                        it.active = false;
                    }
                }

                if (this.player.invuln <= 0) {
                    let isHit = false;
                    for (let b of this.bullets) {
                        if (!b.isPlayer && b.active && checkAABB(pRect, { x: b.x, y: b.y, w: b.w, h: b.h })) {
                            isHit = true; b.active = false; break;
                        }
                    }
                    if (!isHit) {
                        for (let e of this.enemies) {
                            if (checkAABB(pRect, { x: e.x, y: e.y, w: e.w, h: e.h })) { isHit = true; break; }
                        }
                    }
                    if (!isHit && this.currentBoss) {
                        let boss = this.currentBoss;
                        if (checkAABB(pRect, { x: boss.x, y: boss.y, w: boss.w, h: boss.h })) isHit = true;
                    }

                    if (isHit) {
                        this.player.lives--; this.player.invuln = 120; this.player.weapon = 'N'; 
                        this.shake = 15; this.spawnParticles(this.player.x + 15, this.player.y + 20, COLORS.blood, 20, 4);

                        if (this.player.lives <= 0) {
                            this.state = 'GAMEOVER';
                            document.getElementById('game-over-menu').classList.add('show');
                            document.getElementById('final-score').innerText = this.score;
                        }
                    }
                }

                this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
                this.particles = this.particles.filter(p => p.life > 0);
                this.texts.forEach(t => t.life--); this.texts = this.texts.filter(t => t.life > 0);
            },

            draw() {
                ctx.save();
                if (this.shake > 0) ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);

                let grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
                let sTop = this.weather === 'rain' ? '#020617' : COLORS.skyTop;
                let sBot = this.weather === 'rain' ? '#0f172a' : COLORS.skyBot;
                grad.addColorStop(0, sTop); grad.addColorStop(1, sBot);
                ctx.fillStyle = grad; ctx.fillRect(0, 0, GW, GH);

                if (this.weather === 'clear') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 50, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 35, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(GW - 80, 120, 20, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.05)'; ctx.beginPath(); ctx.arc(GW - 80, 120, 50, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(GW - 80, 120, 20, 0, Math.PI*2); ctx.fill();
                }

                ctx.fillStyle = this.weather === 'rain' ? 'rgba(51, 65, 85, 0.4)' : 'rgba(255, 255, 255, 0.15)';
                for(let i=0; i<4; i++) {
                    let cx = (GW + 200 - ((this.bgScroll * 0.2) + i * 150) % (GW + 300)) - 50;
                    let cy = 60 + (i % 2) * 50;
                    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 20, cy - 15, 30, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 40, cy, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(cx, cy - 5, 40, 25); 
                }

                if (this.weather === 'clear') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    for(let i=0; i<30; i++) { ctx.fillRect((i * 73 - this.bgScroll * 0.05) % GW, (i * 91) % (GROUND_Y - 150), 2, 2); }
                }

                ctx.fillStyle = this.weather === 'rain' ? '#0f172a' : COLORS.mountBack;
                let offBack = -(this.bgScroll * 0.15 % 400);
                for(let i=-1; i<3; i++) {
                    ctx.beginPath(); ctx.moveTo(offBack + i*300, GROUND_Y); ctx.lineTo(offBack + i*300 + 150, GROUND_Y - 200); ctx.lineTo(offBack + i*300 + 300, GROUND_Y); ctx.fill();
                }
                
                ctx.fillStyle = this.weather === 'rain' ? '#1e293b' : COLORS.mountFront;
                let offFront = -(this.bgScroll * 0.3 % 400);
                for(let i=-1; i<3; i++) {
                    ctx.beginPath(); ctx.moveTo(offFront + i*250, GROUND_Y); ctx.lineTo(offFront + i*250 + 125, GROUND_Y - 120); ctx.lineTo(offFront + i*250 + 250, GROUND_Y); ctx.fill();
                }

                let grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 40);
                grassGrad.addColorStop(0, COLORS.groundTop); grassGrad.addColorStop(1, COLORS.groundBot);
                ctx.fillStyle = grassGrad; ctx.fillRect(0, GROUND_Y, GW, 40);
                
                ctx.fillStyle = '#22c55e'; 
                let grassOffset = -(this.bgScroll % 40);
                for(let i=0; i<GW+40; i+=40) { ctx.fillRect(grassOffset + i, GROUND_Y, 20, 5); }

                let dirtGrad = ctx.createLinearGradient(0, GROUND_Y + 40, 0, GH);
                dirtGrad.addColorStop(0, COLORS.dirtTop); dirtGrad.addColorStop(1, COLORS.dirtBot);
                ctx.fillStyle = dirtGrad; ctx.fillRect(0, GROUND_Y + 40, GW, GH - (GROUND_Y + 40));

                if (this.state === 'CUTSCENE') {
                    ctx.save(); ctx.translate(this.csGirlX, this.csGirlY);
                    ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(0, 45); ctx.lineTo(30, 45); ctx.fill();
                    ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.arc(15, 10, 10, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#e879f9'; ctx.beginPath(); ctx.arc(15, 8, 12, Math.PI, 0); ctx.fill(); 
                    ctx.restore();

                    ctx.save(); ctx.translate(this.csDragonX, this.csDragonY);
                    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(50, 70, 50, 30, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(20, 30, 30, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(120, -20); ctx.lineTo(140, 50); ctx.fill(); 
                    ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(10, 20, 5, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, 20, 2, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                    this.player.draw(ctx);
                } 
                else if (this.state === 'PLAY' || this.state === 'WIN' || this.state === 'GAMEOVER') {
                    this.platforms.forEach(p => p.draw(ctx)); 
                    this.items.forEach(it => it.draw(ctx));
                    this.birds.forEach(b => b.draw(ctx)); 
                    this.enemies.forEach(e => e.draw(ctx));
                    
                    if (this.state !== 'GAMEOVER') {
                        this.player.draw(ctx);
                        if(this.pet) this.pet.draw(ctx);
                    }
                    if (this.currentBoss) this.currentBoss.draw(ctx);
                    this.bullets.forEach(b => b.draw(ctx));
                    
                    if (this.weather === 'rain') {
                        this.raindrops.forEach(r => r.draw(ctx));
                    }
                }

                this.particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                this.texts.forEach(t => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
                    ctx.fillStyle = t.color; ctx.font = 'bold 26px "Pixelify Sans"'; ctx.textAlign = 'center';
                    let ty = t.y - (t.maxLife - t.life)*0.5;
                    ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
                    ctx.strokeText(t.txt, t.x, ty); ctx.fillText(t.txt, t.x, ty);
                    ctx.restore();
                });

                if (this.state === 'PLAY' || this.state === 'WIN') {
                    // Trái tim góc Trái trên cùng
                    for (let i = 0; i < 3; i++) {
                        let cx = 35 + i * 32; let cy = 25;
                        ctx.fillStyle = i < this.player.lives ? '#ef4444' : '#475569';
                        ctx.beginPath();
                        ctx.moveTo(cx, cy + 5);
                        ctx.bezierCurveTo(cx - 12, cy - 8, cx - 20, cy + 6, cx, cy + 15);
                        ctx.bezierCurveTo(cx + 20, cy + 6, cx + 12, cy - 8, cx, cy + 5);
                        ctx.fill();
                    }
                    
                    let wpx = 15, wpy = 55;
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(wpx, wpy, 120, 26);
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(wpx, wpy, 120, 26);
                    
                    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 16px "Pixelify Sans"'; 
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    let wName = this.player.weapon === 'M' ? 'SÚNG MÁY' : (this.player.weapon === 'S' ? 'ĐẠN TỎA' : (this.player.weapon === 'L' ? 'LASER' : (this.player.weapon === 'F' ? 'ĐẠN LỬA' : 'SÚNG LỤC')));
                    ctx.fillText(wName, wpx + 60, wpy + 14);
                    
                    ctx.textAlign = 'right'; ctx.textBaseline = 'top'; 
                    ctx.font = 'bold 32px "Pixelify Sans"';
                    ctx.fillStyle = '#000'; ctx.fillText("ĐIỂM: " + this.score, GW - 12, 18);
                    ctx.fillStyle = '#facc15'; ctx.fillText("ĐIỂM: " + this.score, GW - 15, 15);

                    if (this.player.invuln > 120) {
                        let secs = Math.ceil((this.player.invuln - 120) / 60);
                        ctx.textAlign = 'center'; ctx.font = 'bold 24px "Pixelify Sans"';
                        ctx.fillStyle = '#000'; ctx.fillText("BẢO VỆ: " + secs + "s", GW/2 + 2, 52);
                        ctx.fillStyle = '#38bdf8'; ctx.fillText("BẢO VỆ: " + secs + "s", GW/2, 50);
                    }
                }

                ctx.restore();
            },

            loop() {
                this.update(); this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        Game.init();
    </script>
</body>
</html>
