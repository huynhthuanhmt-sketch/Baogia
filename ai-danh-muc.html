    <script data-thuanstore-inline="i18n.js">
(() => {
    const STORAGE_KEY = 'thuanstore_app_lang_v1';
    const normalize = value => value === 'en' ? 'en' : 'vi';

    const readStored = () => {
        try {
            return localStorage.getItem(STORAGE_KEY);
        } catch (error) {
            return null;
        }
    };

    const readInitial = () => {
        const query = new URLSearchParams(window.location.search).get('lang');
        if (query === 'vi' || query === 'en') return query;
        const stored = readStored();
        if (stored === 'vi' || stored === 'en') return stored;
        return navigator.language && navigator.language.toLowerCase().startsWith('en') ? 'en' : 'vi';
    };

    let currentLanguage = normalize(readInitial());
    document.documentElement.lang = currentLanguage;
    document.documentElement.dataset.lang = currentLanguage;

    const persist = language => {
        try {
            localStorage.setItem(STORAGE_KEY, language);
        } catch (error) {
            /* Storage can be unavailable when a browser restricts local files. */
        }
    };

    const applyLabels = language => {
        document.querySelectorAll('[data-label-vi][data-label-en]').forEach(element => {
            const value = language === 'en' ? element.dataset.labelEn : element.dataset.labelVi;
            if (!value) return;
            element.setAttribute('aria-label', value);
            if (element.hasAttribute('title')) element.setAttribute('title', value);
        });
    };

    const apply = (language, shouldPersist = true) => {
        currentLanguage = normalize(language);
        document.documentElement.lang = currentLanguage;
        document.documentElement.dataset.lang = currentLanguage;
        document.body?.classList.toggle('lang-en', currentLanguage === 'en');
        document.body?.classList.toggle('lang-vi', currentLanguage === 'vi');
        const pageTitle = currentLanguage === 'en'
            ? document.documentElement.dataset.titleEn
            : document.documentElement.dataset.titleVi;
        if (pageTitle) document.title = pageTitle;

        document.querySelectorAll('[data-app-lang]').forEach(button => {
            const isActive = button.dataset.appLang === currentLanguage;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
        });

        applyLabels(currentLanguage);
        if (shouldPersist) persist(currentLanguage);
        window.dispatchEvent(new CustomEvent('thuanstore:languagechange', { detail: { language: currentLanguage } }));
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-app-lang]').forEach(button => {
            button.addEventListener('click', () => apply(button.dataset.appLang));
        });
        apply(currentLanguage, false);
    });

    window.ThuanStoreLanguage = {
        get: () => currentLanguage,
        set: apply
    };
})();
</script>
    <script data-thuanstore-inline="expert-core.js">
(() => {
    const mount = document.getElementById('expertApp');
    if (!mount) return;

    const getLanguage = () => window.ThuanStoreLanguage?.get?.() || document.documentElement.dataset.lang || 'vi';
    const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    const normalize = value => String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .trim();
    const number = (value, fallback = 0) => {
        const parsed = Number(String(value ?? '').replace(/[^0-9.-]/g, ''));
        return Number.isFinite(parsed) ? parsed : fallback;
    };
    const formatNumber = (value, language = getLanguage(), maximumFractionDigits = 1) => new Intl.NumberFormat(
        language === 'en' ? 'en-US' : 'vi-VN',
        { maximumFractionDigits }
    ).format(value);

    const bilingual = (vi, en) => `<span data-lang="vi">${escapeHtml(vi)}</span><span data-lang="en">${escapeHtml(en)}</span>`;
    const optionMarkup = option => `<option value="${escapeHtml(option.value)}" data-option-vi="${escapeHtml(option.vi)}" data-option-en="${escapeHtml(option.en)}">${escapeHtml(option.vi)}</option>`;

    const renderField = field => {
        const id = `expert-${field.id}`;
        const required = field.required ? ' required' : '';
        const span = field.span === 2 ? ' expert-field-wide' : '';
        const hint = field.hint ? `<small>${bilingual(field.hint.vi, field.hint.en)}</small>` : '';
        if (field.type === 'multiselect') {
            return `<fieldset class="expert-field expert-choice-field${span}" data-field-id="${escapeHtml(field.id)}"${required}>
                <legend>${bilingual(field.label.vi, field.label.en)}</legend>
                <div class="expert-choice-grid">${field.options.map(option => `<label><input type="checkbox" name="${escapeHtml(field.id)}" value="${escapeHtml(option.value)}"><span>${bilingual(option.vi, option.en)}</span></label>`).join('')}</div>
                ${hint}
            </fieldset>`;
        }
        if (field.type === 'select') {
            return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
                <select id="${id}" name="${escapeHtml(field.id)}"${required}>${field.options.map(optionMarkup).join('')}</select>${hint}
            </label>`;
        }
        if (field.type === 'textarea') {
            return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
                <textarea id="${id}" name="${escapeHtml(field.id)}" rows="${field.rows || 5}" data-placeholder-vi="${escapeHtml(field.placeholder?.vi || '')}" data-placeholder-en="${escapeHtml(field.placeholder?.en || '')}" placeholder="${escapeHtml(field.placeholder?.vi || '')}"${required}></textarea>${hint}
            </label>`;
        }
        const inputType = field.type === 'number' ? 'number' : 'text';
        const constraints = [
            field.min !== undefined ? ` min="${field.min}"` : '',
            field.max !== undefined ? ` max="${field.max}"` : '',
            field.step !== undefined ? ` step="${field.step}"` : ''
        ].join('');
        return `<label class="expert-field${span}" for="${id}"><span>${bilingual(field.label.vi, field.label.en)}</span>
            <input id="${id}" type="${inputType}" name="${escapeHtml(field.id)}" data-placeholder-vi="${escapeHtml(field.placeholder?.vi || '')}" data-placeholder-en="${escapeHtml(field.placeholder?.en || '')}" placeholder="${escapeHtml(field.placeholder?.vi || '')}"${constraints}${required}>${hint}
        </label>`;
    };

    const readValues = (form, fields) => Object.fromEntries(fields.map(field => {
        if (field.type === 'multiselect') {
            return [field.id, [...form.querySelectorAll(`input[name="${field.id}"]:checked`)].map(input => input.value)];
        }
        return [field.id, form.elements[field.id]?.value?.trim?.() ?? form.elements[field.id]?.value ?? ''];
    }));

    const setValues = (form, fields, values = {}) => {
        fields.forEach(field => {
            const value = values[field.id];
            if (value === undefined) return;
            if (field.type === 'multiselect') {
                form.querySelectorAll(`input[name="${field.id}"]`).forEach(input => {
                    input.checked = Array.isArray(value) && value.includes(input.value);
                });
                return;
            }
            if (form.elements[field.id]) form.elements[field.id].value = value;
        });
    };

    const resultToText = result => {
        const lines = [result.title, result.summary, ''];
        (result.metrics || []).forEach(metric => lines.push(`${metric.label}: ${metric.value}${metric.note ? ` - ${metric.note}` : ''}`));
        (result.sections || []).forEach(section => {
            lines.push('', section.title);
            (section.items || []).forEach(item => lines.push(`- ${typeof item === 'string' ? item : `${item.title}: ${item.text}`}`));
        });
        if (result.caution) lines.push('', result.caution);
        return lines.join('\n');
    };

    const createResult = (result, config, language) => {
        const output = document.getElementById('expertOutput');
        output.hidden = false;
        output.innerHTML = '';

        const header = document.createElement('header');
        header.className = 'expert-result-header';
        const kicker = document.createElement('span');
        kicker.className = 'expert-result-kicker';
        kicker.textContent = result.kicker || (language === 'en' ? 'EXPERT ANALYSIS' : 'PHÂN TÍCH CHUYÊN MÔN');
        const title = document.createElement('h2');
        title.textContent = result.title;
        const summary = document.createElement('p');
        summary.textContent = result.summary;
        header.append(kicker, title, summary);
        output.append(header);

        if (result.metrics?.length) {
            const metrics = document.createElement('div');
            metrics.className = 'expert-result-metrics';
            result.metrics.forEach(metric => {
                const item = document.createElement('div');
                const label = document.createElement('span');
                const value = document.createElement('strong');
                label.textContent = metric.label;
                value.textContent = metric.value;
                item.append(label, value);
                if (metric.note) {
                    const note = document.createElement('small');
                    note.textContent = metric.note;
                    item.append(note);
                }
                metrics.append(item);
            });
            output.append(metrics);
        }

        (result.sections || []).forEach((section, index) => {
            const block = document.createElement('section');
            block.className = 'expert-result-section';
            const heading = document.createElement('h3');
            heading.innerHTML = `<span>${String(index + 1).padStart(2, '0')}</span>${escapeHtml(section.title)}`;
            block.append(heading);
            if (section.intro) {
                const intro = document.createElement('p');
                intro.textContent = section.intro;
                block.append(intro);
            }
            const list = document.createElement('ul');
            (section.items || []).forEach(entry => {
                const item = document.createElement('li');
                if (typeof entry === 'string') {
                    item.textContent = entry;
                } else {
                    const strong = document.createElement('strong');
                    const text = document.createElement('span');
                    strong.textContent = entry.title;
                    text.textContent = entry.text;
                    item.append(strong, text);
                }
                list.append(item);
            });
            block.append(list);
            output.append(block);
        });

        if (result.table?.rows?.length) {
            const region = document.createElement('div');
            region.className = 'expert-table-region';
            region.tabIndex = 0;
            const table = document.createElement('table');
            const head = document.createElement('thead');
            const headRow = document.createElement('tr');
            result.table.headers.forEach(value => {
                const cell = document.createElement('th');
                cell.scope = 'col';
                cell.textContent = value;
                headRow.append(cell);
            });
            head.append(headRow);
            const body = document.createElement('tbody');
            result.table.rows.forEach(row => {
                const tableRow = document.createElement('tr');
                row.forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    tableRow.append(cell);
                });
                body.append(tableRow);
            });
            table.append(head, body);
            region.append(table);
            output.append(region);
        }

        if (result.caution) {
            const caution = document.createElement('p');
            caution.className = 'expert-caution';
            caution.textContent = result.caution;
            output.append(caution);
        }

        const actions = document.createElement('div');
        actions.className = 'expert-result-actions';
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'secondary-action';
        copy.textContent = language === 'en' ? 'Copy analysis' : 'Sao chép phân tích';
        copy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultToText(result));
                copy.textContent = language === 'en' ? 'Copied' : 'Đã sao chép';
            } catch (error) {
                copy.textContent = language === 'en' ? 'Select and copy manually' : 'Hãy chọn và sao chép thủ công';
            }
        });
        actions.append(copy);

        if (result.download) {
            const download = document.createElement('button');
            download.type = 'button';
            download.className = 'secondary-action';
            download.textContent = result.download.label;
            download.addEventListener('click', () => {
                const blob = new Blob([result.download.content], { type: result.download.type || 'text/csv;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = result.download.filename;
                link.click();
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
            });
            actions.append(download);
        }

        const contact = document.createElement('a');
        contact.className = 'primary-action';
        const brief = (result.brief || resultToText(result)).slice(0, 1800);
        contact.href = `lienhe.html?service=${encodeURIComponent(config.contactService)}&lang=${language}&brief=${encodeURIComponent(brief)}`;
        contact.textContent = language === 'en' ? 'Confirm and discuss implementation' : 'Xác nhận và trao đổi triển khai';
        actions.append(contact);
        output.append(actions);
    };

    const applyLanguage = config => {
        const language = getLanguage();
        mount.querySelectorAll('select option[data-option-vi]').forEach(option => {
            option.textContent = language === 'en' ? option.dataset.optionEn : option.dataset.optionVi;
        });
        mount.querySelectorAll('[data-placeholder-vi][data-placeholder-en]').forEach(field => {
            field.placeholder = language === 'en' ? field.dataset.placeholderEn : field.dataset.placeholderVi;
        });
        document.title = `${language === 'en' ? config.title.en : config.title.vi} - Thuan Store`;
    };

    const mountExpert = config => {
        mount.style.setProperty('--expert-color', config.color);
        mount.innerHTML = `<section class="expert-intro">
            <div>
                <span class="expert-badge">${bilingual('AI CHUYÊN GIA · BETA', 'EXPERT AI · BETA')}</span>
                <h1>${bilingual(config.title.vi, config.title.en)}</h1>
                <p>${bilingual(config.summary.vi, config.summary.en)}</p>
            </div>
            <ol class="expert-flow" aria-label="Workflow">
                <li><span>1</span>${bilingual('Nhập bối cảnh', 'Enter context')}</li>
                <li><span>2</span>${bilingual('Nhận phân tích', 'Get analysis')}</li>
                <li><span>3</span>${bilingual('Kiểm tra và dùng', 'Review and use')}</li>
            </ol>
        </section>
        <div class="expert-workspace">
            <form id="expertForm" class="expert-form">
                <div class="expert-form-heading"><span>${bilingual('DỮ LIỆU ĐẦU VÀO', 'INPUT')}</span><h2>${bilingual(config.formTitle.vi, config.formTitle.en)}</h2><p>${bilingual(config.formSummary.vi, config.formSummary.en)}</p></div>
                <div class="expert-field-grid">${config.fields.map(renderField).join('')}</div>
                <p id="expertFormError" class="expert-form-error" role="alert"></p>
                <div class="expert-form-actions">
                    <button class="primary-action" type="submit">${bilingual(config.submit.vi, config.submit.en)}</button>
                    <button id="expertExample" class="secondary-action" type="button">${bilingual('Điền dữ liệu mẫu', 'Use sample data')}</button>
                    <button id="expertReset" class="text-action" type="reset">${bilingual('Làm lại', 'Reset')}</button>
                </div>
                <p class="expert-local-note">${bilingual('Phân tích chạy trực tiếp trên thiết bị. Dữ liệu nhập tại đây không được gửi lên máy chủ.', 'Analysis runs directly on your device. Data entered here is not sent to a server.')}</p>
            </form>
            <section id="expertOutput" class="expert-output" aria-live="polite" hidden>
                <div class="expert-empty-state"><span>AI</span><h2>${bilingual('Kết quả sẽ xuất hiện tại đây', 'Your result will appear here')}</h2></div>
            </section>
        </div>`;

        const form = document.getElementById('expertForm');
        const output = document.getElementById('expertOutput');
        const error = document.getElementById('expertFormError');
        let lastValues = null;

        form.addEventListener('submit', event => {
            event.preventDefault();
            error.textContent = '';
            if (!form.checkValidity()) {
                error.textContent = getLanguage() === 'en' ? 'Please complete the required fields.' : 'Vui lòng nhập đủ các trường bắt buộc.';
                form.reportValidity();
                return;
            }
            const values = readValues(form, config.fields);
            const missingChoice = config.fields.find(field => field.type === 'multiselect' && field.required && !values[field.id].length);
            if (missingChoice) {
                error.textContent = getLanguage() === 'en' ? 'Please select at least one option.' : 'Vui lòng chọn ít nhất một lựa chọn.';
                form.querySelector(`[data-field-id="${missingChoice.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            try {
                lastValues = values;
                createResult(config.analyze(values, getLanguage(), { normalize, number, formatNumber }), config, getLanguage());
                output.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (analysisError) {
                error.textContent = getLanguage() === 'en' ? 'The input could not be analyzed. Please review it and try again.' : 'Chưa thể phân tích dữ liệu này. Hãy kiểm tra và thử lại.';
            }
        });

        document.getElementById('expertExample').addEventListener('click', () => {
            setValues(form, config.fields, config.example);
            form.requestSubmit();
        });
        form.addEventListener('reset', () => {
            setTimeout(() => {
                output.hidden = true;
                output.innerHTML = '';
                error.textContent = '';
                lastValues = null;
            });
        });
        window.addEventListener('thuanstore:languagechange', () => {
            applyLanguage(config);
            if (lastValues) createResult(config.analyze(lastValues, getLanguage(), { normalize, number, formatNumber }), config, getLanguage());
        });
        applyLanguage(config);
        if (window.location.hash === '#expertApp') setTimeout(() => mount.scrollIntoView({ block: 'start' }), 100);
    };

    window.ThuanExpert = { mount: mountExpert, normalize, number, formatNumber };
})();
</script>
    <script data-thuanstore-inline="expert-catalog.js">
(() => {
    const targetLabels = {
        quote: { vi: 'công cụ báo giá', en: 'quotation tool' },
        website: { vi: 'website', en: 'website' },
        marketplace: { vi: 'sàn thương mại điện tử', en: 'marketplace' },
        amazon: { vi: 'Amazon', en: 'Amazon' }
    };

    const targetRules = {
        quote: {
            vi: ['Bắt buộc: mã hàng, tên bán, đơn vị, giá và nhóm sản phẩm.', 'Tách thông số dùng để tìm kiếm khỏi phần mô tả dài.', 'Mỗi biến thể có mã riêng; không dùng chung mã cho nhiều quy cách.', 'Giá và chiết khấu phải có ngày hiệu lực hoặc phiên bản dữ liệu.'],
            en: ['Required: SKU, selling name, unit, price, and category.', 'Separate searchable specifications from long descriptions.', 'Each variant needs a distinct identifier.', 'Prices and discounts need an effective date or data version.']
        },
        website: {
            vi: ['Bổ sung đường dẫn, tiêu đề hiển thị, mô tả ngắn, trạng thái hàng và ảnh chính.', 'Thuộc tính lọc phải dùng một cách viết thống nhất.', 'Không nhồi thông số vào tên sản phẩm; dùng trường thuộc tính riêng.', 'Chuẩn bị nội dung thay thế cho hình ảnh và thông tin chính sách.'],
            en: ['Add URL slug, display title, short description, availability, and main image.', 'Filter attributes need a consistent vocabulary.', 'Keep specifications out of the product name and in dedicated fields.', 'Prepare image alt text and policy information.']
        },
        marketplace: {
            vi: ['Đối chiếu danh mục bắt buộc và thuộc tính theo từng sàn.', 'Tách biến thể màu, kích thước, dung lượng hoặc quy cách theo chuẩn sàn.', 'Giá, tồn kho và hình ảnh phải đồng bộ với nơi xử lý đơn.', 'Kiểm tra từ bị hạn chế, công dụng và chứng từ ngành hàng trước khi đăng.'],
            en: ['Match each marketplace category and required attributes.', 'Model color, size, capacity, and pack variants to marketplace rules.', 'Synchronize price, availability, and imagery with order operations.', 'Review restricted wording, claims, and category documents before listing.']
        },
        amazon: {
            vi: ['Chuẩn bị mã định danh phù hợp, thương hiệu, nhà sản xuất, quốc gia xuất xứ và thông tin đóng gói.', 'Tiêu đề và bullet phải phản ánh dữ kiện có thể chứng minh.', 'Thuộc tính biến thể phải nhất quán giữa parent và child.', 'Kiểm tra yêu cầu danh mục, tuân thủ, vận chuyển và thuế trước khi mở bán.'],
            en: ['Prepare valid identifiers, brand, manufacturer, country of origin, and package information.', 'Titles and bullets must reflect supportable facts.', 'Variation attributes must stay consistent across parent and child records.', 'Review category, compliance, shipping, and tax requirements before launch.']
        }
    };

    const detectDelimiter = text => {
        const first = text.split(/\r?\n/).find(line => line.trim()) || '';
        const candidates = ['\t', '|', ';', ','];
        return candidates.sort((a, b) => first.split(b).length - first.split(a).length)[0];
    };
    const parsePrice = value => {
        const digits = String(value || '').replace(/[^0-9-]/g, '');
        if (!digits || digits === '-') return null;
        const parsed = Number(digits);
        return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
    };
    const formatPrice = (value, lang) => value === null ? '' : new Intl.NumberFormat(lang === 'en' ? 'en-US' : 'vi-VN').format(value);
    const slug = value => String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/gi, 'd')
        .replace(/[^a-zA-Z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .toUpperCase();
    const safeCsv = value => {
        let text = String(value ?? '');
        if (/^[=+\-@]/.test(text)) text = `'${text}`;
        return `"${text.replaceAll('"', '""')}"`;
    };

    window.ThuanExpert.mount({
        color: '#f59e0b',
        contactService: 'marketplace',
        title: { vi: 'AI chuẩn hóa danh mục sản phẩm', en: 'AI product catalog cleaner' },
        summary: {
            vi: 'Đọc dữ liệu dạng bảng, phát hiện thiếu mã, trùng lặp, giá không hợp lệ và trường chưa thống nhất; sau đó tạo bản CSV đã chuẩn hóa để kiểm tra.',
            en: 'Read tabular product data, detect missing identifiers, duplicates, invalid prices, and inconsistent fields, then produce a reviewable normalized CSV.'
        },
        formTitle: { vi: 'Dán dữ liệu sản phẩm cần kiểm tra', en: 'Paste the product data to inspect' },
        formSummary: {
            vi: 'Mỗi dòng gồm: Tên sản phẩm | Mã hàng | Danh mục | Giá | Đơn vị. Có thể dùng dấu phẩy, chấm phẩy hoặc tab.',
            en: 'Each row contains: Product name | SKU | Category | Price | Unit. Commas, semicolons, pipes, or tabs are supported.'
        },
        submit: { vi: 'Kiểm tra và chuẩn hóa dữ liệu', en: 'Audit and normalize data' },
        fields: [
            { id: 'target', type: 'select', required: true, label: { vi: 'Nơi sẽ sử dụng dữ liệu', en: 'Target use' }, options: [
                { value: 'quote', vi: 'Công cụ báo giá', en: 'Quotation tool' },
                { value: 'website', vi: 'Website', en: 'Website' },
                { value: 'marketplace', vi: 'Sàn thương mại điện tử', en: 'Marketplace' },
                { value: 'amazon', vi: 'Amazon', en: 'Amazon' }
            ] },
            { id: 'delimiter', type: 'select', required: true, label: { vi: 'Dấu phân cách', en: 'Delimiter' }, options: [
                { value: 'auto', vi: 'Tự nhận diện', en: 'Auto detect' },
                { value: 'pipe', vi: 'Dấu |', en: 'Pipe |' },
                { value: 'tab', vi: 'Tab', en: 'Tab' },
                { value: 'semicolon', vi: 'Dấu chấm phẩy ;', en: 'Semicolon ;' },
                { value: 'comma', vi: 'Dấu phẩy ,', en: 'Comma ,' }
            ] },
            { id: 'data', type: 'textarea', required: true, span: 2, rows: 10, label: { vi: 'Dữ liệu sản phẩm', en: 'Product data' }, placeholder: { vi: 'Tên sản phẩm | Mã hàng | Danh mục | Giá | Đơn vị\nĐèn LED bulb 9W | LBL-9W | Đèn LED | 85000 | cái', en: 'Product name | SKU | Category | Price | Unit\nLED bulb 9W | LBL-9W | LED lighting | 85000 | piece' }, hint: { vi: 'Tối đa 500 dòng mỗi lần để trình duyệt xử lý ổn định.', en: 'Up to 500 rows per run for stable browser processing.' } },
            { id: 'prefix', type: 'text', required: false, label: { vi: 'Tiền tố mã đề xuất', en: 'Suggested SKU prefix' }, placeholder: { vi: 'TS', en: 'TS' } },
            { id: 'currency', type: 'select', required: true, label: { vi: 'Đơn vị tiền', en: 'Currency' }, options: [
                { value: 'VND', vi: 'VND - đồng Việt Nam', en: 'VND - Vietnamese dong' },
                { value: 'USD', vi: 'USD - đô la Mỹ', en: 'USD - US dollar' }
            ] }
        ],
        example: {
            target: 'quote', delimiter: 'pipe', prefix: 'MPE', currency: 'VND', data: 'Tên sản phẩm | Mã hàng | Danh mục | Giá | Đơn vị\nĐèn LED Bulb 9W ánh sáng trắng | LBL-9W-W | Đèn LED | 85000 | cái\nĐèn LED Bulb 9W ánh sáng vàng | LBL-9W-Y | Đèn LED | 85000 | cái\nCB 20A 1P |  | Thiết bị điện | 125000 | cái\nCB 20A 1P |  | Thiết bị điện | 125.000đ | chiếc\nỔ cắm âm tường | OC-AM-01 |  | chưa có giá | cái'
        },
        analyze(values, lang, helpers) {
            const isEn = lang === 'en';
            const targetName = targetLabels[values.target]?.[isEn ? 'en' : 'vi'] || values.target;
            const delimiterMap = { pipe: '|', tab: '\t', semicolon: ';', comma: ',' };
            const delimiter = values.delimiter === 'auto' ? detectDelimiter(values.data) : delimiterMap[values.delimiter];
            const lines = values.data.split(/\r?\n/).map(line => line.trim()).filter(Boolean).slice(0, 501);
            if (!lines.length) throw new Error('No rows');
            const firstNormalized = helpers.normalize(lines[0]);
            const hasHeader = /ten|name|san pham|product|sku|ma hang/.test(firstNormalized);
            const dataLines = hasHeader ? lines.slice(1) : lines;
            const prefix = slug(values.prefix || 'TS').slice(0, 8) || 'TS';
            const rows = dataLines.map((line, index) => {
                const parts = line.split(delimiter).map(part => part.trim());
                const name = parts[0] || '';
                const originalSku = parts[1] || '';
                const category = parts[2] || '';
                const rawPrice = parts[3] || '';
                const unit = parts[4] || '';
                const price = parsePrice(rawPrice);
                const suggested = originalSku || `${prefix}-${slug(name).slice(0, 14) || 'ITEM'}-${String(index + 1).padStart(3, '0')}`;
                return { index: index + 1, name, originalSku, sku: suggested, category, price, rawPrice, unit, issues: [] };
            }).slice(0, 500);
            const skuCounts = new Map();
            const nameCounts = new Map();
            rows.forEach(row => {
                if (row.originalSku) skuCounts.set(helpers.normalize(row.originalSku), (skuCounts.get(helpers.normalize(row.originalSku)) || 0) + 1);
                if (row.name) nameCounts.set(helpers.normalize(row.name), (nameCounts.get(helpers.normalize(row.name)) || 0) + 1);
            });
            rows.forEach(row => {
                if (!row.name) row.issues.push(isEn ? 'Missing product name' : 'Thiếu tên sản phẩm');
                if (!row.originalSku) row.issues.push(isEn ? 'Missing SKU; a draft was generated' : 'Thiếu mã hàng; đã tạo mã nháp');
                if (row.originalSku && skuCounts.get(helpers.normalize(row.originalSku)) > 1) row.issues.push(isEn ? 'Duplicate SKU' : 'Trùng mã hàng');
                if (row.name && nameCounts.get(helpers.normalize(row.name)) > 1) row.issues.push(isEn ? 'Duplicate normalized name' : 'Trùng tên sau chuẩn hóa');
                if (!row.category) row.issues.push(isEn ? 'Missing category' : 'Thiếu danh mục');
                if (row.price === null) row.issues.push(isEn ? 'Invalid or missing price' : 'Giá thiếu hoặc không hợp lệ');
                if (!row.unit) row.issues.push(isEn ? 'Missing unit' : 'Thiếu đơn vị');
            });
            const issueRows = rows.filter(row => row.issues.length);
            const duplicateSku = rows.filter(row => row.originalSku && skuCounts.get(helpers.normalize(row.originalSku)) > 1).length;
            const missingSku = rows.filter(row => !row.originalSku).length;
            const invalidPrice = rows.filter(row => row.price === null).length;
            const missingCategory = rows.filter(row => !row.category).length;
            const totalChecks = Math.max(1, rows.length * 5);
            const totalIssues = rows.reduce((sum, row) => sum + row.issues.length, 0);
            const score = Math.max(0, Math.round(100 - (totalIssues / totalChecks) * 100));
            const categoryVariants = new Map();
            rows.filter(row => row.category).forEach(row => {
                const key = helpers.normalize(row.category);
                if (!categoryVariants.has(key)) categoryVariants.set(key, new Set());
                categoryVariants.get(key).add(row.category);
            });
            const inconsistentCategories = [...categoryVariants.values()].filter(set => set.size > 1).length;
            const findings = [
                { title: isEn ? 'Rows requiring review' : 'Dòng cần kiểm tra', text: `${issueRows.length}/${rows.length}` },
                { title: isEn ? 'Missing identifiers' : 'Thiếu mã hàng', text: String(missingSku) },
                { title: isEn ? 'Duplicate identifiers' : 'Mã hàng bị trùng', text: String(duplicateSku) },
                { title: isEn ? 'Invalid prices' : 'Giá không hợp lệ', text: String(invalidPrice) },
                { title: isEn ? 'Missing categories' : 'Thiếu danh mục', text: String(missingCategory) },
                { title: isEn ? 'Category spelling conflicts' : 'Danh mục khác cách viết', text: String(inconsistentCategories) }
            ];
            const nextSteps = isEn
                ? ['Review generated identifiers before importing; draft SKUs are not manufacturer identifiers.', 'Resolve duplicate names by checking whether rows are variants, duplicate records, or different products.', 'Approve one vocabulary for categories and units.', 'Verify prices against the source and attach an effective date.', 'Import into a test copy first and compare row count, price totals, and sample searches.']
                : ['Kiểm tra mã được tạo trước khi nhập; mã nháp không phải mã của nhà sản xuất.', 'Xác định tên trùng là biến thể, bản ghi lặp hay sản phẩm khác nhau.', 'Duyệt một bộ cách viết thống nhất cho danh mục và đơn vị.', 'Đối chiếu giá với nguồn và gắn ngày hiệu lực.', 'Nhập vào bản thử trước; so sánh số dòng, tổng giá và một số tình huống tìm kiếm.'];
            const headers = isEn ? ['Product', 'SKU', 'Category', 'Price', 'Unit', 'Review'] : ['Sản phẩm', 'Mã hàng', 'Danh mục', 'Giá', 'Đơn vị', 'Kiểm tra'];
            const previewRows = rows.slice(0, 20).map(row => [row.name || '—', row.sku, row.category || '—', row.price === null ? '—' : formatPrice(row.price, lang), row.unit || '—', row.issues.join('; ') || (isEn ? 'Ready' : 'Đạt')]);
            const csvHeaders = ['product_name', 'sku', 'category', 'price', 'unit', 'review_notes'];
            const csv = [csvHeaders.map(safeCsv).join(',')].concat(rows.map(row => [row.name, row.sku, row.category, row.price ?? '', row.unit, row.issues.join('; ')].map(safeCsv).join(','))).join('\r\n');

            return {
                title: isEn ? `Catalog audit: ${score}/100 data quality` : `Kiểm tra danh mục: chất lượng dữ liệu ${score}/100`,
                summary: isEn
                    ? `${rows.length} product rows were parsed. ${issueRows.length} require review before the data is used for the ${targetName}.`
                    : `Đã đọc ${rows.length} dòng sản phẩm. Có ${issueRows.length} dòng cần kiểm tra trước khi dùng cho ${targetName}.`,
                metrics: [
                    { label: isEn ? 'Data quality score' : 'Điểm chất lượng', value: `${score}/100`, note: isEn ? 'Based on five required field checks' : 'Dựa trên năm nhóm trường bắt buộc' },
                    { label: isEn ? 'Parsed rows' : 'Dòng đã đọc', value: String(rows.length), note: isEn ? `Delimiter: ${delimiter === '\t' ? 'TAB' : delimiter}` : `Dấu phân cách: ${delimiter === '\t' ? 'TAB' : delimiter}` },
                    { label: isEn ? 'Rows to review' : 'Dòng cần kiểm tra', value: String(issueRows.length), note: isEn ? 'Review before importing' : 'Cần duyệt trước khi nhập' }
                ],
                sections: [
                    { title: isEn ? 'Quality findings' : 'Phát hiện chất lượng dữ liệu', items: findings },
                    { title: isEn ? 'Target-data requirements' : 'Yêu cầu dữ liệu theo nơi sử dụng', items: targetRules[values.target][lang] },
                    { title: isEn ? 'Safe normalization sequence' : 'Trình tự chuẩn hóa an toàn', items: nextSteps }
                ],
                table: { headers, rows: previewRows },
                download: {
                    label: isEn ? 'Download normalized CSV' : 'Tải CSV đã chuẩn hóa',
                    filename: `thuanstore-catalog-${new Date().toISOString().slice(0, 10)}.csv`,
                    content: `\uFEFF${csv}`
                },
                caution: isEn
                    ? 'The generated SKU is only a working draft. Verify manufacturer identifiers, marketplace requirements, tax information, regulated claims, and source prices before importing or publishing.'
                    : 'Mã được tạo chỉ là bản nháp làm việc. Cần kiểm tra mã nhà sản xuất, yêu cầu của sàn, thông tin thuế, nội dung có quy định và giá nguồn trước khi nhập hoặc công bố.',
                brief: isEn
                    ? `Catalog cleanup\nTarget: ${values.target}\nRows: ${rows.length}\nQuality score: ${score}/100\nRows requiring review: ${issueRows.length}`
                    : `Chuẩn hóa danh mục\nNơi sử dụng: ${values.target}\nSố dòng: ${rows.length}\nĐiểm chất lượng: ${score}/100\nDòng cần kiểm tra: ${issueRows.length}`
            };
        }
    });
})();
</script>
